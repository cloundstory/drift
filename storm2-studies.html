<!doctype html>
<html lang="th">

<style>

    --ink:#e8e4dc; --dim:#8b8378; --line:rgba(232,228,220,.14);

  #status{position:fixed;bottom:12px;left:346px;z-index:11;font-size:11.5px;color:var(--dim);

<body>
<iframe id="app" src="index.html"></iframe>
<button id="toggle">ซ่อนแผง</button>
<div id="status">กำลังโหลด…</div>

<div id="panel">
  <h1>ขนาดพายุ — ข้อ 46.6 + 62.7</h1>
  <p class="sub">
    กอล์ฟ 24 ส.ค.: “พายุไม่ได้เกิดง่าย ๆ การเจอต้องอิมแพคพอ ให้ผู้ใช้ได้ลุ้นจริง ๆ”<br>
    ลูกโลกในเฟรมคือของจริงจาก <b>index.html</b> — จดหมายทดสอบอยู่ในหน่วยความจำอย่างเดียว
    <b>ไม่แตะ localStorage</b>
  </p>

  <h2>แบบที่วาด</h2>
  <div class="modes" id="modes"></div>

  <h2>สภาพ</h2>
  <div class="row"><label>กระโชก</label>
    <input type="range" id="sGust" min="50" max="150" value="99"><output id="oGust"></output></div>
  <div class="row"><label>ซูม</label>

    <input type="range" id="sProg" min="0" max="100" value="62"><output id="oProg"></output></div>

  <h2>จังหวะการเจอ</h2>

  <div class="facts" id="facts"></div>
  <button class="act" id="reset">คืนมุมกล้องไปที่พายุ</button>
  <button class="act" id="rec">อัดคลิป 20 วินาที</button>
</div>

<script>
const $=s=>document.querySelector(s);
const ER=6371;
let APP=null, X=null, G=null, LET=null, READY=false;

/* ---------- แบบที่เอามาเทียบ ---------- */
const MODES=[
  {id:'old', name:'A · ของเดิม',
   note:'ขนาดคงที่เป็นพิกเซล คูณด้วย log2(ซูม) แต่ตันที่ 3.2 เท่า — ยิ่งซูมยิ่งหดเทียบของจริง'},
  {id:'geo', name:'B · ก้นหอยเรขาคณิต',
   note:'ขนาดถูกต้องแล้ว แต่กอล์ฟตัดสินว่าเป็นลายวงเวียน ไม่ใช่อากาศ — เก็บไว้เทียบเฉย ๆ'},
  {id:'in',  name:'C · วาดทับด้วยไวยากรณ์เดียวกัน',
   note:'ใช้สีและจังหวะเดียวกับริ้วลม แต่ยังวาดในพิกัดหน้าจอ แยกจากสนามลม — กอล์ฟยังเห็นว่าคนละมิติ'},
  {id:'field', name:'D · พายุอยู่ในสนามลม (ที่เลือก)',
   note:'พายุไม่ใช่สิ่งที่วาดทับอีกต่อไป แต่เป็นกระแสวนในสนามเอง · ริ้วลมรอบ ๆ โค้งเข้าหามันเพราะสนามบอกให้โค้ง · ริ้วพายุเดินบนผิวโลกและถูกวาดด้วย G.streams ตัวเดียวกัน'}
];
let MODE='field';

const ARCS=[
  {id:'off',  name:'ปกติ',            note:'ไม่เปลี่ยนอะไรตอนจดหมายเข้าพายุ (ของเดิม)'},
  {id:'on',   name:'วงเปิดหดตอนพายุ',  note:'ข้อ 35 ที่ไม่เคยเข้าแอปจริง — พายุบังตา มองเห็นแคบลง 38%'}
];
let ARC='on';
/* พายุอยู่เหนือหมอกหรือใต้หมอก — ข้อ 33 ปะทะข้อ 5 · ค่าตั้งต้นตามข้อ 33 */
let ABOVE=true;

/* ---------- รัศมีจริงของพายุ ----------
   ⚠️ นี่คือ "สมมติฐานที่ประกาศไว้" ไม่ใช่ค่าที่อ่านจากพยากรณ์
   พยากรณ์ให้ความเร็วลมต่อจุด ไม่ได้ให้ขอบเขตของพายุ
   จะวัดขอบเขตจากสนามลม 15x15 ก็ได้ แต่ระยะห่างจุดแปรตามความยาวเส้นทาง (750-6000 กม.)
   พายุลูกเดียวกันจะได้ขนาดต่างกันตามเส้นทางที่บังเอิญมองมัน ซึ่งละเมิดข้อ 56 เอง
   จึงผูกกับความแรงอย่างเดียว: ช่วง 800-1800 กม. มาจากข้อ 46.6 ที่กอล์ฟตัดสินไปแล้ว */
function stormKm(inten){ return 800 + (inten-0.25)/0.75*1000; }
function kmToPx(km){ return G.R*Math.sin(km/ER); }

/* ================================================================
   พายุที่สร้างด้วย "สนามลม" ไม่ใช่สมการวงกลม

   กอล์ฟ 24 ส.ค.: "ดูเป็นเรขาคณิตสุด ๆ ความเป็นศิลป์ต่างจากธีมแอปลิบลับ
   ใช้เส้นลมเข้าช่วย ให้ดูน่ากลัวและน่าเคารพในเวลาเดียวกัน
   ทั้งแอปต้องส่งเสียงเดียวกัน"

   ต้นเหตุที่วัดได้ — พายุพูดคนละภาษากับแอปสองชั้น:
   1. วิธีสร้าง — ริ้วลมทั้งแอปเกิดจาก *เดินอนุภาคผ่านสนาม* แต่พายุเป็นสมการวงกลมวาดตรง ๆ
   2. สี — ริ้วลมใช้ rgba(84,90,104) เทาอมฟ้า · พายุเดิมใช้ rgba(232,228,220) หมึกอุ่น
      คนละวัสดุกันตั้งแต่ยังไม่ทันดูรูปทรง

   แก้โดยให้พายุ *เป็นลม* จริง ๆ: สนามหมุนวนแบบ Rankine + การไหลเข้าหาตา
   แล้ววาดด้วยไวยากรณ์เดียวกับ G.streams เป๊ะ — along จางไปตามเส้น · คลื่นสว่างวิ่งไล่ ·
   ความหนาแปรตามความแรง · สีเดียวกัน
   ผลพลอยได้: ไม่ต้องมี "โหมดอยู่ในพายุ" แยกอีกต่อไป พอพายุใหญ่เกินจอ
   อนุภาคก็เต็มจอและตาพายุหลุดออกนอกเฟรมไปเอง — โหมดเกิดขึ้นเองจากความจริง
   ================================================================ */

/* ================================================================
   D · พายุเป็นส่วนหนึ่งของสนามลม ไม่ใช่ภาพที่วาดทับ

   กอล์ฟ 25 ส.ค.: "พายุมีมวลมาก ริ้วลมโดยรอบต้องได้รับอิทธิพลของพายุไปด้วย
   แต่ในคลิปเราทำสองส่วนแยกออกจากกัน มันเลยไม่อยู่ในมิติเดียวกัน"

   ถูกต้อง และลึกกว่าสามข้อก่อนหน้า — ปัญหาไม่ใช่แค่ *หน้าตา* แต่เป็น *พิกัด*:
   ริ้วลมมีชีวิตอยู่บนผิวทรงกลม (เป็นจุด XYZ ที่ถูกหมุนและฉายทุกเฟรม)
   แต่พายุถูกวาดในพิกัดหน้าจอ — หมุนลูกโลกแล้วริ้วลมหมุนตามโลก
   ส่วนพายุยังเป็นวงแบนหันหน้าเข้ากล้องเสมอ คนละมิติกันจริง ๆ

   แก้โดยยุบพายุเข้าไปใน *สนามลม* เอง:
   1. `wfAt()` ถูกสวมทับให้บวกกระแสวนของพายุลงไป → ริ้วลมรอบพายุโค้งเข้าหามันเอง
   2. ริ้วของพายุเองก็เดินผ่านสนามเดียวกันในพิกัดภูมิศาสตร์ แล้วต่อท้ายผลของ driftStreams
      → ถูกวาดด้วย G.streams ตัวเดียวกัน สีเดียวกัน จางตามความลึกเหมือนกัน
   3. ไม่มีตัววาดพายุแยกอีกต่อไป — wxStorm ถูกปิด

   ⚠️ กระแสวนนี้ห้ามแตะการคำนวณเส้นทาง — รัศมีพายุเป็นสมมติฐาน ไม่ใช่ข้อมูลจริง
   ถ้าเอาสมมติฐานไปกำหนดเส้นทางจริง = ให้ของที่แต่งขึ้นตัดสินผลลัพธ์ ซึ่งขัดทั้งเล่มนี้
   จึงเปิดเฉพาะตอนสร้างริ้วลม ปิดเสมอตอน driftRun
   ================================================================ */
/* NEAR/FAR = ช่วงที่กระแสวนกลืนสนามพยากรณ์ วัดเป็นสัดส่วนของรัศมีพายุ
   ค่าแรก 0.25/1.30 แคบเกินไป — ที่ขอบพายุพอดี กระแสวนมีน้ำหนักแค่ 20%
   ลมพยากรณ์เลยชนะ ริ้วจึงไหลผ่านไปเฉย ๆ ไม่ถูกดูดเข้าหาตา
   (วัดได้: ทั้งเส้นเดินเข้าหาตาแค่ 134 กม. จากที่ควรถึงตา)
   ซึ่งตรงกับที่กอล์ฟบอกว่าพายุมีมวลมาก อิทธิพลต้องแผ่ไปไกลกว่าตัวมันเอง */
const VORTEX={ INFLOW_DEG:38, NEAR:0.55, FAR:2.40 };
let CUR_STORMS=null;

/* พายุทุกลูกของจดหมายฉบับนี้ ในพิกัดภูมิศาสตร์ */
function stormsOf(L){
  const out=[];
  L.lg.forEach((l,i)=>{
    if(l[6]<=0) return;
    const p=X.posAt(L,(i+0.5)/L.lg.length);
    const g=l[7]??l[2];
    const inten=X.stormIntensity(g);
    out.push({ lat:p.lat, lng:p.lng, R:stormKm(inten), inten, gust:g,
               peak:Math.max(12,l[2]),                 /* ใช้ลมต่อเนื่อง เพราะสนามเก็บลมต่อเนื่อง */
               spin: p.lat>=0 ? 1 : -1 });             /* ข้อ 34 */
  });
  return out;
}

/* ลมของพายุที่จุดหนึ่ง คืนเป็น e,n หน่วยเดียวกับ wfAt
   ทิศ: ลมพัดตามเส้นสัมผัส แล้วเฉียงเข้าหาตาอีก INFLOW องศา
   ซีกเหนือทวนเข็ม ซีกใต้ตามเข็ม → รวมเป็นสูตรเดียว brg-(90+inflow)*spin */
function vortexEN(lat,lng,S){
  const d=APP.gcDist({lat:S.lat,lng:S.lng},{lat,lng});
  const rn=d/S.R;
  if(rn>VORTEX.FAR) return null;
  const WALL=0.16;
  const v=(rn<WALL ? rn/WALL : Math.pow(WALL/rn,0.5))*S.peak;
  const brg=APP.bearing({lat:S.lat,lng:S.lng},{lat,lng});
  const wb=(brg-(90+VORTEX.INFLOW_DEG)*S.spin)*Math.PI/180;
  /* น้ำหนักการกลืน: ใกล้ตา สนามคือพายุล้วน · ไกลออกไปคืนเป็นลมตามพยากรณ์
     ไม่ได้ "เติมพลังงาน" เข้าไป แต่ *จัดรูป* สนามตรงที่ตาราง 15x15 หยาบเกินจะเห็นการหมุน */
  const k=1-Math.min(1,Math.max(0,(rn-VORTEX.NEAR)/(VORTEX.FAR-VORTEX.NEAR)));
  const blend=k*k*(3-2*k);
  return { e:Math.sin(wb)*v, n:Math.cos(wb)*v, blend, rn };
}

/* สนามรวม = ลมพยากรณ์ที่ถูก *หมุนทิศ* เข้าหาพายุ ไม่ใช่บวกพลังงานเข้าไป

   รอบแรกผสมเวกเตอร์ตรง ๆ ซึ่งขัดกับหลักที่เขียนไว้เอง และไม่ได้ผลด้วย:
   กระแสวนที่ขอบพายุแรงราว 16 กม./ชม. ขณะที่ลมมหาสมุทรใต้แถวนั้นแรง 50
   ผสมแล้วทิศจึงถูกลมพยากรณ์ดึงกลับ ริ้วไหลผ่านไปเฉย ๆ (วัดได้: เข้าหาตาแค่ 134 กม.)

   หมุนทิศอย่างเดียวถูกต้องกว่าทั้งทางหลักการและทางผล — ความเร็วลมเป็นข้อมูลจริงจากพยากรณ์
   ห้ามแตะ · ส่วนการหมุนวนคือรูปที่เรารู้ว่ามีอยู่แต่ตาราง 15x15 หยาบเกินจะเก็บได้ */
function blendStorms(w,lat,lng){
  if(!CUR_STORMS) return w;
  /* ⚠️ ต้องรวมอิทธิพลของพายุทุกลูก *ก่อน* แล้วค่อยหมุนครั้งเดียว
     ของเดิมวนหมุนทีละลูก ลูกท้ายสุดจึงลบผลของลูกแรกทิ้ง
     (วัดได้: blend ขึ้นถึง 1.0 แต่ทิศที่ได้เพี้ยนจากที่ควรเป็น 31° เพราะโดนลูกถัดไปหมุนต่อ)
     เส้นทางที่ผ่านพายุหลายลูกติดกันเป็นเรื่องปกติ ไม่ใช่กรณีพิเศษ */
  let ve=0, vn=0, wt=0, calm=1;
  for(const S of CUR_STORMS){
    const v=vortexEN(lat,lng,S);
    if(!v||v.blend<=0.002) continue;
    const m=Math.hypot(v.e,v.n)||1;
    ve+=v.e/m*v.blend; vn+=v.n/m*v.blend;
    wt=Math.max(wt,v.blend);
    calm=Math.min(calm, 1-v.blend*Math.max(0,1-v.rn/0.22)*0.8);
  }
  if(wt<=0.002) return w;
  const sp=Math.hypot(w.e,w.n);
  if(sp<0.01) return w;
  const a0=Math.atan2(w.e,w.n), a1=Math.atan2(ve,vn);
  let d=a1-a0; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  const a=a0+d*wt;
  w.e=Math.sin(a)*sp*calm; w.n=Math.cos(a)*sp*calm; w.spd=sp*calm;
  return w;
}

/* ริ้วของตัวพายุเอง — เดินในพิกัดภูมิศาสตร์ผ่านสนามรวม
   คืนออกมาในรูปเดียวกับ driftStreams เป๊ะ (อาเรย์ของจุด XYZ + .spd + .w)
   จึงถูกวาดด้วย G.streams ตัวเดียวกันโดยไม่ต้องมีตัววาดพายุแยก */
const _ssCache=new Map();
function stormStrands(L,tf){
  /* ความหนาแน่นต้องคงที่ *บนจอ* ไม่ใช่บนพื้นโลก
     ผูกกับขนาดจริงอย่างเดียว → ซูมเข้าแล้วริ้วกระจายออกจนพายุจางหาย (เจอในคลิปรอบแรก)
     จึงต้องมีระดับซูมอยู่ในคีย์แคชด้วย */
  const zb=Math.round(Math.log2(Math.max(1,G.zoom))*2)/2;
  const key=L.id+':'+Math.round(clamp(tf||0,0,1)*6)+':'+zb;
  if(_ssCache.has(key)) return _ssCache.get(key);
  const zdens=clamp(Math.sqrt(kmToPx(1200)/150),1,2.4);
  const field=APP.wfOf(L);
  const out=[];
  (CUR_STORMS||[]).forEach((S,si)=>{
    /* ความหนาแน่นคงที่ต่อพื้นที่ · พายุแรงกว่ามีริ้วแน่นกว่า = ตัวตนของมัน

       ⚠️ จำนวนนี้คุมเฟรมโดยตรง — วัดแล้วว่า 380 ริ้ว x 52 ก้าว ทำให้เฟรมขึ้นเป็น p95 14ms
       จากเดิม 0.70ms ซึ่งชนงบ 16ms และมือถือยังไม่เคยทดสอบ
       ครึ่งหนึ่งของจำนวนเดิมยังอ่านออกว่าเป็นพายุ เพราะริ้วรอบข้างช่วยเล่าอยู่แล้ว
       ถ้าจะเพิ่มกลับ ต้องวัดเฟรมบนมือถือจริงก่อน */
    /* ⚠️ G.streams ไล่จางจาก *ต้นเส้น* ไป *ปลายเส้น* เพื่อบอกทิศลม (along=pow(1-f,.75))
       ถ้าปล่อยให้ทุกริ้ววิ่งเข้าไปจบที่ตาพายุ ตาจะกลายเป็นจุดที่จางที่สุดพอดี — ซึ่งเกิดขึ้นจริง
       จึงแบ่งเป็นสองบทบาท:
       - ริ้วยาว หว่านทั่วจาน → วิ่งเข้าหาตาแล้วซ้อนกันเป็นกำแพงตา (ให้ความหนาแน่น)
       - ริ้วสั้น หว่านชิดตา → *เริ่ม* ตรงกำแพงตาพอดี จึงสว่างที่สุดตรงนั้น (ให้ความเข้ม) */
    const layers=[
      {n:Math.round((14+S.inten*10)*zdens), steps:46, w:1.00, r0:0.10, r1:1.05},
      {n:Math.round((20+S.inten*18)*zdens), steps:13, w:0.72, r0:0.07, r1:0.42}
    ];
    layers.forEach((LY,li)=>{
      for(let i=0;i<LY.n;i++){
        const h1=hsh(i*7.3+li*131.7+si*17.9), h2=hsh(i*19.1+li*57.3+si*3.1);
        const rad=S.R*(LY.r0+LY.r1*Math.sqrt(h1));
        let p=APP.destPoint(S.lat,S.lng,h2*360,rad);
        const stepKm=S.R*0.055;
        const pts=[APP.toXYZ(p.lat,p.lng)];
        let spdAcc=0, ok=true;
        for(let k=0;k<LY.steps;k++){
          let w=field ? APP.wfAt(field,p.lat,p.lng,clamp(tf||0,0,1)) : {e:0,n:0,spd:0};
          const sp=Math.hypot(w.e,w.n);
          if(sp<0.5){ ok=false; break; }
          spdAcc+=sp;
          p=APP.destPoint(p.lat,p.lng, Math.atan2(w.e,w.n)*180/Math.PI, stepKm);
          pts.push(APP.toXYZ(p.lat,p.lng));
          if(APP.gcDist({lat:S.lat,lng:S.lng},p) < S.R*0.085) break;   /* ถึงกำแพงตา */
        }
        if(ok&&pts.length>2){ pts.spd=spdAcc/LY.steps; pts.w=LY.w; out.push(pts); }
      }
    });
  });
  if(_ssCache.size>30) _ssCache.clear();
  _ssCache.set(key,out);
  return out;
}

/* สนามลมของพายุ ณ จุดที่ห่างจากตาไป (dx,dy)
   Rankine vortex: ความเร็วไต่ขึ้นจนถึงกำแพงตา แล้วค่อย ๆ ตกลงข้างนอก
   spin: +1 ทวนเข็ม (ซีกเหนือ) · -1 ตามเข็ม (ซีกใต้) — ข้อ 34 */
function vortexAt(dx,dy,R,spin,inflow){
  const r=Math.hypot(dx,dy)||1e-6, rn=r/R;
  const WALL=0.16;
  const v = rn<WALL ? (rn/WALL) : Math.pow(WALL/rn, 0.5);
  const tx=-dy/r*spin, ty=dx/r*spin;
  /* มุมไหลเข้าเกือบคงที่ในอากาศเปิด — ของจริงลมพัดเฉียงเข้าหาตาราว 20-30° ตลอด
     ถ้าให้แรงไหลเข้าตกเป็นศูนย์ที่ขอบ อนุภาคจะ *โคจรเป็นวงกลม* ไม่ใช่พันเข้าหาตา

     แต่ *ข้างใน* กำแพงตาต้องกลับกัน — ลมที่นั่นเกือบหมุนเป็นวงล้วน แทบไม่ไหลเข้าแล้ว
     ถ้าปล่อยให้ไหลเข้าเท่าเดิม ทุกริ้วจะวิ่งไปกองที่จุดเดียวกันจนเป็นปมเส้นพันกัน
     ซึ่งคือสิ่งที่เห็นตอนซูมลึก — พอลดมุมลงตามจริง ตาพายุจะเกิดเป็นวงว่างขึ้นมาเอง */
  const wall=Math.min(1,Math.max(0,(rn-0.07)/0.26));
  const q=inflow*(0.75+0.45*Math.min(1,rn))*(wall*wall*(3-2*wall));
  return { x:(tx - dx/r*q), y:(ty - dy/r*q), v };
}
/* แฮชคงที่ ห้ามใช้ Math.random — ผู้ส่งกับผู้รับต้องได้ภาพเดียวกัน */
const hsh=n=>{ const s=Math.sin(n*12.9898)*43758.5453; return s-Math.floor(s); };

/* เดินอนุภาคผ่านสนาม → ได้เส้นโค้งที่มีที่มา ไม่ใช่ส่วนโค้งวงกลม
   แคชไว้ต่อขนาด เพราะรูปร่างไม่เปลี่ยนตามเวลา มีแต่คลื่นสว่างที่วิ่ง */
const _vcache=new Map();
function vortexLines(R,spin,inten,W,H){
  const key=Math.round(R/8)+'|'+spin+'|'+Math.round(inten*8)+'|'+Math.round(W/40)+'x'+Math.round(H/40);
  if(_vcache.has(key)) return _vcache.get(key);
  /* หว่านเฉพาะบริเวณที่ "เป็นพายุจริง" และ "มองเห็นได้" ตัดกัน
     ผูกกับจออย่างเดียว → ตอนพายุเล็ก อนุภาคไปตกนอกพายุ ได้เส้นจางเต็มจอแทนที่จะเป็นก้อน
     ผูกกับ R อย่างเดียว → ตอนพายุใหญ่กว่าจอ อนุภาคส่วนใหญ่ตกนอกเฟรม เสียเปล่า */
  const reach=Math.min(R*1.15, Math.hypot(W,H)*0.75);
  /* ความหนาแน่นต่อพื้นที่ต้องคงที่ ไม่งั้นพายุใหญ่จะกลายเป็นความว่างเปล่า (บทเรียนข้อ 29)
     พายุคือ *ลมที่แน่นกว่าลมธรรมดา* — ความหนาแน่นคือตัวตนของมัน ไม่ใช่สีหรือรูปทรง */
  const dens=Math.max(1, Math.sqrt(reach/90));
  const lines=[];
  /* สองชั้นแบบเดียวกับองก์ปล่อยที่กอล์ฟผ่านแล้ว
     แกนหลัก: น้อย ยาว ช้า = ความน่าเคารพ · ริ้วรอง: เยอะ สั้น เร็ว = ความน่ากลัว */
  const layers=[
    {n:Math.round((16+inten*10)*dens), steps:54, step:R*0.055, w:1.00, spd:0.55},
    {n:Math.round((30+inten*26)*dens), steps:26, step:R*0.040, w:0.62, spd:1.00}
  ];
  layers.forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      const h1=hsh(i*7.3+li*131.7), h2=hsh(i*19.1+li*57.3);
      /* กระจายตามรากที่สองเพื่อให้ความหนาแน่นต่อพื้นที่สม่ำเสมอ
         ไม่งั้นจะกองแน่นตรงกลางจนตาพายุตัน */
      const rad=reach*(0.10+0.90*Math.sqrt(h1));
      const th=h2*Math.PI*2;
      let px=Math.cos(th)*rad, py=Math.sin(th)*rad;
      /* มุมไหลเข้าต่างกันเล็กน้อยรายเส้น — ถ้าเท่ากันหมด ทุกเส้นจะซ้อนเป็นวงเดียวกันเป๊ะ
         ธรรมชาติไม่มีอะไรเท่ากันพอดี และตานี่แหละที่จับได้ว่าเป็นของทำ */
      const inflow=0.30+hsh(i*5.9+li*23.1)*0.28;
      const pts=[]; let spdAcc=0;
      for(let k=0;k<L.steps;k++){
        pts.push(px,py);
        const f=vortexAt(px,py,R,spin,inflow);
        spdAcc+=f.v;
        const st=L.step*(0.45+f.v*1.05);
        px+=f.x*st; py+=f.y*st;
        if(Math.hypot(px,py)<R*0.055) break;       /* ถึงกำแพงตาแล้วหยุด — เกิดรูตรงกลางเอง */
      }
      if(pts.length>=6) lines.push({pts, spd:(spdAcc/L.steps), w:L.w, ph:hsh(i*3.7+li*11.3), sp:L.spd});
    }
  });
  if(_vcache.size>40) _vcache.clear();
  _vcache.set(key,lines);
  return lines;
}

/* วาดพายุ — ไวยากรณ์เดียวกับ G.streams ทุกบรรทัด */
function stormField(ctx,cx,cy,t,inten,rpx,W,H,spin){
  const lines=vortexLines(rpx,spin,inten,W,H);
  const cover=Math.min(1.6, rpx/Math.min(W,H));

  /* ม่านมืด — พายุบังแสง · ยิ่งกลืนจอยิ่งมืด แต่ไม่มืดจนกลบลมของตัวเอง
     นี่คือส่วนที่ทำให้ "น่ากลัว" โดยไม่ต้องเพิ่มเส้นสักเส้น */
  if(cover>0.25){
    const veil=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rpx,Math.hypot(W,H)*0.55));
    const dark=Math.min(0.34,(cover-0.25)*0.42)*(0.45+inten*0.55);
    veil.addColorStop(0,   'rgba(6,9,16,'+(dark*0.35).toFixed(3)+')');
    veil.addColorStop(0.55,'rgba(6,9,16,'+dark.toFixed(3)+')');
    veil.addColorStop(1,   'rgba(6,9,16,0)');
    ctx.save(); ctx.fillStyle=veil; ctx.fillRect(0,0,W,H); ctx.restore();
  }

  ctx.save(); ctx.lineCap='round';
  const B=new Map();
  for(const ln of lines){
    const P=ln.pts, last=P.length/2-1;
    if(last<1) continue;
    const li=clamp(ln.spd*(0.45+inten*0.85),.12,1);
    /* คลื่นสว่างวิ่งไล่ไปตามริ้ว เหลื่อมเฟสกันทีละเส้น — สูตรเดียวกับ G.streams */
    const head=((t*(0.17+li*0.30)*ln.sp)+ln.ph*1.35)%1.35;
    for(let i=1;i<=last;i++){
      const x0=cx+P[(i-1)*2], y0=cy+P[(i-1)*2+1];
      const x1=cx+P[i*2],     y1=cy+P[i*2+1];
      if((x0<-8&&x1<-8)||(x0>W+8&&x1>W+8)) continue;
      if((y0<-8&&y1<-8)||(y0>H+8&&y1>H+8)) continue;
      const f=i/last;
      const along=Math.pow(1-f,.75);
      const near=Math.max(0,1-Math.abs(f-head)*4.5);
      let a=ln.w*((.20+li*.42)*along + near*(.30+li*.55)*along);
      if(a<=.006) continue;
      if(a>.55) a=.55;
      const ai=Math.min(17,Math.round(a*32));
      const wi=Math.min(3,Math.round(((.8+li*.8)*(1+near*.6)-.7)*1.6));
      const key=ai*4+wi;
      let arr=B.get(key); if(!arr) B.set(key,arr=[]);
      arr.push(x0,y0,x1,y1);
    }
  }
  B.forEach((arr,key)=>{
    /* สีเดียวกับริ้วลมของแอปเป๊ะ — นี่คือจุดที่ทำให้พูดภาษาเดียวกัน */
    ctx.strokeStyle='rgba(84,90,104,'+((key>>2)/32).toFixed(3)+')';
    ctx.lineWidth=.7+(key&3)/1.6;
    ctx.beginPath();
    for(let i=0;i<arr.length;i+=4){ ctx.moveTo(arr[i],arr[i+1]); ctx.lineTo(arr[i+2],arr[i+3]); }
    ctx.stroke();
  });

  /* ไม่วาดวงตาพายุ — วงกลมเส้นเดียวคือรูปทรงเรขาคณิตที่กอล์ฟไม่เอา
     ตาพายุเกิดเองจากการที่อนุภาคหยุดเดินเมื่อถึงกำแพงตา กลายเป็นรูที่มีขอบเป็นลม
     ซึ่งคือวิธีที่ตาพายุจริงปรากฏในภาพถ่ายดาวเทียม */
  ctx.restore();
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- ก้นหอยขนาดใหญ่ (เก็บไว้เทียบ — กอล์ฟตัดสินแล้วว่าไม่เอา) ----------
   บทเรียนข้อ 29: ขยายขนาดต้อง *เพิ่มความหนาแน่น* ไม่ใช่ยืดเส้นเดิมให้ยาวขึ้น
   ของเดิมมี 7+3 แขน · ที่ 24 px นั่นคือเส้นแน่น แต่ที่ 500 px มันคือความว่างเปล่า
   จำนวนแขนจึงต้องโตตามรากที่สองของรัศมี ให้ "เส้นต่อพื้นที่" คงที่ */
function stormSpiral(ctx,x,y,t,inten,rpx){
  const col=a=>'rgba(232,228,220,'+a+')';
  const dens=Math.max(1,Math.sqrt(rpx/26));          /* 26 px = ขนาดอ้างอิงของเดิม */
  const bands=[
    {arms:Math.round(7*dens), r0:.46, len:.66, sweep:.95, spin:.34, a:1.00, w:1.00},
    {arms:Math.round(3*dens), r0:.26, len:.26, sweep:.70, spin:.62, a:1.35, w:1.15}
  ];
  const steps=Math.round(Math.min(64, 18+dens*10));
  ctx.save(); ctx.lineCap='round';
  for(const b of bands){
    for(let a=0;a<b.arms;a++){
      const off=a*Math.PI*2/b.arms + t*(b.spin+inten*.5);
      const r0=rpx*(b.r0 + (a%2)*.10);
      const sweep=Math.PI*(b.sweep+inten*.5);
      const head=((t*(.5+inten*.7))+a*0.21)%1.3;
      for(let i=0;i<steps;i++){
        const f0=i/steps, f1=(i+1)/steps;
        const th0=off+f0*sweep, th1=off+f1*sweep;
        const rr0=r0+rpx*b.len*Math.pow(f0,.85), rr1=r0+rpx*b.len*Math.pow(f1,.85);
        const along=Math.pow(1-f0,.85);
        const near=Math.max(0,1-Math.abs(f0-head)*4.2);
        const a1=((.12+inten*.34)*along + near*(.15+inten*.28)*along)*b.a;
        if(a1<.01) continue;
        ctx.strokeStyle=col(Math.min(.55,a1).toFixed(3));
        ctx.lineWidth=((.85+inten*.95)*(1-f0*.5))*(1+near*.7)*b.w;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(th0)*rr0, y+Math.sin(th0)*rr0);
        ctx.lineTo(x+Math.cos(th1)*rr1, y+Math.sin(th1)*rr1);
        ctx.stroke();
      }
    }
  }
  /* ตาพายุ — ขนาดตามสัดส่วนจริง ไม่ใช่ค่าคงที่ */
  ctx.lineWidth=Math.max(.9, rpx*0.006);
  ctx.strokeStyle=col((.26+inten*.22).toFixed(3));
  ctx.beginPath(); ctx.arc(x,y,rpx*.20,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

/* ---------- C: โหมดอยู่ในพายุ ----------
   จากในพายุจริงไม่มีใครเห็นตาพายุ เห็นแค่แถบเมฆพาดผ่านหัวเป็นชั้น ๆ
   จึงวาดเป็นส่วนโค้งของวงกลมยักษ์ที่ศูนย์กลางอยู่นอกจอ ไม่มีจุดรวมสายตา
   ความเข้มต้องสู้ริ้วลมได้ ไม่งั้นพายุจะจมหายไปในลมของตัวเอง */
function stormInside(ctx,cx,cy,t,inten,W,H,rpx){
  const col=a=>'rgba(232,228,220,'+a+')';
  const diag=Math.hypot(W,H);
  ctx.save(); ctx.lineCap='round';

  /* 1) ม่านมืด — พายุบังแสง เป็นสิ่งเดียวที่บอกว่า "เราอยู่ข้างใน" ได้ทันทีโดยไม่ต้องอ่านเส้น */
  const veil=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rpx,diag*0.6));
  const dark=0.10+inten*0.26;
  veil.addColorStop(0,   'rgba(6,9,16,'+(dark*0.30).toFixed(3)+')');
  veil.addColorStop(0.55,'rgba(6,9,16,'+(dark).toFixed(3)+')');
  veil.addColorStop(1,   'rgba(6,9,16,0)');
  ctx.fillStyle=veil; ctx.fillRect(0,0,W,H);

  /* 2) แถบพายุ — ส่วนโค้งซ้อนชั้น เคลื่อนเข้าหาศูนย์กลางช้า ๆ */
  const bands=Math.round(7+inten*7);
  for(let b=0;b<bands;b++){
    const f=((b/bands) + (t*0.035))%1;
    const rr=rpx*(0.22+f*1.05);
    const fade=Math.sin(f*Math.PI);                 /* จางที่ขอบทั้งสองด้าน ไม่มีขอบตัด */
    const a=(0.10+inten*0.26)*fade;
    if(a<0.012) continue;
    ctx.strokeStyle=col(Math.min(.5,a).toFixed(3));
    ctx.lineWidth=(1.0+inten*2.2)*fade;
    /* วงไม่กลมสนิท — พายุจริงเป็นแถบขาด ๆ ไม่ใช่วงเวียน */
    const segs=Math.round(9+inten*7);
    for(let s=0;s<segs;s++){
      const gap=0.30+0.22*Math.sin(b*2.1+s*1.7+t*0.2);
      const a0=(s/segs)*Math.PI*2 + t*(0.05+inten*0.10)*(1+b*0.05);
      const a1=a0+(Math.PI*2/segs)*(1-gap);
      ctx.beginPath(); ctx.arc(cx,cy,rr,a0,a1); ctx.stroke();
    }
  }

  /* 3) ริ้วที่กวาดผ่านทั้งจอ — สื่อว่าลมพัดผ่าน *ตัวเรา* ไม่ใช่หมุนอยู่ตรงโน้น
     ทุกริ้วเป็นเส้นสัมผัสวงรอบศูนย์กลาง จึงอ่านเป็นการหมุนโดยไม่ต้องเห็นตา */
  const n=Math.round(16+inten*22);
  for(let i=0;i<n;i++){
    const seed=i*97.13;
    const r1=(Math.sin(seed)*0.5+0.5), r2=(Math.sin(seed*1.7)*0.5+0.5);
    const ph=((t*(0.13+inten*0.20)+r1)%1);
    /* วางตัวรอบศูนย์กลาง แล้วให้เคลื่อนตามวงในระหว่างช่วงชีวิต */
    const rad=rpx*(0.25+r2*0.95);
    const ang=r1*Math.PI*2 + ph*(0.5+inten*0.8);
    const px=cx+Math.cos(ang)*rad, py=cy+Math.sin(ang)*rad;
    if(px<-diag*.2||px>W+diag*.2||py<-diag*.2||py>H+diag*.2) continue;
    const tang=ang+Math.PI/2;
    const len=diag*(0.10+r2*0.22);
    const life=Math.sin(ph*Math.PI);
    const a=(0.10+inten*0.24)*life;
    if(a<0.012) continue;
    ctx.strokeStyle=col(Math.min(.5,a).toFixed(3));
    ctx.lineWidth=(0.9+inten*1.8)*life;
    ctx.beginPath();
    const steps=9;
    for(let k=0;k<=steps;k++){
      const u=k/steps-0.5;
      /* โค้งตามวง ไม่ใช่เส้นตรง — ความโค้งมาจากรัศมีจริงตรงนั้น */
      const th=ang+u*len/Math.max(rad,1);
      const x=cx+Math.cos(th)*rad, y=cy+Math.sin(th)*rad;
      k?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- ตัวแทน wxStorm ที่จะยัดเข้าไปในแอป ---------- */
function makeStorm(orig){
  return function(ctx,x,y,t,intensity,rich,scale){
    if(MODE==='old') return orig(ctx,x,y,t,intensity,rich,scale);
    const W=G.W, H=G.H;
    const rpx=kmToPx(stormKm(intensity));
    const screen=Math.min(W,H);
    /* ขนาดที่ wxStorm วาดจริง = size*(r0+len) ของแถบนอก = size*1.12
       จึงต้องแก้สมการกลับ เพื่อให้ขอบนอกของก้นหอยตรงกับรัศมีภูมิศาสตร์ */
    const s=rpx/((9+intensity*15)*1.12);
    if(MODE==='geo'){
      if(rpx<30) return orig(ctx,x,y,t,intensity,rich,s);
      return stormSpiral(ctx,x,y,t,intensity,rpx);
    }
    /* MODE==='in' — สนามลม ไม่มีโหมดแยกอีกแล้ว
       ขนาดเล็ก อนุภาคกองรอบตา · ขนาดใหญ่ อนุภาคเต็มจอและตาหลุดออกนอกเฟรมเอง */
    stormField(ctx,x,y,t,intensity,rpx,W,H,SPIN);
  };
}
/* ทิศหมุนตามซีกโลก — ซีกเหนือทวนเข็ม ซีกใต้ตามเข็ม (ข้อ 34)
   ตั้งใหม่ทุกครั้งที่เลือกช่วงพายุ เพราะพายุคนละลูกอยู่คนละซีกได้ */
let SPIN=1;

/* ---------- ประกอบเข้ากับแอป ---------- */
function boot(){
  APP=$('#app').contentWindow;
  try{
    APP.eval('window.__x={G,CFG,store,posAt,fitKm,letterState,posVAt,simulate,gcDist,'
            +'wfPoints,uid,fetchWx,stormIntensity,revealKm,sevOf,'
            +'get sel(){return selected}, set sel(v){selected=v}}');
    X=APP.__x; G=X.G;
  }catch(e){ $('#status').textContent='เข้าถึงเฟรมไม่ได้: '+e.message; return; }
  if(!X||!G){ setTimeout(boot,120); return; }
  patch();
  makeLetter();
}

let ORIG_STORM=null, ORIG_REVEAL=null, ORIG_RESTORE=null;
const QUEUE=[];
function patch(){
  ORIG_STORM=APP.wxStorm;
  const draw=makeStorm(ORIG_STORM);
  /* ---------- ลำดับชั้น: พายุต้องอยู่ *เหนือ* หมอก ----------
     ของเดิมวาดพายุก่อน G.fog() โดยอ้างข้อ 5 (อากาศเห็นได้ "ในวง")
     แต่ข้อ 33 เขียนไว้ตรงข้ามว่าพายุมองเห็นทะลุหมอกทั้งเส้นทาง
     และข้อ 31 บอกว่าลมทะลุหมอกเสมอ — พายุก็คือลม จึงต้องทะลุด้วย
     ผลที่วัดได้: ใต้หมอก พายุจะจางกว่าริ้วลมที่อยู่รอบตัวมันเอง สู้ไม่ได้เลย

     เลี่ยงการรื้อ renderGlobe ทั้งก้อน ด้วยการพักคำสั่งวาดไว้ในคิว
     แล้วปล่อยหลัง restoreNight() ซึ่งเป็นจังหวะเดียวกับที่ริ้วลมถูกวาด */
  APP.wxStorm=function(){
    if(MODE==='field') return;                 /* แบบ D — พายุอยู่ในสนามลมแล้ว ไม่มีอะไรต้องวาดทับ */
    ABOVE ? QUEUE.push([...arguments]) : draw.apply(null,arguments);
  };

  /* ---------- แบบ D: ยุบพายุเข้าไปในสนามลม ----------
     สวมทับ wfAt ให้บวกกระแสวน แต่ *เฉพาะ* ตอนสร้างริ้วลมเท่านั้น
     CUR_STORMS เป็น null ตลอดตอน driftRun เส้นทางจึงไม่ถูกแตะ */
  const ORIG_WFAT=APP.wfAt;
  APP.wfAt=function(field,lat,lng,tf){
    const w=ORIG_WFAT(field,lat,lng,tf);
    return CUR_STORMS ? blendStorms(w,lat,lng) : w;
  };
  const ORIG_DS=APP.driftStreams;
  APP.driftStreams=function(L,tf){
    if(MODE!=='field') return ORIG_DS(L,tf);
    CUR_STORMS=stormsOf(L);
    let lines;
    try{ lines=ORIG_DS(L,tf).concat(stormStrands(L,tf)); }
    finally{ CUR_STORMS=null; }
    return lines;
  };
  /* G เป็น const ในเฟรม จึงไม่อยู่บน window — ต้องใช้ตัวที่ดึงออกมาด้วย eval */
  ORIG_RESTORE=G.restoreNight.bind(G);
  G.restoreNight=function(ctx,hole){
    ORIG_RESTORE(ctx,hole);
    while(QUEUE.length){ const a=QUEUE.shift(); a[0]=ctx; draw.apply(null,a); }
  };
  /* ข้อ 35 — วงเปิดหดเมื่อจดหมายอยู่ในพายุ · ของเดิมใน index.html ขึ้นกับระยะทางอย่างเดียว */
  ORIG_REVEAL=APP.revealKm;
  APP.revealKm=function(L){
    const base=ORIG_REVEAL(L);
    if(ARC==='off') return base;
    const st=X.letterState(L, APP.PREVIEW ? L.s+APP.PREVIEW.h*3600000 : Date.now());
    const sev=(L.lg&&L.lg[st.legIdx]) ? L.lg[st.legIdx][6] : 0;
    return sev>0 ? base*0.62 : base;       /* หด 38% ตามข้อ 35 */
  };
}

async function makeLetter(){
  $('#status').textContent='กำลังหาเส้นทางที่มีพายุจริง…';
  try{
    /* กรุงเทพ→อูซัวยา — วัดแล้วว่าผ่านมหาสมุทรใต้ซึ่งมีกระโชกระดับ 2 จริง */
    const A={lat:13.75,lng:100.52}, B={lat:-54.80,lng:-68.30};
    const dist=X.gcDist(A,B), pts=X.wfPoints(A,B);
    const wx=await X.fetchWx(pts);
    const sim=X.simulate(pts,wx,dist,0,'__study_storm');
    LET={ id:'__study_storm', f:{n:'กอล์ฟ',p:'กรุงเทพ',la:A.lat,lo:A.lng},
          t:{n:'ผู้รับ',p:'อูซัวยา',la:B.lat,lo:B.lng},
          s:Date.now()-1000, th:sim.total, ct:0, lg:sim.legs, lo:-1, wf:sim.wf,
          bd:'ทดสอบขนาดพายุ', dir:'out' };
    /* ไม่บันทึกลง localStorage — สวมทับ store.letters() ในหน่วยความจำเท่านั้น */
    const st=X.store, realLetters=st.letters.bind(st);
    st.letters=()=>realLetters().concat([LET]);
    X.sel='__study_storm';
    APP.previewOn && APP.previewOn(LET);
    /* ต้องพร้อมก่อนผูกปุ่ม — bind() ยิง event ตั้งต้นซึ่งเรียก apply() ที่เช็ค READY */
    READY=true; bind();
    tick();
  }catch(e){
    $('#status').textContent='สร้างจดหมายทดสอบไม่ได้: '+e.message;
  }
}

    '<button class="mode'+(m.id===MODE?' on':'')+'" data-m="'+m.id+'">'
    +'<b>'+m.name+'</b><span>'+m.note+'</span></button>').join('');

  $('#arc').innerHTML=ARCS.map(m=>

    {id:0,name:'ใต้หมอก (ของเดิม อ้างข้อ 5)',note:'พายุโดนหมอกกลืนจนจางกว่าริ้วลมที่อยู่รอบตัวมันเอง'}
  ].map(m=>'<button class="mode'+((m.id===1)===ABOVE?' on':'')+'" data-l="'+m.id+'">'

function zoomOf(){ return 1+Math.pow($('#sZoom').value/100,2.2)*45; }

function apply(){
  if(!READY) return;
  const z=zoomOf();
  G.zoom=z; G.zTarget=z; G.R=G.R0*z;
  const prog=+$('#sProg').value/100;
  if(APP.PREVIEW) APP.eval('PREVIEW.h='+(LET.th*prog).toFixed(4)+';PREVIEW.play=false');
  try{ APP.sizeStage(); APP.renderGlobe(); }catch(e){}
  facts();
}

function focusStorm(){
  if(!READY) return;
  /* เล็งไปที่ช่วงพายุที่แรงที่สุด */
  let bi=0,bg=-1;
  LET.lg.forEach((l,i)=>{ const g=l[7]??l[2]; if(l[6]>0&&g>bg){bg=g;bi=i;} });
  const p=X.posAt(LET,(bi+0.5)/LET.lg.length);
  SPIN = p.lat>=0 ? 1 : -1;              /* ข้อ 34 — พายุลูกนี้อยู่ซีกไหน */
  G.focus(p, zoomOf());
  for(let i=0;i<300;i++) G.step();
  apply();
}

function facts(){
  const gst=+$('#sGust').value;
  const inten=X.stormIntensity(gst);
  const km=stormKm(inten), px=kmToPx(km), screen=Math.min(G.W,G.H);
  const oldZs=Math.max(1,Math.min(3.2,1+Math.log2(Math.max(1,G.zoom))*0.42));
  const oldPx=(9+inten*15)*1.12*oldZs;
  const ratio=oldPx/px;
  const sev=X.sevOf(gst);
  const mode = px/screen>1.10 ? 'อยู่ในพายุเต็มตัว'
             : px/screen>0.55 ? 'กำลังไล่ระดับเข้าโหมดใน'
             : 'ก้นหอยปกติ';
  $('#facts').innerHTML=
     '<b>กระโชก '+gst+'</b> → ระดับ '+sev+(sev===2?' <span class="warn">(เสี่ยงหาย)</span>':sev===1?' (จอดรอ)':'')
    +' · ความเข้ม '+inten.toFixed(2)+'<br>'
    +'<b>รัศมีจริง</b> <span class="num">'+Math.round(km)+'</span> กม.'
    +' = <span class="num">'+Math.round(px)+'</span> px บนจอ<br>'
    +'<b>ของเดิมวาด</b> <span class="num">'+Math.round(oldPx)+'</span> px'
    +' = <span class="'+(ratio<0.5?'warn':'ok')+'">'+(ratio*100).toFixed(0)+'%</span> ของขนาดจริง<br>'
    +'<b>ซูม</b> <span class="num">'+G.zoom.toFixed(1)+'</span>×'
    +' · โลก <span class="num">'+Math.round(G.R)+'</span> px'
    +' · <span class="num">'+(ER/G.R).toFixed(1)+'</span> กม./px<br>'
    +'<b>โหมด C จะวาด</b> '+mode+' <span class="num">('+(px/screen).toFixed(2)+' เท่าของด้านสั้น)</span>';
}

function bind(){
  ['sGust','sZoom','sProg'].forEach(id=>{
    $('#'+id).addEventListener('input',()=>{
      $('#o'+id.slice(1)).textContent =
        id==='sGust' ? $('#'+id).value+' กม./ชม.'
      : id==='sZoom' ? zoomOf().toFixed(1)+'×'
      : ($('#'+id).value+'%');
      if(id==='sGust') restorm();
      apply();
    });
    $('#'+id).dispatchEvent(new Event('input'));
  });
  $('#reset').onclick=focusStorm;
  $('#rec').onclick=()=>{ focusStorm(); recordFrames(20,30); };
  $('#toggle').onclick=()=>{
    const p=$('#panel'), hid=p.classList.toggle('hide');
    $('#toggle').classList.toggle('off',hid);
    $('#status').classList.toggle('off',hid);
    $('#toggle').textContent=hid?'แสดงแผง':'ซ่อนแผง';
  };
  paintModes();
  restorm();
  focusStorm();
}

/* เปลี่ยนความแรงพายุในจดหมายทดสอบ ให้ทุกช่วงที่เป็นพายุใช้ค่าที่เลื่อน */
function restorm(){
  if(!LET) return;
  const g=+$('#sGust').value;
  LET.lg.forEach(l=>{ if(l[6]>0){ l[7]=g; l[6]=X.sevOf(g); } });

/* ริ้วลมถูกแคชไว้ต่อจดหมาย+ช่วงเวลา — เปลี่ยนแบบหรือความแรงแล้วต้องล้าง
   ไม่งั้นจะเห็นสนามเก่าค้างจนกว่าจดหมายจะเดินข้ามช่วง */
function clearStreams(){
  _ssCache.clear();
  try{ APP.eval('_streamCache.clear()'); }catch(e){}
}

/* ---------- อัดคลิป ----------
   กอล์ฟจะไม่อยู่หน้าคอม จึงต้องได้ภาพเคลื่อนไหว ไม่ใช่ภาพนิ่ง
   ถ่ายจาก canvas โดยตรงด้วย captureStream — ไม่ต้องพึ่งการ composite ของหน้าต่าง */
let REC=null;

/* อัดแบบเฟรมต่อเฟรม — เวลาในคลิปเป็นเวลาที่เรากำหนดเอง ไม่ใช่เวลานาฬิกา
   จำเป็นเพราะทั้ง rAF และ setInterval ถูกหน่วงเมื่อหน้าต่างไม่ได้แสดงผล
   (วัดแล้ว: rAF ได้ 43 KB · setInterval ได้ 24 เฟรมใน 20 วินาที = 1.2 fps)
   ผลพลอยได้: คลิปลื่นเท่ากันทุกเครื่อง เพราะไม่ขึ้นกับความเร็วในการเรนเดอร์ */
async function recordFrames(sec, fps){
  if(!READY||REC) return;
  const st=APP.document.querySelector('#stage');
  const n=Math.round(sec*fps);
  const cv=document.createElement('canvas');
  cv.width=st.width; cv.height=st.height;
  const c=cv.getContext('2d');
  REC={t0:0, sec};
  /* ส่งทีละเฟรมทันที ห้ามสะสมไว้ในหน่วยความจำ
     ครั้งแรกเก็บ dataURL ทั้ง 600 ใบไว้ก่อนแล้วค่อยส่ง — พอภาพหนักขึ้นเพราะพายุ
     หน่วยความจำตันและลูปตายเงียบ ๆ ที่เฟรม 451 */
  let sent=0;
  for(let i=0;i<n;i++){
    const u=i/(n-1);
    REC.t0=performance.now()-u*sec*1000;     /* หลอกให้ recCamera คิดว่าเวลาเดินไปเท่านี้ */
    recCamera();
    /* T คือนาฬิกาของแอนิเมชันในแอป ต้องเดินตามเวลาในคลิป ไม่ใช่เวลาจริง */
    APP.eval('T='+(u*sec).toFixed(4));
    APP.renderGlobe();
    c.fillStyle='#0d1220'; c.fillRect(0,0,cv.width,cv.height);
    c.drawImage(st,0,0);
    await fetch('/__shot/f'+String(i).padStart(4,'0')+'.jpg',
                {method:'POST', body:cv.toDataURL('image/jpeg',0.84)});
    sent++;
    if(i%10===0) $('#status').textContent='อัดเฟรม '+(i+1)+'/'+n;
  }
  REC=null;
  $('#status').textContent='ส่งครบ '+sent+' เฟรมแล้ว — รอ ffmpeg ต่อ';
  return sent;
}

async function record(sec){
  if(!READY||REC) return;
  const st=APP.document.querySelector('#stage');
  /* captureStream(0) = เราสั่งเองว่าเฟรมไหนถูกเก็บ
     ถ้าใช้ captureStream(30) จะพึ่ง rAF ซึ่งถูกหน่วงจนแทบไม่ทำงานเมื่อหน้าต่างไม่ composite
     (วัดแล้ว: อัด 20 วินาทีได้ไฟล์ 43 KB คือแทบไม่มีเฟรมเลย) */
  const stream=st.captureStream(0);
  const track=stream.getVideoTracks()[0];
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    .find(m=>MediaRecorder.isTypeSupported(m));
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8_000_000});
  const chunks=[];
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>mr.onstop=r);
  REC={t0:performance.now(), sec};
  mr.start(200);
  /* วาดเองด้วย setInterval ที่ 30 fps แล้วสั่งเก็บเฟรมทีละใบ — ไม่ขึ้นกับการ composite เลย */
  const FPS=30;
  await new Promise(resolve=>{
    const iv=setInterval(()=>{
      const e=(performance.now()-REC.t0)/1000;
      try{
        recCamera();
        APP.eval('T='+((performance.now()-T0)/1000).toFixed(3));
        APP.renderGlobe();
        track.requestFrame();
      }catch(err){}
      $('#status').textContent='กำลังอัด… '+e.toFixed(1)+'s / '+sec+'s';
      if(e>=sec){ clearInterval(iv); resolve(); }
    }, 1000/FPS);
  });
  mr.stop(); await done; REC=null;
  const blob=new Blob(chunks,{type:'video/webm'});
  $('#status').textContent='กำลังส่งคลิป '+(blob.size/1048576).toFixed(1)+' MB…';
  const fr=new FileReader();
  const dataUrl=await new Promise(r=>{ fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
  const res=await fetch('/__shot/storm_clip.webm',{method:'POST',body:dataUrl});
  $('#status').textContent='ส่งคลิปแล้ว ('+res.status+') · '+(blob.size/1048576).toFixed(1)+' MB';
}

/* กล้องระหว่างอัด — ไล่จากทั้งลูกโลกเข้าไปจนอยู่ในตาพายุ
   ต้องช้าพอให้ตาไล่ทัน เพราะนี่คือจังหวะ "ลุ้น" ที่กอล์ฟขอ */
function recCamera(){
  const e=(performance.now()-REC.t0)/1000, T=REC.sec;
  const u=Math.min(1,e/T);
  let zp;
  if(u<0.15)      zp=8;                                    /* ทั้งลูกโลก — เห็นพายุรออยู่ข้างหน้า */
  else if(u<0.72) { const k=(u-0.15)/0.57; zp=8+Math.pow(k,1.35)*54; }   /* ค่อย ๆ เข้าไปหา */
  else            zp=62;                                   /* อยู่ข้างในแล้ว */
  const z=1+Math.pow(zp/100,2.2)*45;
  G.zoom+=(z-G.zoom)*0.06; G.R=G.R0*G.zoom; G.zTarget=G.zoom;
  /* จดหมายเดินหน้าไปเรื่อย ๆ ระหว่างนั้น */
  if(APP.PREVIEW) APP.eval('PREVIEW.h='+(LET.th*(0.45+u*0.22)).toFixed(4));
}

let T0=performance.now();
function tick(){
  if(READY && APP && APP.renderGlobe){
    /* ระหว่างอัด ลูปอัดเป็นคนวาดเอง — ห้ามวาดซ้ำตรงนี้ ไม่งั้นกล้องจะเดินเร็วเป็นสองเท่า */
    if(!REC){
      try{
        APP.eval('T='+((performance.now()-T0)/1000).toFixed(3));
        APP.renderGlobe();
      }catch(e){}
      $('#status').textContent='ลูกโลกจริง · จดหมายทดสอบอยู่ในหน่วยความจำ ไม่ถูกบันทึก'
        +' · '+MODES.find(m=>m.id===MODE).name;
    }
  }
  requestAnimationFrame(tick);
}

$('#app').addEventListener('load',()=>setTimeout(boot,320));
</script>
