<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2233">
<title>drift — แบบศึกษาโหมดมืด</title>
<style>
/* แบบศึกษาโหมดมืด (ข้อ 127)
   ⚠️ ไม่คัดลอกตรรกะของแอปมาเลย — iframe ตัวจริงแล้วยัด CSS ทับ
      หลักเดียวกับ lost-studies.html ที่เรียก openLost() ตัวจริงผ่าน iframe
   ⛔ อะไรที่วาดบน canvas (ลูกโลก กระดาษ 3D ลม อากาศ) ยังคุมไม่ได้จากที่นี่
      ต้องรอให้ canvas อ่านสีจาก token ก่อน */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:"Noto Serif Thai",Georgia,serif;background:#0f1420;color:#e8e3d8}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#stagebox{flex:1;position:relative;min-height:0;background:#000}
iframe{width:100%;height:100%;border:0;display:block}
#panel{background:#171d2b;border-top:1px solid rgba(232,227,216,.14);
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#panel.min{max-height:52px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;height:32px}
.hd b{font-weight:400;font-size:13px;letter-spacing:.2em;flex:1;opacity:.75}
.tog{background:rgba(232,227,216,.12);border:0;color:inherit;font:inherit;font-size:12px;
  padding:0 13px;height:32px;min-width:44px;border-radius:16px}
.row{display:flex;align-items:center;gap:11px;margin:9px 0}
.row label{width:96px;font-size:12px;opacity:.7;flex:none}
.row output{width:44px;text-align:right;font-size:12px;opacity:.55;flex:none;
  font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:44px;background:none;-webkit-appearance:none;appearance:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(232,227,216,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:#e8e3d8;margin-top:-12px}
input[type=range]::-moz-range-track{height:2px;background:rgba(232,227,216,.28)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#e8e3d8}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 3px}
.tabs button{background:rgba(232,227,216,.1);border:0;color:inherit;font:inherit;font-size:12px;
  padding:0 12px;height:38px;border-radius:19px}
.tabs button.on{background:rgba(232,227,216,.26)}
.acts{display:flex;gap:9px;margin-top:12px}
.acts button{flex:1;height:44px;border:0;border-radius:9px;font:inherit;font-size:13px;
  background:rgba(232,227,216,.16);color:inherit}
.acts button.gold{background:#c69a54;color:#221c10}
#out{margin-top:11px;font-size:11px;line-height:1.6;opacity:.6;white-space:pre-wrap;
  font-family:ui-monospace,Menlo,monospace;max-height:120px;overflow:auto}
.grp{font-size:11px;letter-spacing:.16em;opacity:.5;margin:16px 0 2px;
  border-top:1px solid rgba(232,227,216,.12);padding-top:12px}
.note{font-size:11px;opacity:.45;margin:7px 0 0;line-height:1.55}
</style>
</head>
<body>
<div id="wrap">
  <!-- ⚠️ ไม่มี src ตอนแรก — ต้องตั้ง localStorage ให้เสร็จก่อน ไม่งั้นแอปตัดสินว่า
       เป็นคนใหม่แล้วเปิดหน้าเปิดค้างไว้ ทำให้จูนลูกโลกไม่ได้ (ข้อ 129) -->
  <div id="stagebox"><iframe id="app"></iframe></div>
  <div id="panel">
    <div class="hd">
      <b>โหมดมืด</b>
      <button class="tog" id="btnMin">ย่อ</button>
    </div>

    <div class="row"><label>พื้น มืดแค่ไหน</label>
      <input type="range" id="bgL" min="4" max="34" value="13"><output id="oBgL"></output></div>
    <div class="row"><label>พื้น โทนสี</label>
      <input type="range" id="bgH" min="180" max="280" value="222"><output id="oBgH"></output></div>
    <div class="row"><label>พื้น ความอิ่ม</label>
      <input type="range" id="bgS" min="0" max="40" value="22"><output id="oBgS"></output></div>
    <div class="row"><label>แผ่น สว่าง</label>
      <input type="range" id="shL" min="55" max="100" value="86"><output id="oShL"></output></div>
    <div class="row"><label>แผ่น ความอุ่น</label>
      <input type="range" id="shW" min="0" max="60" value="34"><output id="oShW"></output></div>
    <div class="row"><label>หมึก สว่าง</label>
      <input type="range" id="inkL" min="60" max="100" value="88"><output id="oInkL"></output></div>
    <div class="row"><label>ทอง สว่าง</label>
      <input type="range" id="goL" min="40" max="90" value="66"><output id="oGoL"></output></div>

    <p class="grp">ลูกโลก — แก้สีที่วาดบน canvas จริง</p>
    <div class="row"><label>หมอก</label>
      <input type="range" id="gFog" min="0" max="72" value="18"><output id="oGFog"></output></div>
    <div class="row"><label>เนื้อโลก ทึบ</label>
      <input type="range" id="gBaseA" min="0" max="100" value="30"><output id="oGBaseA"></output></div>
    <div class="row"><label>เนื้อโลก สว่าง</label>
      <input type="range" id="gBaseL" min="-70" max="40" value="-49"><output id="oGBaseL"></output></div>
    <div class="row"><label>กลางวัน ทึบ</label>
      <input type="range" id="gDayA" min="80" max="1400" value="180"><output id="oGDayA"></output></div>
    <div class="row"><label>รอยต่อวัน-คืน นุ่ม</label>
      <input type="range" id="gSoft" min="0" max="100" value="90"><output id="oGSoft"></output></div>
    <div class="row"><label>ขอบซีกกลางวัน</label>
      <input type="range" id="gEdge" min="0" max="40" value="6"><output id="oGEdge"></output></div>
    <div class="row"><label>กลางคืน ทึบ</label>
      <input type="range" id="gNightA" min="20" max="800" value="300"><output id="oGNightA"></output></div>
    <div class="row"><label>แสงตกกระทบ</label>
      <input type="range" id="gLit" min="-40" max="85" value="0"><output id="oGLit"></output></div>
    <div class="row"><label>ซีกกลางคืน ยก</label>
      <input type="range" id="gDay" min="-40" max="85" value="0"><output id="oGDay"></output></div>
    <div class="row"><label>กลางคืน สว่าง</label>
      <input type="range" id="gNight" min="-70" max="55" value="-47"><output id="oGNight"></output></div>
    <div class="row"><label>เส้น กลางวัน</label>
      <input type="range" id="gInkD" min="-30" max="60" value="0"><output id="oGInkD"></output></div>
    <div class="row"><label>เส้น กลางคืน</label>
      <input type="range" id="gInkN" min="-40" max="25" value="0"><output id="oGInkN"></output></div>

    <p class="grp">กระดาษ — มีเนื้อของตัวเอง ต่างจากลูกโลก</p>
    <div class="row"><label>กระดาษ สว่าง</label>
      <input type="range" id="pL" min="-72" max="10" value="0"><output id="oPL"></output></div>
    <div class="row"><label>กระดาษ ความอุ่น</label>
      <input type="range" id="pW" min="-30" max="45" value="0"><output id="oPW"></output></div>
    <div class="row"><label>หมึกบนกระดาษ</label>
      <input type="range" id="pInk" min="-20" max="80" value="0"><output id="oPInk"></output></div>

    <div class="tabs" id="tabs">
      <button data-go="home" class="on">ลูกโลก</button>
      <button data-go="menu">เมนู</button>
      <button data-go="compose">เขียน</button>
      <button data-go="inbox">กล่องจดหมาย</button>
      <button data-go="vault">บัญชี</button>
      <button data-go="ports">รายชื่อ</button>
      <button id="btnTerm">หมุนหาเส้นแบ่งวัน-คืน</button>
    </div>

    <div class="acts">
      <button id="btnOff">ดูแบบสว่าง</button>
      <button id="btnCopy" class="gold">คัดลอกค่า</button>
    </div>
    <p class="note">✅ ลูกโลกปรับได้แล้ว — สไลเดอร์สี่ตัวล่างแก้สีที่วาดบน canvas จริง
      <br>⛔ กระดาษ 3D · ลม · อากาศ ยังไม่เปลี่ยนตาม เป็นกลุ่มถัดไป</p>
    <div id="out"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let dark = true;

const K = ['bgL','bgH','bgS','shL','shW','inkL','goL','gFog','gBaseA','gBaseL','gDayA','gNightA','gSoft','gEdge','gDay','gLit','gNight','gInkD','gInkN','pL','pW','pInk'];
/* ความทึบเป็นเปอร์เซ็นต์ 100 = เท่าเดิม — คุมคนละเรื่องกับสี จึงแยกออกมา (ข้อ 129) */
const GA = {gDayA:'dayA', gNightA:'nightA'};
const GB = {gBaseA:'baseA'};   /* ความทึบของเนื้อโลก 0-100% (ข้อ 129) */
const PK = ['pL','pW','pInk'];   /* กระดาษ (ข้อ 130) */
/* สไลเดอร์หนึ่งตัวคุมสีหลายตัวที่เป็นเรื่องเดียวกัน — ไม่ให้มี 19 ปุ่มที่ไม่มีใครหมุนไหว
   ⓘ ซีกกลางวันแยกจากแสงตกกระทบ เพราะเป็นคนละคำถาม (ข้อ 129)
     lift = ความสว่างรวมทั้งซีก · lit = ไฮไลต์ตรงจุดที่แดดตั้งฉาก แล้วไล่ลง
   ⚠️ ดวงอาทิตย์ไม่ได้หรี่ตามไฟห้องของคนใช้ — ลูกโลกอยู่ในอวกาศ ไม่ได้อยู่ในห้อง
     กรอบ "แสงที่ส่องเปลี่ยน" ใช้กับกระดาษ ไม่ใช้กับลูกโลก */
const GK = {gDay:['lift'], gLit:['lit','litMid','litEdge'],
            gNight:['nightBg','nightG0','nightG1','nightG2'],
            gInkD:['dayInk'], gInkN:['nightGrid','nightCoast','termLine']};
const V = () => Object.fromEntries(K.map(k => [k, +$('#'+k).value]));

function hsl(h,s,l,a){ return a==null ? `hsl(${h} ${s}% ${l}%)` : `hsl(${h} ${s}% ${l}% / ${a})`; }

/* สร้าง CSS ที่จะยัดเข้าไปในแอป
   ⚠️ UI ของแอปเกือบทั้งหมดคือ rgba(255,255,255,α) วางทับพื้น — ไม่ได้ระบายสี
      โหมดมืดจึงคือ "เปลี่ยนแผ่นขาวเป็นแผ่นสว่างบนพื้นเข้ม" ไม่ใช่เปลี่ยนเป็นดำ */
function css(v){
  const bg1 = hsl(v.bgH, v.bgS, v.bgL);
  const bg2 = hsl(v.bgH - 14, Math.max(0,v.bgS - 6), v.bgL + 4);
  const sh  = (a) => hsl(42, v.shW, v.shL, a);          /* แผ่น — อุ่นเล็กน้อย ไม่ขาวโพลน */
  const ink = (a) => hsl(40, 12, v.inkL, a);
  const gold= (l) => hsl(38, 46, l);
  /* หมึกบนกระดาษ — เข้มขึ้นตามที่กระดาษหรี่ลง เพื่อให้ contrast ไม่ตก */
  const paperInk = (a) => `hsl(28 18% ${Math.max(8, 18 + v.pL * 0.12)}% / ${a})`;
  return `
  body{background:linear-gradient(165deg,${bg1},${bg2}) !important;color:${ink(.92)} !important}
  :root{
    --txt:${ink(.92)} !important; --dim:${ink(.62)} !important; --faint:${ink(.42)} !important;
    --line:${sh(.26)} !important; --line-soft:${sh(.13)} !important;
    --gold:${gold(v.goL)} !important;
  }
  .sheet{background:linear-gradient(165deg,${hsl(v.bgH,v.bgS,v.bgL+2,.985)},${hsl(v.bgH-14,Math.max(0,v.bgS-6),v.bgL+6,.985)}) !important}
  .btn{background:${sh(.13)} !important;color:${gold(v.goL)} !important;border-color:${sh(.3)} !important}
  .btn:active,.chip.sel{background:${sh(.26)} !important}
  .pbtn{background:${sh(.17)} !important}
  .chip,.fc,.pick,.link,.addr,.shade{background:${sh(.1)} !important}
  .pick.on{background:${sh(.2)} !important}
  .hit,.mrow:active,#status:active{background:${sh(.1)} !important}
  .hit:active{background:${sh(.22)} !important}
  input,textarea{background:${sh(.1)} !important;color:${ink(.92)} !important}
  input:focus,textarea:focus{background:${sh(.16)} !important}
  #cHits{background:${hsl(v.bgH,v.bgS,v.bgL+3)} !important}
  .mbtn i{background:${ink(.6)} !important}
  .mbtn:active i{background:${ink(.85)} !important}
  #toast{background:${hsl(v.bgH,v.bgS,Math.min(96,v.bgL+72),.94)} !important;color:${hsl(v.bgH,v.bgS,v.bgL)} !important}
  #splash{background:${bg1} !important}

  /* ---- กระดาษเป็นเกาะของตัวเอง (ข้อ 130) ----
     ⚠️ ทุกอย่างที่อยู่ *บนกระดาษ* ต้องใช้สีของกระดาษ ไม่ใช่สีของ UI มืด
        กระดาษยังเป็นแผ่นสว่างในโหมดมืด หมึกบนมันจึงต้องเข้ม ไม่ใช่สว่าง
        ถ้าลืมข้อนี้ ช่องกรอกจะกลายเป็นกล่องสว่างทับบนกระดาษ และหมึกจะหายไปกับพื้น */
  #cSheet input,#cSheet textarea,#cWho .who{background:transparent !important;color:${paperInk(.92)} !important}
  #cSheet input:focus,#cSheet textarea:focus{background:transparent !important}
  #cSheet input::placeholder,#cSheet textarea::placeholder{color:${paperInk(.38)} !important}
  .wline .lb{color:${paperInk(.9)} !important}
  .ptext{color:${paperInk(.9)} !important}
  .sig{color:${paperInk(.6)} !important}
  .brand img,#introMark,#spMark{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
  `;
}

/* ปรับความสว่างโดยคงเนื้อสีไว้ — บวกคือเข้าหาขาว ลบคือคูณลง */
function shiftL(rgb, d){
  if(!d) return rgb;
  const p = rgb.split(',').map(Number);
  const f = v => Math.max(0, Math.min(255, Math.round(d > 0 ? v + (255 - v) * (d / 100) : v * (1 + d / 100))));
  return f(p[0]) + ',' + f(p[1]) + ',' + f(p[2]);
}

/* แก้ SKIN ของแอปจริงแล้วสั่งวาดใหม่ — ไม่ได้จำลองลูกโลกขึ้นมาเอง */
function applyGlobe(){
  const w = app.contentWindow; if(!w) return;
  /* SKIN ประกาศด้วย const จึงไม่เป็น property ของ window — ต้องหยิบผ่าน eval
     ⓘ แก้ที่เครื่องมือ ไม่แก้แอปเพื่อให้เครื่องมือเข้าถึงง่ายขึ้น */
  let skin;
  try{ skin = w.eval('typeof SKIN !== "undefined" ? SKIN : null'); }catch(e){ return; }
  if(!skin) return;
  if(!w.__SKIN0) w.__SKIN0 = Object.assign({}, skin);
  const v = V();
  Object.keys(GK).forEach(sl => GK[sl].forEach(k => {
    skin[k] = dark ? shiftL(w.__SKIN0[k], v[sl]) : w.__SKIN0[k];
  }));
  Object.keys(GA).forEach(sl => { skin[GA[sl]] = dark ? v[sl] / 100 : 1; });
  Object.keys(GB).forEach(sl => { skin[GB[sl]] = dark ? v[sl] / 100 : 0; });
  /* ⚠️ เพดานความทึบของลูกโลกคือ 1 - CFG.FOG — หมอกลบความทึบออก 72% นอกวงที่เปิด (ข้อ 41)
     ในโหมดสว่างลูกโลกที่จางลงถูกกลืนในหมอกสีอ่อน · ในโหมดมืดมันหายไปในความมืด
     ดัน dayA เท่าไหร่ก็ชนเพดานนี้ ต้องลดหมอกเท่านั้น (ข้อ 129.5) */
  try{ w.eval('CFG.FOG=' + (dark ? (v.gFog/100) : 0.72) + ';'); }catch(e){}
  /* ⚠️ SOFT คุมรูปทรงของรอยต่อวัน-คืนสี่อย่างพร้อมกัน (ข้อ 164)
       band()   ความกว้างแถบสนธยา  = .30 + SOFT*.20
       blurPx() ความเบลอของขอบเงา  = SOFT * ... * .24
       lift     การยกแสงฝั่งมืด
       lineA    เส้นขอบแสง = .45*(1-SOFT) — ที่ .90 แทบไม่เหลือเส้น
     ⛔ ใช้ *ทั้งสองโหมด* ไม่ใช่เฉพาะมืด — ค่าที่เลือกจะกระทบโหมดสว่างด้วย */
  try{ w.eval('SOFT=' + (v.gSoft/100) + ';'); }catch(e){}
  skin.dayEdge = v.gEdge/100;
  skin.base = dark ? shiftL(w.__SKIN0.base, v.gBaseL) : w.__SKIN0.base;
  /* ⚠️ sphere() แคชภาพไว้ด้วย _key ที่คิดจากมุมกับซูมเท่านั้น ไม่รู้จักสี
     ไม่ล้างก่อน จะได้ภาพเดิมกลับมาแล้วนึกว่าค่าที่ปรับไม่มีผล (ข้อ 129) */
  try{ w.eval('G._key=null; G._nkey=null;'); }catch(e){}
  try{ w.renderGlobe(); }catch(e){}
  applyPaper();
}

/* กระดาษหรี่ลงเอง ไม่ใช่เพิ่มความทึบ — มันเป็นวัตถุ ไม่ใช่ฟิล์ม (ข้อ 130) */
function applyPaper(){
  const w = app.contentWindow; if(!w) return;
  let p;
  try{ p = w.eval('typeof PAPER !== "undefined" ? PAPER : null'); }catch(e){ return; }
  if(!p) return;
  if(!w.__PAPER0) w.__PAPER0 = {fresh:p.fresh.slice(), aged:p.aged.slice(), line:p.line, edge:p.edge,
    sheetFresh:p.sheetFresh.slice(), sheetAged:p.sheetAged.slice()};
  const v = V(), P0 = w.__PAPER0;
  const warm = (arr, dL, dW) => arr.map((c, i) => {
    let x = dL > 0 ? c + (255 - c) * (dL / 100) : c * (1 + dL / 100);
    x += (i === 0 ? dW * 0.55 : i === 1 ? 0 : -dW * 0.9);   /* อุ่น = แดงขึ้น น้ำเงินลง */
    return Math.max(0, Math.min(255, Math.round(x)));
  });
  if(dark){
    p.fresh = warm(P0.fresh, v.pL, v.pW);
    p.aged  = warm(P0.aged,  v.pL, v.pW);
    p.sheetFresh = warm(P0.sheetFresh, v.pL, v.pW);
    p.sheetAged  = warm(P0.sheetAged,  v.pL, v.pW);
    p.line  = shiftL(P0.line, v.pInk);
    p.edge  = shiftL(P0.edge, v.pInk);
  }else{
    p.fresh = P0.fresh.slice(); p.aged = P0.aged.slice();
    p.sheetFresh = P0.sheetFresh.slice(); p.sheetAged = P0.sheetAged.slice();
    p.line = P0.line; p.edge = P0.edge;
  }
  /* กระดาษหน้าเขียนวาดครั้งเดียวตอนเปิด — ต้องสั่งวาดใหม่เอง */
  try{ w.repaintPaper && w.repaintPaper(); }catch(e){}
}

function apply(){
  const d = app.contentDocument; if(!d) return;
  applyGlobe();
  let st = d.getElementById('__dark');
  if(!dark){ if(st) st.remove(); paintOut(); return; }
  if(!st){ st = d.createElement('style'); st.id='__dark'; d.head.appendChild(st); }
  st.textContent = css(V());
  paintOut();
}

function paintOut(){
  const v = V();
  K.forEach(k => $('#o'+k[0].toUpperCase()+k.slice(1)).textContent = v[k]);
  $('#out').textContent = dark
    ? JSON.stringify(v) + '\n\n' + css(v).trim().split('\n').slice(0,3).join('\n') + ' …'
    : 'โหมดสว่าง (ของเดิม)';
}

K.forEach(k => $('#'+k).addEventListener('input', apply));

/* ลูกโลกมักหันซีกกลางวันมาทั้งใบ แล้วจะไม่เห็นความต่างวัน-คืนเลย
   ต้องหมุนไปที่มุมที่ดวงอาทิตย์อยู่ริมขอบก่อน ถึงจะเห็นทั้งสองซีกพร้อมกัน (ข้อ 129.6) */
$('#btnTerm').addEventListener('click', () => {
  const w = app.contentWindow;
  try{ w.eval(`(function(){
    const r0=G.rotY; let best=null;
    for(let i=0;i<180;i++){
      G.rotY = r0 + i*Math.PI/90;
      const z = Math.abs(G.project(G.rotate(sunVec())).z);
      if(!best || z < best.z) best = {z, rot:G.rotY};
    }
    G.rotY = best.rot; G.vY = 0;
  })()`); }catch(e){}
  applyGlobe();
});

$('#btnMin').addEventListener('click', () => {
  const p = $('#panel'); p.classList.toggle('min');
  $('#btnMin').textContent = p.classList.contains('min') ? 'ขยาย' : 'ย่อ';
});

$('#btnOff').addEventListener('click', () => {
  dark = !dark; $('#btnOff').textContent = dark ? 'ดูแบบสว่าง' : 'ดูแบบมืด';
  /* สลับโหมดของแอปจริงด้วย — CSS กับ SKIN ต้องไปทางเดียวกัน */
  try{ app.contentWindow.eval("setSchemePref('"+(dark?'dark':'light')+"')"); }catch(e){}
  apply();
});

$('#btnCopy').addEventListener('click', async () => {
  const txt = JSON.stringify(V(), null, 2) + '\n\n' + css(V());
  try{ await navigator.clipboard.writeText(txt); $('#btnCopy').textContent='คัดลอกแล้ว';
       setTimeout(()=>$('#btnCopy').textContent='คัดลอกค่า',1400); }
  catch(e){ $('#out').textContent = txt; }
});

/* เรียกฟังก์ชันของแอปตรง ๆ ไม่จำลองการกด — same-origin จึงเข้าถึงได้ */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  [...$('#tabs').children].forEach(x => x.classList.toggle('on', x===b));
  const w = app.contentWindow, go = b.dataset.go;
  try{
    if(go==='home'){ w.closeSheet && w.closeSheet(); setTimeout(applyGlobe, 60); }
    else { w.openSheet && w.openSheet(go); }
  }catch(err){ $('#out').textContent = 'เรียกไม่ได้: ' + err.message; }
});

app.addEventListener('load', () => { apply(); });

/* ตั้งค่าให้แอปคิดว่าเป็นคนที่เคยใช้แล้ว *ก่อน* ปล่อยให้มันโหลด
   same-origin จึงเป็น localStorage ก้อนเดียวกัน ตั้งจากตรงนี้ได้เลย */
try{
  /* ⚠️ แอปเปิดโหมดมืดแล้ว (ข้อ 159) — ต้องบังคับ iframe เข้าโหมดมืดของแอปเองด้วย
     ไม่งั้น CSS เป็นชุดสว่างแต่ SKIN ถูกดันเป็นค่ามืด = จูนจากภาพที่ไม่มีอยู่จริง */
  localStorage.setItem('lw.v1.scheme','dark');
  localStorage.setItem('lw.v1.intro','1');
  sessionStorage.setItem('lw.v1.splash','1');
}catch(e){}
/* ⚠️ service worker แคชแอปไว้ — iframe จะได้ไฟล์เก่าแล้วเราจะนึกว่าโค้ดที่เพิ่งแก้ไม่ทำงาน
   เป็นกฎ "reload สองครั้ง" เดิมที่โผล่มาในรูปใหม่ · ที่นี่ต้องเห็นของสดเสมอ (ข้อ 129) */
navigator.serviceWorker && navigator.serviceWorker.getRegistrations
  && navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
app.src = 'index.html?fresh=' + Date.now();
paintOut();
</script>
</body>
</html>
