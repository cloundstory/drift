    let start=-1;
    for(let i=0;i<N;i++) if(pts[i].z>=0 && pts[(i+N-1)%N].z<0){ start=i; break; }
    if(start<0){                                   /* ไม่มีรอยต่อในจอ = เห็นซีกเดียวล้วน */
      const q=this.unrotate({x:0,y:0,z:1});
      return (q.x*s.x+q.y*s.y+q.z*s.z)<0 ? {all:true} : null;
    }
    const arc=[];
    for(let k=0;k<N;k++){ const it=pts[(start+k)%N]; if(it.z<0) break; arc.push(it.p); }
    if(arc.length<3) return null;
    const ang=p=>Math.atan2(p.y-CY,p.x-CX);
    const a0=ang(arc[0]), a1=ang(arc[arc.length-1]);
    let d=a0-a1; while(d<0) d+=Math.PI*2;
    const mid=a1+d/2;
    const q=this.unrotate({x:Math.cos(mid), y:-Math.sin(mid), z:0});
    const ccw=!((q.x*s.x+q.y*s.y+q.z*s.z)<0);     /* ฝั่งไหนของขอบโลกคือกลางคืน */
    return {arc,a0,a1,ccw};
  },
  /* ของเดิมตัดที่ dot > -0.02 แบบคม ไฟจึง "ผุด" ขึ้นพร้อมกันทั้งแถบตอนข้ามเส้นแบ่ง
     เปลี่ยนเป็นค่อย ๆ ติดตั้งแต่ก่อนพระอาทิตย์ตก เหมือนเมืองจริงที่ทยอยเปิดไฟ */
  cities(c,fast){
    const s=sunVec(), band=this.band();
    for(let i=0;i<CITY.length;i++){
      const v=CITY[i].v, m=CITY[i].m;
      const d=v.x*s.x+v.y*s.y+v.z*s.z;
      if(d>band*.55) continue;
      const r=this.rotate(v); if(r.z<.03) continue;
      const p=this.project(r);
      const night=clamp((band*.55-d)/(band*1.15),0,1);
      /* ไฟเมืองคือสัญญาณ "มีคนอยู่ข้างล่าง" — เป็นสิ่งเดียวที่บอกว่ากลางคืนนี้ไม่ว่างเปล่า
         จึงต้องสว่างพอ และกะพริบช้า ๆ ให้อ่านเป็นไฟ ไม่ใช่จุด */
      const tw=1+Math.sin(T*(.6+m*.5)+i*2.399)*.16;
      const a=(.20+.66*m)*night*(.4+.6*r.z)*tw;
      if(a<.006) continue;
      const rad=.65+m*1.5;
      if(m>.45&&!fast){
        const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*4);
        g.addColorStop(0,'rgba(226,172,88,'+Math.min(.5,a*.55).toFixed(3)+')');
        g.addColorStop(1,'rgba(226,172,88,0)');
        c.fillStyle=g; c.beginPath(); c.arc(p.x,p.y,rad*4,0,6.2832); c.fill();
      }
      c.fillStyle='rgba(240,206,140,'+Math.min(.85,a).toFixed(3)+')';
      c.beginPath(); c.arc(p.x,p.y,rad,0,6.2832); c.fill();
    }
  },
  /* ยกความเข้มของซีกมืดขึ้นเล็กน้อยหลัง blit — ทำหน้าที่เหมือนหมอกบาง ๆ ในบรรยากาศ
     ความตัดจริงคุมด้วยความเข้มของพื้นมืดใน paint() ซึ่งถูก cache ไว้
     แทนที่จะ paint สองเวอร์ชัน ใช้ชั้นบาง ๆ ทับทีหลังแทน */
  liftNight(c){
    const lift=SOFT*0.10;      /* เบา เพราะความนุ่มหลักมาจากการเบลอขอบเงาแล้ว */
    if(lift<=0.004) return;
    const s=this.project(this.rotate(sunVec()));
    const ax=this.CX-(s.x-this.CX), ay=this.CY-(s.y-this.CY);
    const g=c.createRadialGradient(ax,ay,0,ax,ay,this.R*1.25);
    g.addColorStop(0,'rgba(238,235,227,'+lift.toFixed(3)+')');
    g.addColorStop(.55,'rgba(238,235,227,'+(lift*.62).toFixed(3)+')');
    g.addColorStop(1,'rgba(238,235,227,0)');
    c.save();
    c.beginPath(); c.arc(this.CX,this.CY,this.R,0,6.2832); c.clip();
    c.fillStyle=g; c.fillRect(this.CX-this.R,this.CY-this.R,this.R*2,this.R*2);
    c.restore();
  },
  paint(c,fast){
    const {CX,CY,R}=this;
    const s3=sunVec(), s=this.project(this.rotate(s3));
    const stride=fast?2:1;
    const term=this.terminator();
    /* 1. ซีกหลัง — วาดก่อนเนื้อทรงกลม จะได้ถูกกลบให้จางลงเองตามจริง */
    if(!fast){
      this.segs(c,GRID,.20,.7,false,1,'84,90,104',this.shadeDay);
      for(const cs of this.coastSets()) this.segs(c,cs[0],.30*cs[1],.8,false,1,'84,90,104',this.shadeDay);
    }
    /* 2. เนื้อทรงกลมฝั่งกลางวัน — จุดสว่างอยู่ทางดวงอาทิตย์จริง */
    const lit=s.z>=0;
    const hx=lit?CX+(s.x-CX)*.6:CX, hy=lit?CY+(s.y-CY)*.6:CY;
    const g=c.createRadialGradient(hx,hy,R*.04,CX,CY,R*1.06);
    g.addColorStop(0,'rgba(255,253,246,'+(lit?.5:.22)+')');
    g.addColorStop(.55,'rgba(240,238,232,0.15)');
    g.addColorStop(1,'rgba(196,193,186,0.06)');
    c.fillStyle=g; c.beginPath(); c.arc(CX,CY,R,0,Math.PI*2); c.fill();
    /* 3. ซีกกลางคืน = พื้นมืดจริง
       ของเดิมขอบคมเป๊ะเหมือนตัดกระดาษ เพราะซีกมืดถูก clip ด้วยรูปทรงเส้นแบ่งจริง
       ทั้งที่สนธยาของจริงเป็นแถบกว้างเกือบ 20 องศา

       ทางที่ผิด (เคยลองแล้วพัง): ข้ามการ clip ไปเลย — term.all แปลว่า "ทั้งซีกที่เห็นคือกลางคืน"
       ผลคือลบกลางวันทิ้งทั้งใบ ไม่ใช่การทำขอบให้นุ่ม
       ทางที่ถูก: เก็บรูปทรงเงาไว้ครบ แต่วาดลง canvas ซ่อนแล้วเบลอตอนเอามาทับ */
    if(term){
      const ax=CX-(s.x-CX), ay=CY-(s.y-CY);
      const blur=this.blurPx();
      const useBlur=blur>0.5 && ('filter' in c) && !term.all;
      let tgt=c;
      if(useBlur){
        if(!this._ncv) this._ncv=document.createElement('canvas');
        const dpr=Math.min(devicePixelRatio||1,2);
        if(this._ncv.width!==this.W*dpr||this._ncv.height!==this.H*dpr){
          this._ncv.width=this.W*dpr; this._ncv.height=this.H*dpr;
        }
        tgt=this._ncv.getContext('2d');
        tgt.setTransform(dpr,0,0,dpr,0,0);
        tgt.clearRect(0,0,this.W,this.H);
      }
      tgt.save();
      if(!useBlur){ tgt.beginPath(); tgt.arc(CX,CY,R,0,Math.PI*2); tgt.clip(); }
      if(!term.all){
        tgt.beginPath();
        tgt.moveTo(term.arc[0].x,term.arc[0].y);
        for(let i=1;i<term.arc.length;i++) tgt.lineTo(term.arc[i].x,term.arc[i].y);
        tgt.arc(CX,CY,R,term.a1,term.a0,term.ccw);
        tgt.closePath(); tgt.clip();
      }
      /* พื้นกลางคืนต้องเข้มสม่ำเสมอทั้งซีก ไม่ใช่ไล่ระดับจากจุดตรงข้ามดวงอาทิตย์
         ของเดิมถ้าจุดนั้นอยู่นอกจอ ซีกมืดที่เห็นจะได้แต่หางของไล่ระดับ (alpha ~0.10)
         จนแทบไม่ต่างจากกลางวัน — วัดได้ว่าต่างกันแค่ 20 หน่วยความสว่าง
         แก้เป็น: พื้นทึบสม่ำเสมอ + ไล่ระดับลึกขึ้นอีกนิดตรงกลางดึก */
      /* ถูก clip ด้วยรูปทรงเงาอยู่แล้ว เติมเต็มจอจึงพอ — ที่ซูมสูง R*2 ใหญ่กว่าจอหลายเท่า */
      const box=this.fillBox();
      tgt.fillStyle='rgba(34,40,60,0.34)';
      tgt.fillRect(box[0],box[1],box[2],box[3]);
      const n=tgt.createRadialGradient(ax,ay,0,ax,ay,R*0.95);
      n.addColorStop(0,'rgba(28,34,54,0.22)');
      n.addColorStop(.6,'rgba(32,38,58,0.10)');
      n.addColorStop(1,'rgba(36,42,62,0)');
      tgt.fillStyle=n; tgt.fillRect(box[0],box[1],box[2],box[3]);
      tgt.restore();
      if(useBlur){
        c.save();
        c.beginPath(); c.arc(CX,CY,R,0,Math.PI*2); c.clip();
        c.filter='blur('+blur.toFixed(1)+'px)';
        c.drawImage(this._ncv,0,0,this.W,this.H);
        c.filter='none';
        c.restore();
      }
    }
    /* 4. เส้นซีกหน้า — หมึกเข้มฝั่งกลางวัน / สีอ่อนฝั่งกลางคืน ไล่ข้ามกันตรงสนธยา */
    this.segs(c,GRID,.26,.75,true,1,'84,90,104',this.shadeDay);
    for(const cs of this.coastSets()) this.segs(c,cs[0],.46*cs[1],.9,true,stride,'84,90,104',this.shadeDay);
    if(term){
      /* กลางคืนอ่านออกได้จาก "การกลับขั้ว" — เส้นสว่างบนพื้นมืด ตรงข้ามกับกลางวัน
         จึงต้องเข้มพอจะเห็นชัด ไม่งั้นซีกมืดจะเป็นแค่พื้นที่เทา ๆ ที่ไม่มีอะไร
         (ไฟเมืองย้ายไปวาดสดใน sphere() เพราะต้องกะพริบ ซึ่งชั้นที่ cache ไว้ทำไม่ได้) */
      this.segs(c,GRID,.28,.75,true,1,'204,220,244',this.shadeNight);
      for(const cs of this.coastSets()) this.segs(c,cs[0],.60*cs[1],.95,true,stride,'222,232,248',this.shadeNight);
    }
    /* 5. เส้นขอบแสง — บาง จาง ให้รอยต่อมีรูปทรง
       จางลงตามความนุ่ม ที่นุ่มสุดหายไปเลย ไม่มีอะไรย้ำรอยตัด */
    const lineA=0.45*(1-SOFT);
    if(term&&!term.all&&lineA>0.02){
      c.strokeStyle='rgba(228,214,186,'+lineA.toFixed(3)+')'; c.lineWidth=.9;
      c.beginPath();
      c.moveTo(term.arc[0].x,term.arc[0].y);
      for(let i=1;i<term.arc.length;i++) c.lineTo(term.arc[i].x,term.arc[i].y);
      c.stroke();
    }
    /* 6. ขอบโลก + ชั้นบรรยากาศ: ทองด้านโดนแดด น้ำเงินด้านมืด */
    c.strokeStyle='rgba(70,76,86,0.45)'; c.lineWidth=1.1;
    c.beginPath(); c.arc(CX,CY,R,0,Math.PI*2); c.stroke();
    if(term&&!term.all&&!fast){
      [[R*.06,.045],[R*.032,.075],[R*.013,.12]].forEach(pair=>{
        const w=pair[0], al=pair[1];
        c.lineWidth=w*2;
        c.strokeStyle='rgba(198,154,84,'+al+')';
        c.beginPath(); c.arc(CX,CY,R-w*.5,term.a1,term.a0,!term.ccw); c.stroke();
        c.strokeStyle='rgba(120,146,200,'+(al*1.5).toFixed(3)+')';
        c.beginPath(); c.arc(CX,CY,R-w*.5,term.a1,term.a0,term.ccw); c.stroke();
      });
    }
  },
  /* โลกนิ่งเกือบตลอดเวลา → วาดลง canvas ซ่อนแล้ว blit
     วาดใหม่เฉพาะตอนหมุน/เปลี่ยนขนาด/ดวงอาทิตย์ขยับ (ทุก 5 นาที) */
  sphere(ctx){
    const dpr=Math.min(devicePixelRatio||1,2);
    /* "กำลังเคลื่อน" ต้องวัดจากการหมุนที่เกิดขึ้นจริง ไม่ใช่จากนิ้วที่แตะอยู่
       ของเดิมอ่าน this.drag ตรง ๆ แค่ "จิ้มค้าง" ไม่ได้ลาก รายละเอียดก็หายแล้ว */
    const moved=Math.abs(this.rotY-this._pY)+Math.abs(this.rotX-this._pX)+Math.abs(this.zoom-this._pZ)*.5;
    this._pY=this.rotY; this._pX=this.rotX; this._pZ=this.zoom;
    const moving=moved>1.5e-4;
    /* ลดรายละเอียดเฉพาะตอนเครื่องตามไม่ทันจริง ไม่ใช่เดาไว้ก่อนว่าจะไม่ทัน
       สิ่งที่ LOD ตัดทิ้งคือของที่ "หายไปทั้งชิ้น" (เส้นซีกหลัง ขอบบรรยากาศ แสงรอบไฟเมือง)
       รวมกันซื้อเวลาได้แค่ 0.8ms แต่แลกด้วยรายละเอียดวูบหายทุกครั้งที่ขยับ — ไม่คุ้ม
       บนเครื่องที่ไหว โลกจึงนิ่งเสมอ ส่วนเครื่องช้าค่อยได้ LOD อัตโนมัติ */
    const fast=moving && this._cost>PAINT_BUDGET;
    /* บักเก็ตต้องมาจาก sunKey() ไม่ใช่ Date.now() ไม่งั้นตอนย่อเวลา (หน้าโชว์)
       ดวงอาทิตย์ขยับแต่ภาพที่ cache ไว้ไม่ยอมวาดใหม่ */
    const key=[Math.round(this.rotY*260),Math.round(this.rotX*260),Math.round(this.zoom*120),this.W,this.H,fast?1:0,sunKey()].join(',');
    if(!this._cv){ this._cv=document.createElement('canvas'); this._cx=this._cv.getContext('2d'); }
    if(this._key!==key){
      this._key=key;
      if(this._cv.width!==this.W*dpr||this._cv.height!==this.H*dpr){ this._cv.width=this.W*dpr; this._cv.height=this.H*dpr; }
      this._cx.setTransform(dpr,0,0,dpr,0,0);
      this._cx.clearRect(0,0,this.W,this.H);
      const t0=performance.now();
      this.paint(this._cx,fast);
      /* ค่าเฉลี่ยเคลื่อนที่ กันไม่ให้เฟรมสะดุดเฟรมเดียวสั่งลดรายละเอียดทั้งชุด */
      this._cost=this._cost*.7+(performance.now()-t0)*.3;
    }
    ctx.drawImage(this._cv,0,0,this.W,this.H);
    /* สองชั้นนี้วาดสดทุกเฟรม: ชั้นยกความมืดถูกเพราะไม่มีเส้น ส่วนไฟเมืองต้องกะพริบ
       ถ้าอบไว้ในชั้นที่ cache ไฟจะค้างนิ่งตอนโลกหยุดหมุน */
    this.liftNight(ctx);
    if(this.terminator()) this.cities(ctx,fast);
  },
  /* ---------- หมอก (ข้อ 1, 6, 8) ----------
     วาดโลกเต็มคุณภาพตามปกติ แล้วลบความทึบทั้งใบด้วย destination-out
     โดยเจาะรูไว้ตรงจดหมายที่เลือก — ไม่ต้องวาดโลกสองรอบ
     ข้อ 6: เปิดวงเดียว เฉพาะฉบับที่เลือกอยู่ · ไม่เลือกฉบับไหน = ไม่มีรู */
  fog(ctx,hole){
    const dpr=Math.min(devicePixelRatio||1,2);
    if(!this._fcv) this._fcv=document.createElement('canvas');
    const cv=this._fcv;
    if(cv.width!==this.W*dpr||cv.height!==this.H*dpr){ cv.width=this.W*dpr; cv.height=this.H*dpr; }
    const m=cv.getContext('2d');
    m.setTransform(dpr,0,0,dpr,0,0);
    m.globalCompositeOperation='source-over';
    m.clearRect(0,0,this.W,this.H);
    m.fillStyle='rgba(0,0,0,'+CFG.FOG+')';
    m.fillRect(0,0,this.W,this.H);
    if(hole){
      m.globalCompositeOperation='destination-out';
      const g=m.createRadialGradient(hole.x,hole.y,0,hole.x,hole.y,hole.r);
      g.addColorStop(0,'rgba(0,0,0,1)');
      g.addColorStop(Math.max(0,1-CFG.FOG_SOFT),'rgba(0,0,0,1)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      m.fillStyle=g; m.beginPath(); m.arc(hole.x,hole.y,hole.r,0,6.2832); m.fill();
    }
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.drawImage(cv,0,0,this.W,this.H);
    ctx.restore();
  },
  /* ริ้วลม — จางไปตามปลายริ้ว บอกทิศในตัวโดยไม่ต้องมีหัวลูกศร
     ภาษาเดียวกับชุดอากาศ "ลม" ที่ออกแบบไว้แล้ว (เข้มด้านต้นลม จางด้านปลายลม)
     จัดกลุ่มตามความเข้มก่อน stroke เหมือน segs() ไม่งั้นจะยิง stroke หลายร้อยครั้งต่อเฟรม */
  streams(ctx,lines,alpha){
    if(!lines||!lines.length) return;
    const B=new Map();
    for(let l=0;l<lines.length;l++){
      const ln=lines[l], last=ln.length-1;
      const inten=clamp((ln.spd||10)/70,.12,1);
      /* หัวใจของความมีชีวิต: คลื่นสว่างวิ่งไปตามริ้ว แต่ละริ้วเหลื่อมเฟสกัน
         ริ้วรุ่นแรกของแกนไม่มี T อยู่ในสูตรเลยสักตัว จึงเป็นเส้นนิ่งสนิท
         ลมแรงกว่า คลื่นวิ่งเร็วกว่า — สื่อความเร็วด้วยจังหวะ ไม่ใช่ด้วยรูปทรง */
      const head=((T*(0.17+inten*0.30))+l*0.137)%1.35;
      /* หมุนและฉายจุดละครั้งเดียว แล้วใช้ซ้ำ — ช่วงที่ติดกันใช้จุดร่วมกัน
         ของเดิมหมุนทุกจุดสองรอบ = งานเกินเท่าตัวที่ 5,300 ช่วงต่อเฟรม */
      if(!ln._p || ln._p.length!==ln.length) ln._p=new Array(ln.length);
      for(let i=0;i<=last;i++){ const r=this.rotate(ln[i]); ln._p[i]= r.z<0.02 ? null : this.project(r); }
      for(let i=1;i<=last;i++){
        const p0=ln._p[i-1], p1=ln._p[i];
        if(!p0||!p1) continue;
        const r0=p0, r1=p1;
        if((p0.x<-8&&p1.x<-8)||(p0.x>this.W+8&&p1.x>this.W+8)) continue;
        if((p0.y<-8&&p1.y<-8)||(p0.y>this.H+8&&p1.y>this.H+8)) continue;
        const f=i/last;
        const along=Math.pow(1-f,.75);                     /* เข้มต้นลม จางปลายลม — บอกทิศในตัว */
        const near=Math.max(0,1-Math.abs(f-head)*4.5);     /* ช่วงที่คลื่นกำลังไหลผ่าน */
        const depth=.35+.65*Math.sqrt(Math.max(0,(r0.z+r1.z)*.5));
        const w=(ln.w===undefined?1:ln.w);
        let a=alpha*w*depth*((.20+inten*.42)*along + near*(.30+inten*.55)*along);
        if(a<=.006) continue;
        if(a>.55) a=.55;
        const ai=Math.min(17,Math.round(a*32));
        const wi=Math.min(3,Math.round(((.8+inten*.8)*(1+near*.6)-.7)*1.6));
        const key=ai*4+wi;
        let arr=B.get(key); if(!arr) B.set(key,arr=[]);
        arr.push(p0.x,p0.y,p1.x,p1.y);
      }
    }
    ctx.lineCap='round';
    B.forEach((arr,key)=>{
      ctx.strokeStyle='rgba(84,90,104,'+((key>>2)/32).toFixed(3)+')';
      ctx.lineWidth=.7+(key&3)/1.6;
      ctx.beginPath();
      for(let i=0;i<arr.length;i+=4){ ctx.moveTo(arr[i],arr[i+1]); ctx.lineTo(arr[i+2],arr[i+3]); }
      ctx.stroke();
    });
  },
  /* ---------- คืนสภาพแสงหลังหมอก (ข้อ 41) ----------
     หมอกลบความทึบ 72% ทุกอย่างนอกวงจึงจางเข้าหาสีกระดาษที่สว่าง
     ความมืดของกลางคืนก็ถูกลบไปด้วย → นอกวงมองไม่ออกว่าเป็นกลางคืน
     และวงเปิดกลายเป็นหลุมมืด (เคยวัดได้ว่ามืดกว่ารอบนอก 42 หน่วย)
     แก้: เทสีกลางคืนกลับลงไปเฉพาะนอกวง ให้เท่ากับที่หมอกลบไป
     ชั้นนี้เบลออยู่แล้วจึงวาดที่ครึ่งความละเอียดพอ — ลดงานลง 4 เท่าโดยตาไม่เห็นความต่าง */
  restoreNight(ctx,hole){
    const term=this.terminator();
    if(!term) return;
    const {CX,CY,R}=this;
    const dpr=Math.min(devicePixelRatio||1,2), SC=dpr*0.5;
    if(!this._rcv) this._rcv=document.createElement('canvas');
    const cv=this._rcv;
    const w=Math.ceil(this.W*SC), h=Math.ceil(this.H*SC);
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    const r=cv.getContext('2d');
    r.setTransform(SC,0,0,SC,0,0);
    r.globalCompositeOperation='source-over';
    r.clearRect(0,0,this.W,this.H);
    r.save();
    r.beginPath(); r.arc(CX,CY,R,0,6.2832); r.clip();
    if(!term.all){
      r.beginPath();
      r.moveTo(term.arc[0].x,term.arc[0].y);
      for(let i=1;i<term.arc.length;i++) r.lineTo(term.arc[i].x,term.arc[i].y);
      r.arc(CX,CY,R,term.a1,term.a0,term.ccw);
      r.closePath(); r.clip();
    }
    const box=this.fillBox();
    r.fillStyle='rgba(34,40,60,0.34)';
    r.fillRect(box[0],box[1],box[2],box[3]);
    r.restore();
    /* เจาะรูตรงวงเปิด — ในวงไม่ต้องเติมอะไร เพราะความมืดจริงแสดงอยู่แล้ว */
    if(hole){
      r.globalCompositeOperation='destination-out';
      const g=r.createRadialGradient(hole.x,hole.y,0,hole.x,hole.y,hole.r);
      g.addColorStop(0,'rgba(0,0,0,1)');
      g.addColorStop(Math.max(0,1-CFG.FOG_SOFT),'rgba(0,0,0,1)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      r.fillStyle=g; r.beginPath(); r.arc(hole.x,hole.y,hole.r,0,6.2832); r.fill();
    }
    /* ชั้นนี้ต้องเบลอ *น้อยกว่า* เงาหลัก (ทางแก้ที่จดไว้ในข้อ 39)
       ถ้าเบลอเท่ากัน ความมืดจะลามเข้าไปในวงเปิด ทำให้วงกลายเป็นรอยคล้ำ
       เห็นชัดที่สุดตอนซูมเข้าเส้นทางในประเทศ ซึ่งสนามแสงเกือบสม่ำเสมอทั้งจอ */
    const blur=this.blurPx()*0.42;
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,R,0,6.2832); ctx.clip();
    ctx.globalAlpha=CFG.FOG;                      /* เติมกลับเท่าที่หมอกลบไปพอดี */
    if(blur>0.5 && ('filter' in ctx)) ctx.filter='blur('+blur.toFixed(1)+'px)';
    ctx.drawImage(cv,0,0,this.W,this.H);
    ctx.filter='none'; ctx.globalAlpha=1;
    ctx.restore();
  },
  /* เส้นทางต้องอ่านออกทั้งบนพื้นกระดาษและบนซีกกลางคืนที่มืด
     → วาดสองชั้น: ชั้นรองสีอ่อนกว้างกว่า (casing) แล้วทับด้วยเส้นจริง */
  path(ctx,from,to,alpha){
    const list=[];
    for(let i=0;i<=60;i++) list.push(slerpLL(from,to,i/60));
    this.poly(ctx,list,alpha);
  },
  /* เส้นทางที่ลมพัดพา — รับรายการจุดจริง ไม่ใช่แค่ต้นทางกับปลายทาง
     ตัดเป็นช่วง ๆ ตรงที่ลอดหลังโลก จะได้ไม่ลากเส้นพาดผ่านทรงกลม */
  poly(ctx,list,alpha){
    const runs=[]; let cur=null;
    for(let i=0;i<list.length;i++){
      const pr=this.pipe(list[i].lat,list[i].lng);
      if(pr.z>=0){ if(!cur) runs.push(cur=[]); cur.push(pr.x,pr.y); }
      else cur=null;
    }
    const trace=()=>{
      ctx.beginPath();
      for(const r of runs){
        ctx.moveTo(r[0],r[1]);
        for(let i=2;i<r.length;i+=2) ctx.lineTo(r[i],r[i+1]);
      }
    };
    ctx.lineWidth=3.2; ctx.strokeStyle='rgba(246,243,235,'+(alpha*.45).toFixed(3)+')';
    trace(); ctx.stroke();
    ctx.lineWidth=1.4; ctx.strokeStyle='rgba(126,114,88,'+alpha+')';
    trace(); ctx.stroke();
  },
  node(ctx,p,hollow){
    if(p.z<-.1) return;
    const a=p.z<0?.25:.9;
    if(hollow){
      ctx.strokeStyle='rgba(60,60,66,'+a+')';ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.stroke();
    }else{
      ctx.fillStyle='rgba(60,60,66,'+a+')';
      ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,Math.PI*2);ctx.fill();
    }
  },
  dot(ctx,p,pulse,sel){
    if(p.z<-.05) return;
    const a=p.z<0?.3:1;
    const r=9*(sel?1.35:1);
    const halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    halo.addColorStop(0,'rgba(198,154,84,'+(.45*a*pulse)+')');
    halo.addColorStop(1,'rgba(198,154,84,0)');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(210,168,96,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,sel?3.4:2.8,0,Math.PI*2);ctx.fill();
  },
  ghost(ctx,p){    /* จดหมายที่หายไปกับลม — จางค้างไว้ */
    if(p.z<0) return;
    ctx.strokeStyle=col(.22);ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,Math.PI*2);ctx.stroke();
  }
};

/* ---------- จดหมาย = กระดาษคลี่ (mesh warp จาก letter-flutter) ---------- */
function meshPoints(W,H,t,wind,cols,rows){
  const sway=8+wind*46, freq=1.2+wind*3.2, speed=.6+wind*2.6, flap=wind*wind;
  const pts=[];
  for(let r=0;r<=rows;r++){
    const row=[], v=r/rows;
    for(let c=0;c<=cols;c++){
      const u=c/cols;
      let x=(u-.5)*W, y=(v-.5)*H;
      const ripple=Math.sin(u*freq*Math.PI*2+v*1.5-t*speed);
      const edge=Math.pow(u,1.6);
      const cornerBoost=1+flap*edge*Math.abs(v-.5)*2.4;
      x+=ripple*sway*.25*(.4+edge);
      const z=ripple*(sway*.5)*edge*cornerBoost;
      y+=z*.35;
      x+=Math.sin(v*Math.PI)*-sway*.15;
      row.push({x,y,z,u,v});
    }
    pts.push(row);
  }
  return {pts,sway};
}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const c255=v=>Math.max(0,Math.min(255,v))|0;

/* จดหมายปลิว (ใช้ตอนพยากรณ์/ส่ง) — LOD ใกล้: mesh เต็ม ฉบับเดียวเท่านั้น */
function drawFlutter(ctx,cx,cy,W,H,t,wind,age,traces){
  const cols=12, rows=15;
  const {pts,sway}=meshPoints(W,H,t,wind,cols,rows);
  const tilt=(wind-.35)*.5;
  const base=mix([236,234,225],[206,190,150],age*.85);
  ctx.save();
  ctx.translate(cx+Math.sin(t*.4)*(4+wind*16), cy+Math.sin(t*.33+9.1)*(3+wind*9));
  ctx.rotate(tilt*.4+Math.sin(t*.5+3)*.03);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const p00=pts[r][c],p10=pts[r][c+1],p11=pts[r+1][c+1],p01=pts[r+1][c];
    const zAvg=(p00.z+p10.z+p11.z+p01.z)/4;
    const shade=clamp(zAvg/(sway*.6+.001),-1,1), lift=shade*22;
    ctx.beginPath();ctx.moveTo(p00.x,p00.y);ctx.lineTo(p10.x,p10.y);ctx.lineTo(p11.x,p11.y);ctx.lineTo(p01.x,p01.y);ctx.closePath();
    ctx.fillStyle='rgba('+c255(base[0]+lift)+','+c255(base[1]+lift)+','+c255(base[2]+lift)+','+(.9-Math.max(0,shade)*.18)+')';
    ctx.fill();
  }
  ctx.strokeStyle='rgba(43,43,47,'+(.32-age*.12)+')';ctx.lineWidth=1;
  for(let r=3;r<rows-2;r+=2){
    if(r%6===5) continue;
    ctx.beginPath();
    const cEnd=cols-1-(r%3);
    for(let c=1;c<=cEnd;c++){ const p=pts[r][c]; c===1?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
    ctx.stroke();
  }
  if(traces&&traces.rain>0.02) rainBlooms(ctx,traces.rain,(u,v)=>pts[Math.round(v*rows)][Math.round(u*cols)],1);
  if(wind>.5){
    ctx.strokeStyle='rgba(80,72,58,'+((wind-.5)*.5)+')';ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let r=0;r<=rows;r++){ const p=pts[r][cols]; r===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
    ctx.stroke();
  }
  ctx.restore();
}

/* ร่องรอยฝน — วางที่ขอบ/มุมเท่านั้น ห้ามทับตัวอักษร */
function rainBlooms(ctx,rain,at,sizeK){
  const n=Math.floor(clamp(rain,0,1)*14);
  for(let i=0;i<n;i++){
    let u=Math.sin(i*12.9)*.5+.5, v=Math.sin(i*7.7+2.1)*.5+.5;
    u = u<.5 ? u*.30 : 1-(1-u)*.30;            /* ดันเข้าขอบซ้าย/ขวา */
    if(v>.22&&v<.80) v = (i%2) ? v*.24 : 1-(1-v)*.22;
    const p=at(clamp(u,0,1),clamp(v,0,1));
    const rad=(6+(Math.sin(i*3.3)*.5+.5)*20)*(0.5+rain)*sizeK;
    const a=(.10+rain*.14);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    g.addColorStop(0,'rgba(90,84,70,'+a+')');
    g.addColorStop(.6,'rgba(90,84,70,'+(a*.4)+')');
    g.addColorStop(1,'rgba(90,84,70,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fill();
  }
}

/* กระดาษตอนเปิดอ่าน — นิ่ง อ่านง่าย ร่องรอยอยู่ขอบ */
function drawPaper(cv,traces){
  const ctx=cv.getContext('2d');
  const DPR=Math.min(devicePixelRatio||1,2);
  const W=cv.clientWidth, H=cv.clientHeight;
  if(!W||!H) return;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  /* เพดานร่องรอย: ต้องยังอ่านว่า "ผ่านการเดินทางมา" ไม่ใช่ "เสียหาย" */
  const age=clamp(traces.days/7,0,1), storm=clamp(traces.storm/3,0,1), rain=clamp(traces.rain,0,1);
  const base=mix([243,239,230],[216,203,171],age*.72);
  /* เนื้อกระดาษ */
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgb('+c255(base[0]+4)+','+c255(base[1]+4)+','+c255(base[2]+4)+')');
  g.addColorStop(1,'rgb('+c255(base[0]-6)+','+c255(base[1]-7)+','+c255(base[2]-8)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  /* เส้นใยกระดาษ — ต้องจางจนแทบไม่เห็น ไม่ใช่เส้นบรรทัด */
  ctx.lineWidth=1;
  for(let i=0;i<9;i++){
    const y=((Math.sin(i*23.7)*.5+.5)*H);
    ctx.strokeStyle='rgba(120,110,90,'+(.018+(i%3)*.006)+')';
    ctx.beginPath();ctx.moveTo(-4,y);
    ctx.bezierCurveTo(W*.3,y+Math.sin(i*2.1)*6,W*.7,y-Math.sin(i*1.7)*7,W+4,y+Math.sin(i)*3);
    ctx.stroke();
  }
  for(let i=0;i<3;i++){
    const x=((Math.sin(i*11.3+1)*.5+.5)*W);
    ctx.strokeStyle='rgba(120,110,90,.016)';
    ctx.beginPath();ctx.moveTo(x,-4);
    ctx.bezierCurveTo(x+5,H*.35,x-6,H*.7,x+2,H+4);
    ctx.stroke();
  }
  /* คราบฝนที่ขอบ */
  if(rain>.02) rainBlooms(ctx,rain,(u,v)=>({x:u*W,y:v*H}),0.9);
  /* รอยยับจากพายุ — เส้นเฉียงที่ขอบ + ขอบช้ำ */
  if(storm>.02){
    ctx.lineCap='round';
    const n=Math.round(2+storm*5);
    for(let i=0;i<n;i++){
      const side=i%2, y0=(Math.sin(i*4.1)*.5+.5)*H;
      const len=(20+storm*70);
      ctx.strokeStyle='rgba(96,86,66,'+(.06+storm*.12)+')';
      ctx.lineWidth=1+storm*1.2;
      ctx.beginPath();
      if(side){ ctx.moveTo(W,y0); ctx.quadraticCurveTo(W-len*.6,y0+len*.3,W-len,y0+len*.7); }
      else    { ctx.moveTo(0,y0); ctx.quadraticCurveTo(len*.6,y0-len*.3,len,y0-len*.7); }
      ctx.stroke();
    }
    const e=ctx.createLinearGradient(0,0,0,H);
    e.addColorStop(0,'rgba(92,80,58,'+(storm*.16)+')');
    e.addColorStop(.12,'rgba(92,80,58,0)');
    e.addColorStop(.88,'rgba(92,80,58,0)');
    e.addColorStop(1,'rgba(92,80,58,'+(storm*.16)+')');
    ctx.fillStyle=e;ctx.fillRect(0,0,W,H);
  }
  /* ขอบเก่า */
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);
  v.addColorStop(0,'rgba(120,105,75,0)');
  v.addColorStop(1,'rgba(120,105,75,'+(.05+age*.14)+')');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,105,75,'+(.12+age*.18)+')';ctx.lineWidth=1;
  ctx.strokeRect(.5,.5,W-1,H-1);
}
/* ============================================================
   7 · DRIFT PATH BENCH — จำลองเส้นทางที่ลมพัดพาจริง
   ยังไม่อยู่ในแอป · ใช้ลมจริงจาก Open-Meteo · ตัดสินด้วยตาว่าโค้งแค่ไหนถึงสวย
   ============================================================ */

/* destPoint() ย้ายไปอยู่ในแกน (index.html) แล้วตอนพอร์ต drift เข้าแอปจริง */
/* ระยะเบี่ยงจากเส้นตรง (cross-track) */
function crossTrack(A,B,P){
  const R=6371;
  const d13=gcDist(A,P)/R, t13=bearing(A,P)*RAD, t12=bearing(A,B)*RAD;
  return Math.abs(Math.asin(Math.sin(d13)*Math.sin(t13-t12))*R);
}
/* ตารางลมครอบเส้นทาง — ตามยาว nA จุด × ตามขวาง nX จุด */
function windGrid(A,B,nA,nX,halfKm){
  const pts=[], meta=[];
  for(let i=0;i<nA;i++){
    const t=nA===1?0:i/(nA-1);
    const c=slerpLL(A,B,t);
    const nxt=slerpLL(A,B,Math.min(1,t+0.01));
    const brg=bearing(c,nxt);
    for(let j=0;j<nX;j++){
      const off=nX===1?0:(j/(nX-1)-0.5)*2*halfKm;
      const p= off===0 ? c : destPoint(c.lat,c.lng,brg+90,off);
      pts.push(p); meta.push({t,off});
    }
  }
  return {pts,meta,nA,nX};
}
/* ลม ณ พิกัดใด ๆ — ถ่วงน้ำหนักผกผันระยะจาก 4 จุดใกล้สุด */
function windAt(grid,wx,lat,lng,hours){
  const P={lat,lng};
  /* หา 4 จุดใกล้สุดโดยไม่ต้อง sort ทั้งชุด — ฟังก์ชันนี้ถูกเรียกหลายพันครั้งต่อการสร้างริ้วลมหนึ่งรอบ */
  const bd=[Infinity,Infinity,Infinity,Infinity], bi=[-1,-1,-1,-1];
  for(let i=0;i<grid.pts.length;i++){
    const d=gcDist(P,grid.pts[i]);
    if(d>=bd[3]) continue;
    let s=3;
    while(s>0 && d<bd[s-1]){ bd[s]=bd[s-1]; bi[s]=bi[s-1]; s--; }
    bd[s]=d; bi[s]=i;
  }
  const near=[];
  for(let n=0;n<4;n++) if(bi[n]>=0) near.push([bd[n],bi[n]]);
  const k=near.length;
  let ws=0, we=0, wn=0, wp=0, sum=0;
  for(let n=0;n<k;n++){
    const [d,i]=near[n];
    const w=1/Math.max(1,d*d);
    const s=sampleWx(wx[i],hours);
    const blow=(s.dir+180)*RAD;
    ws+=s.spd*w; we+=Math.sin(blow)*s.spd*w; wn+=Math.cos(blow)*s.spd*w; wp+=s.pre*w; sum+=w;
  }
  const E=we/sum, N=wn/sum;
  return { spd:ws/sum, pre:wp/sum, blowE:E, blowN:N,
           blowBrg:(Math.atan2(E,N)*DEG+360)%360, blowSpd:Math.hypot(E,N) };
}
/* จำลองการเดินทาง: มุ่งหน้าหาปลายทางเสมอ + ลมผลัก */
function simDrift(A,B,grid,wx,opt){
  /* ก้าวเดินต้องแปรตามระยะ ไม่ใช่ค่าคงที่ (หลัก 46.2) — ที่ 609 กม. ก้าวคงที่ 0.3 ชม.
     ให้เส้นทางแค่ 7 จุด ซึ่งหักเป็นเหลี่ยม ใช้ตัวเดียวกับแกนเพื่อให้ตรงกัน */
  const gain=opt.gain, maxH=opt.maxH||24*6;
  const _st=driftStep(gcDist(A,B)), dt=_st.dt, NEARKM=_st.near;
  const path=[{lat:A.lat,lng:A.lng,t:0}];
  let p={lat:A.lat,lng:A.lng}, t=0, travelled=0, held=0, maxOff=0;
  const events=[];
  for(let step=0; step<4000; step++){
    const left=gcDist(p,B);
    if(left<NEARKM){ travelled+=left; path.push({lat:B.lat,lng:B.lng,t}); break; }   /* นับช่วงสุดท้ายด้วย ไม่งั้นระยะที่รายงานสั้นกว่าเส้นที่วาดจริง */
    const w=windAt(grid,wx,p.lat,p.lng,t);
    /* พายุ = จอดรอ (กติกาเดิมยังใช้) */
    if(w.spd>=CFG.HOLD_KMH){
      const hold=Math.min(dt, clamp((w.spd-CFG.HOLD_KMH)/9+.5,.5,CFG.HOLD_MAX));
      t+=hold; held+=hold;
      events.push({t,kind:'hold',spd:w.spd});
      /* ต้องบันทึกจุดตอนจอดด้วย ไม่งั้นเวลาเดินแต่ตำแหน่งกระโดดข้าม
         ทำให้ตอนเล่นย้อนดูจดหมายไม่ได้ "หยุดรอ" ให้เห็น */
      path.push({lat:p.lat,lng:p.lng,t,hold:1});
      if(t>maxH) break;
      continue;
    }
    /* รวมเวกเตอร์บนระนาบสัมผัส: ความตั้งใจไปให้ถึง + ลมที่ผลัก */
    const hb=bearing(p,B)*RAD;
    const E=Math.sin(hb)*CFG.SPEED + w.blowE*gain;
    const N=Math.cos(hb)*CFG.SPEED + w.blowN*gain;
    const spd=Math.hypot(E,N), brg=(Math.atan2(E,N)*DEG+360)%360;
    const dist=Math.min(spd*dt, left);
    p=destPoint(p.lat,p.lng,brg,dist);
    t+=dt; travelled+=dist;
    maxOff=Math.max(maxOff,crossTrack(A,B,p));
    path.push({lat:p.lat,lng:p.lng,t});
    if(t>maxH){ events.push({t,kind:'timeout'}); break; }
  }
  const direct=gcDist(A,B);
  /* เวลาต้องผ่านกฎเวลาฐานเดียวกับแอปจริง (ข้อ 46.9) ไม่งั้นหน้าโชว์จะบอกเวลาคนละชุดกับแอป
     609 กม. ที่ยังไม่ผ่านกฎได้ 1.5 ชม. · ผ่านแล้วได้ ~5.8 ชม. ตามที่ผู้ใช้จะเจอจริง */
  const straightH=direct/CFG.SPEED;
  const baseH=Math.max(CFG.FLOOR_H*Math.min(1,Math.sqrt(direct/CFG.ANCHOR_KM)), straightH);
  const k = straightH>0 ? baseH/straightH : 1;
  if(k!==1){ t*=k; held*=k; for(const q of path) q.t*=k; }
  return { path, hours:t, travelled, direct, held, maxOff,
           ratio:travelled/direct, arrived:gcDist(p,B)<80 || path.length>1 && gcDist(path[path.length-1],B)<80,
           events };
}

let W=0,H=0,DPR=1,T=0,last=performance.now();

/* ---------- นาฬิกาแสง ----------

const DEPART_MS=Date.now();

SUN_BUCKET=9e5;

/* เวลาท้องถิ่นตรงที่จดหมายอยู่ — ทำให้กลางวัน-กลางคืนมีความหมาย ไม่ใช่แค่เฉดสี */

/* ---------- เตรียมข้อมูลจริง ---------- */
async function boot(){
  /* พื้นล่าง 300 กม.เดิม ทำให้ทางเดินลมของเส้น 609 กม. กว้าง 49% ของเส้นทาง
     ริ้วลมจึงเกิดไกลจากเส้นทางมาก — ลดพื้นล่างลง สัดส่วนเดิมของเส้นไกลไม่เปลี่ยน */
  /* พื้นล่างเดิม 300 กม. ทำให้ทางเดินลมของเส้น 609 กม. กว้าง 49% ของเส้นทาง
     แต่แคบเกินไปก็ไม่ดี — สนามลมจะเหมือนกันหมดจนริ้วขนานกันเป็นพืด
     130 กม. คือจุดที่เส้นในประเทศยังเจอลมที่ต่างกันจริง โดยเส้นไกลไม่เปลี่ยน */
  const half=clamp(gcDist(FROM,TO)*0.10,130,1800);
  const grid=windGrid(FROM,TO,16,5,half);
  const wx=await fetchWx(grid.pts);
  const run=simDrift(FROM,TO,grid,wx,{gain:CFGD.GAIN,dt:CFGD.DT});
  /* สภาพอากาศจริงตลอดเส้นทาง */
  const marks=[];
  run.path.forEach(p=>{
    const w=windAt(grid,wx,p.lat,p.lng,p.t);
    p.w=w; p.kind=kindOf(w);
    if(p.kind===4) marks.push(p.t/run.hours);
  });
  /* หาจังหวะที่จดหมายข้ามเส้นแบ่งกลางวัน-กลางคืน — ใช้เป็นโมเมนต์ของเรื่อง */
  const crossings=[]; let prevDot=null;
  run.path.forEach(p=>{
    const dot=sunDot(p.lat,p.lng,DEPART_MS+p.t*3600000);
    if(prevDot!==null && (dot>0)!==(prevDot>0)) crossings.push({t:p.t, kind:dot>0?'dawn':'dusk'});
    prevDot=dot;
  });
  data={grid,wx,run,marks,crossings};
  buildMarks();
  $('#t1').textContent='ถึงใน '+fmtDur(run.hours);
  /* เตรียมริ้วลมทุกช่วงเวลาไว้ก่อน เพื่อให้ตอนเล่นไม่สะดุดเลย */
  const keys=[];
  for(let h=0;h<=run.hours+2;h+=2) keys.push(streamKey(h));
  for(let i=0;i<keys.length;i++){
    streamlines(keys[i]);
    if(i%3===0){
      $('#boot').innerHTML='กำลังคลี่สนามลมตลอดการเดินทาง…<br><span style="opacity:.55">'
        +Math.round((i+1)/keys.length*100)+'%</span>';
      await new Promise(r=>setTimeout(r,0));
    }
  }
  $('#boot').classList.add('gone');
}
function kindOf(w){
  if(w.spd>=CFG.HOLD_KMH) return 4;
  if(w.pre>=2.5) return 3;
  if(w.pre>=0.15) return 2;
  if(w.spd>=22) return 1;
  return 0;
}
function buildMarks(){
  const box=$('#marks'), H=data.run.hours;
  box.innerHTML=
    data.marks.map(f=>'<i class="storm" style="left:'+(f*100).toFixed(2)+'%"></i>').join('')
    + data.crossings.map(c=>'<i class="'+c.kind+'" style="left:'+(c.t/H*100).toFixed(2)+'%"></i>').join('');
}
/* จุดบนเส้นทาง ณ เวลา t (ชม.) */
function at(t){
  const P=data.run.path;
  if(t<=0) return {p:P[0],i:0};
  for(let i=1;i<P.length;i++){
    if(P[i].t>=t){
      const a=P[i-1], b=P[i], k=(t-a.t)/Math.max(1e-6,b.t-a.t);
      const v=slerpV(a,b,k), ll=fromXYZ(v);
      return {p:{lat:ll.lat,lng:ll.lng,t}, i, near:(k<.5?a:b)};
    }
  }
  return {p:P[P.length-1], i:P.length-1, near:P[P.length-1]};
}
/* ---------- พายุ ----------
   พายุคือลม → ตามข้อ 31 จึงต้องมองเห็นทะลุหมอกได้ทั้งเส้นทาง ไม่ใช่เฉพาะตรงจดหมาย
   ผลพลอยได้: เห็นพายุรออยู่ข้างหน้าก่อนจดหมายจะไปถึง โดยไม่ได้เปิดเผยเส้นทาง (ไม่ขัดข้อ 2) */
let stormCache={key:'',list:[]};
function stormsAt(hours){
  const key=Math.round(hours);
  if(stormCache.key===key) return stormCache.list;
  const {grid,wx}=data, list=[];
  grid.pts.forEach((gp,i)=>{
    const s=sampleWx(wx[i],key);
    if(s.spd<CFG.HOLD_KMH) return;
    for(const st of list){                       /* รวมจุดที่ติดกันเป็นพายุลูกเดียว */
      if(gcDist(st,gp)<900){
        if(s.spd>st.spd){ st.lat=gp.lat; st.lng=gp.lng; st.spd=s.spd; }
        return;
      }
    }
    list.push({lat:gp.lat,lng:gp.lng,spd:s.spd});
  });
  list.sort((a,b)=>b.spd-a.spd);
  stormCache={key,list:list.slice(0,6)};
  return stormCache.list;
}
/* ขนาดพายุผูกกับระยะจริงบนผิวโลก ไม่ใช่พิกเซลคงที่
   ระบบพายุจริงกว้าง 800-1,800 กม. → ที่สเกลโลกนี้คือ 20-35px และโตตามเมื่อซูม */
function stormKm(spd){ return 800 + stormIntensity(spd)*1000; }
function drawStorms(c,hours){
  const list=stormsAt(hours);
  for(const s of list){
    const r=G.rotate(toXYZ(s.lat,s.lng));
    if(r.z<0.02) continue;
    const p=G.project(r);
    const inten=stormIntensity(s.spd);
    const px=G.R*Math.sin(stormKm(s.spd)/6371);
    c.save(); c.globalAlpha=.45+.55*Math.sqrt(Math.max(0,r.z));
    /* wxStorm คิดขนาดเองจากความแรง (9+inten*15) แต่บนโลกจริงพายุต้องกินพื้นที่ตามภูมิศาสตร์
       จึงแปลงขนาดที่ต้องการกลับเป็น scale ให้มัน — ความหนาเส้นไม่โตตาม จึงยังเป็นริ้วบาง */
    wxStorm(c,p.x,p.y,T,inten,false,px/(9+inten*15));
    c.restore();
  }
}
/* ลมใกล้พายุต้องหมุนวนเข้าหาตาพายุ — ซีกเหนือทวนเข็ม ซีกใต้ตามเข็ม (ของจริงเป็นแบบนั้น)
   ตารางลม 16×5 หยาบเกินกว่าจะจับการหมุนได้เอง ต้องใส่ให้ */
function swirlAt(lat,lng,storms){
  let E=0,N=0,pull=0,eye=0;
  for(const s of storms){
    const d=gcDist({lat,lng},s);
    const km=stormKm(s.spd), R0=km*2.2;
    if(d<km*.28) eye=1;                          /* ถึงกำแพงตาแล้ว */
    if(d>R0||d<1) continue;
    const p=1-d/R0;
    if(p>pull) pull=p;
    const sign=s.lat>=0?1:-1;
    const toS=bearing({lat,lng},s);
    const tang=(toS+90*sign+360)%360;            /* วนรอบ */
    const f=p*s.spd*1.05;
    E+=Math.sin(tang*RAD)*f + Math.sin(toS*RAD)*f*.45;   /* + ดูดเข้าหาศูนย์กลาง */
    N+=Math.cos(tang*RAD)*f + Math.cos(toS*RAD)*f*.45;
  }
  return {E,N,pull,eye};
}

/* ---------- ริ้วลม (ข้อ 31 — วาดทับหมอก) ---------- */
/* การสร้างริ้วลมหนึ่งรอบใช้ ~23ms ถ้าสร้างระหว่างเล่นจะสะดุดเป็นระยะ
   → คำนวณทุกช่วงเวลาไว้ตั้งแต่ตอนโหลด (หน้าโหลดค้างอยู่แล้ว) เล่นจริงเหลือแค่หยิบมาใช้ */
const streamSets=new Map();
function streamKey(hours){ return Math.round(hours/2)*2; }
function streamlines(hours){
  const key=streamKey(hours);
  if(streamSets.has(key)) return streamSets.get(key);
  const lines=buildStreams(key);
  streamSets.set(key,lines);
  return lines;
}
function buildStreams(key){
  const {grid,wx}=data, lines=[];
  const DIRECT=gcDist(FROM,TO);
  const STREAM_KM=Math.max(1.5, DIRECT*CFGD.STREAM_FRAC);
  const SEED_KM =Math.max(3,   DIRECT*CFGD.SEED_FRAC);
  /* ความหนาแน่นของริ้วต้องตามความแปรปรวนจริงของลม ไม่ใช่ตายตัว
     เส้นข้ามทวีปพาดผ่านหลายระบบอากาศ ริ้วจึงแยกทางกันเองและอ่านเป็นกระแส
     เส้นในประเทศวันลมสงบ ลมเกือบเท่ากันทั้งแถบ ริ้วจะขนานกันแล้วซ้อนเป็นก้อนเทา
     → ลมนิ่งก็ควรมีริ้วน้อยลง ไม่ใช่ปั้นให้วน */
  const seeds = DIRECT>3000 ? CFGD.SEEDS_PER_PT : 1;
  const storms=stormsAt(key);
  for(let i=0;i<grid.pts.length;i++){
    for(let n=0;n<seeds;n++){
      /* เขยิบจุดตั้งต้น ไม่งั้นริ้วลมจะเรียงเป็นตารางให้เห็นว่ามาจากกริด */
      const h=i*3+n, j=grid.pts[i];
      let p=destPoint(j.lat,j.lng,(Math.sin(h*12.9)*.5+.5)*360,(Math.sin(h*7.7)*.5+.5)*SEED_KM);
      const pts=[toXYZ(p.lat,p.lng)], pulls=[0]; let spd=0, maxPull=0;
      for(let s=0;s<CFGD.STREAM_STEPS;s++){
        const w=windAt(grid,wx,p.lat,p.lng,key);
        const sw=swirlAt(p.lat,p.lng,storms);
        if(sw.eye) break;                          /* ริ้วจบที่กำแพงตา สายตาจะได้ไปรวมตรงนั้น */
        const E=w.blowE+sw.E, N=w.blowN+sw.N;
        const mag=Math.hypot(E,N);
        if(!(mag>0.5)) break;
        spd=Math.max(spd,Math.max(w.spd,mag));
        if(sw.pull>maxPull) maxPull=sw.pull;
        p=destPoint(p.lat,p.lng,(Math.atan2(E,N)*DEG+360)%360,STREAM_KM);
        pts.push(toXYZ(p.lat,p.lng)); pulls.push(sw.pull);
      }
      if(pts.length>4) lines.push({pts,pulls,spd,maxPull});
    }
  }
  return lines;
}
/* ~157 เส้น × 12 ช่วง = เกือบ 2,000 ช่วง ถ้า stroke ทีละช่วงจะหลุด 16ms
   จึงจัดกลุ่มตามระดับความเข้ม+ความหนา แล้ว stroke ทีเดียวต่อกลุ่ม (วิธีเดียวกับที่โค้ดโลกใช้) */
const streamBuckets=new Map();
function drawStreams(c){
  const lines=streamlines(jt);
  streamBuckets.forEach(v=>{ v.length=0; });
  for(let l=0;l<lines.length;l++){
    const {pts,pulls,spd,maxPull}=lines[l];
    const intensity=clamp(spd/70,.12,1);
    /* ริ้วที่ถูกพายุดูด หัวจะวิ่งเร็วขึ้น — สื่อความเร่งด้วยจังหวะ ไม่ใช่ด้วยรูปทรง */
    const head=((T*(0.16+maxPull*0.55))+l*0.137)%1.35;
    for(let i=1;i<pts.length;i++){
      const f=i/(pts.length-1), pull=pulls[i]||0;
      const a0=G.rotate(pts[i-1]);
      if(a0.z<0) continue;
      const a1=G.rotate(pts[i]);
      if(a1.z<0) continue;
      const p0=G.project(a0), p1=G.project(a1);
      /* อากาศเปิด: เข้มต้นลม จางปลายลม (ภาษา wind6 บอกทิศ)
         ใกล้พายุ: กลับเป็นสว่างขึ้นเมื่อเข้าใกล้ ไม่งั้นลมจะจางที่สุดตรงที่อยากให้เด่นที่สุด */
      const along=Math.pow(1-f,.75)*(1-pull) + Math.pow(f,.6)*pull;
      const near=Math.max(0,1-Math.abs(f-head)*4.5);       /* ช่วงที่กำลังไหลผ่าน */
      /* ลมต้องเข้มกว่าแผ่นดินใต้หมอก (ประสิทธิผล ~0.13) ไม่งั้นพระเอกจางกว่าฉาก */
      let a=(.09+intensity*.20)*along + near*(.14+intensity*.26)*along;
      a*=(1+pull*2.0);
      if(a<=.006) continue;
      if(a>.55) a=.55;
      const ai=Math.min(17,Math.round(a*32));
      const wi=Math.min(3,Math.round(((.8+intensity*.8)*(1+near*.6)*(1+pull*.9)-.7)*1.6));
      const key=ai*4+wi;
      let arr=streamBuckets.get(key);
      if(!arr) streamBuckets.set(key,arr=[]);
      arr.push(p0.x,p0.y,p1.x,p1.y);
    }
  }
  streamBuckets.forEach((arr,key)=>{
    if(!arr.length) return;
    c.strokeStyle='rgba(84,90,104,'+((key>>2)/32).toFixed(3)+')';
    c.lineWidth=.7+(key&3)/1.6;
    c.beginPath();
    for(let i=0;i<arr.length;i+=4){ c.moveTo(arr[i],arr[i+1]); c.lineTo(arr[i+2],arr[i+3]); }
    c.stroke();
  });
}
/* ---------- หมอก (ข้อ 1,8,28) ---------- */
/* drawFogMask() กับ restoreNight() ย้ายเข้าแกนแล้วเป็น G.fog() / G.restoreNight() (พอร์ตหมอก 23 ส.ค.) */

/* ---------- รอยข้างหลัง (ข้อ 2) ---------- */
function drawTrail(c,uptoT){
  const P=data.run.path;
  const runs=[]; let cur=null;
  for(let i=0;i<P.length;i++){
    if(P[i].t>uptoT) break;
    const pr=G.pipeV(toXYZ(P[i].lat,P[i].lng));
    if(pr.z>=0){ if(!cur) runs.push(cur=[]); cur.push(pr.x,pr.y); }
    else cur=null;
  }
  if(!runs.length) return;
  const trace=()=>{ c.beginPath(); for(const r of runs){ c.moveTo(r[0],r[1]); for(let i=2;i<r.length;i+=2) c.lineTo(r[i],r[i+1]); } };
  c.lineWidth=3.2; c.strokeStyle='rgba(246,243,235,.42)'; trace(); c.stroke();
  c.lineWidth=1.5; c.strokeStyle='rgba(126,114,88,.85)'; trace(); c.stroke();
}
/* ---------- คำบรรยาย ---------- */
function saying(k,w,align,done){
  if(done) return 'จดหมายถึงมือ<b> '+TO.name+' </b>แล้ว';
  if(k===4) return 'พายุขวางทาง — จดหมาย<b>จอดรอ</b>ให้ลมสงบ';
  if(k===3) return 'ฝนหนักทั้งผืนฟ้า กระดาษเริ่มมีคราบ';
  if(k===2) return 'ฝนปรอยบาง ๆ ผ่านมาแล้วก็ผ่านไป';
  if(align>.35) return 'ลมวันนี้ไปทางเดียวกับจดหมาย <b>มันไปไว</b>';
  if(align<-.35) return 'ลมพัดสวนมา จดหมาย<b>ค่อย ๆ ฝ่าไป</b>';
  if(k===1) return 'ลมพัดเฉียง จดหมายเอียงตามไปเรื่อย ๆ';
  return 'ฟ้าเปิด ลมเรื่อย ๆ ไม่ช่วยไม่ขวาง';
}
/* ---------- เฟรม ---------- */
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  T += REDUCED ? dt*.25 : dt;
  if(!document.hidden && data){
    if(playing){
      jt += dt*(data.run.hours/CFGD.PLAY_SEC);
      if(jt>=data.run.hours){ jt=data.run.hours; playing=false; $('#play').textContent='เล่นอีกครั้ง'; $('#play').classList.remove('on'); }
      $('#scrub').value=Math.round(jt/data.run.hours*1000);
    }
    render();
  }
  requestAnimationFrame(frame);
}
function render(){
  const {run,grid,wx}=data;
  const cur=at(jt);
  const done=jt>=run.hours-1e-6;
  /* กล้องตามจดหมาย เว้นแต่ผู้ใช้เพิ่งปัดเอง */
  if(performance.now()-userTouched>2600 && !dragging){
    let dy=cur.p.lng*RAD-G.rotY;
    while(dy>Math.PI) dy-=Math.PI*2; while(dy<-Math.PI) dy+=Math.PI*2;
    G.rotY+=dy*.035;
    G.rotX+=(clamp(cur.p.lat*RAD*.75,-1.2,1.2)-G.rotX)*.035;
  }
  /* เลื่อนนาฬิกาแสงตามเวลาในการเดินทาง — cache ทรงกลมหมดอายุเองผ่าน sunKey() */
  SUN_MS=DEPART_MS+jt*3600000;

  /* จดหมายอยู่ในพายุไหม — ใช้คุมทั้งการสั่นและการหดของวงเปิด */
  const wNow=windAt(data.grid,data.wx,cur.p.lat,cur.p.lng,jt);
  const inStorm=wNow.spd>=CFG.HOLD_KMH;
  stormMix += ((inStorm?1:0)-stormMix)*0.06;
  const jx=stormMix*(Math.sin(T*23)*1.7+Math.sin(T*11.3)*1.1);
  const jy=stormMix*(Math.cos(T*19)*1.7+Math.cos(T*13.7)*.9);

  /* จังหวะข้ามเส้นแบ่งกลางวัน-กลางคืน — โมเมนต์ของเรื่อง ไม่ใช่แค่เฉดสีที่ค่อย ๆ เปลี่ยน */
  let beat=0, beatKind=null;
  for(const cr of data.crossings){
    const dd=Math.abs(jt-cr.t);
    if(dd<1.1){ const b=Math.pow(1-dd/1.1,1.4); if(b>beat){ beat=b; beatKind=cr.kind; } }
  }

  sctx.clearRect(0,0,W,H);
  G.sphere(sctx);                                  /* โลก + กลางวัน-กลางคืน + ไฟเมือง */
  G.liftNight(sctx);                               /* ลดความตัดของซีกมืด */
  const lp=G.pipeV(toXYZ(cur.p.lat,cur.p.lng));
  lp.x+=jx; lp.y+=jy;                              /* พายุเขย่าจดหมาย */
  const radMul=(1-stormMix*0.38)*(1+beat*0.26);
  /* พายุบังตา (วงหด) · ข้ามเส้นแบ่ง (วงกว้างขึ้น) — หน้าโชว์คุมรัศมีเอง แต่ใช้โค้ดหมอกของแกน */
  const hole = (lp && lp.z>=-0.05)
    ? {x:lp.x, y:lp.y, r:G.R*Math.sin(CFGD.REVEAL_KM/6371)*radMul} : null;
  G.fog(sctx,hole);
  G.restoreNight(sctx,hole);                       /* หมอกซ่อนรายละเอียด ไม่ซ่อนสภาพแสง */
  drawStreams(sctx);                               /* ข้อ 31 — ลมทะลุหมอกเสมอ */
  drawStorms(sctx,jt);                             /* พายุก็คือลม จึงทะลุหมอกด้วย */
  drawTrail(sctx,jt);
  G.node(sctx,G.pipe(FROM.lat,FROM.lng),false);
  G.node(sctx,G.pipe(TO.lat,TO.lng),true);
  /* อากาศจริงตรงที่จดหมายอยู่ — หมุนให้ตกเข้าหาผิวโลก (ข้อ 5) */
  const w=wNow;
  const k=kindOf(w);
  const hb=bearing(cur.p,TO)*RAD;
  const align=Math.cos(hb)*Math.cos(w.blowBrg*RAD)+Math.sin(hb)*Math.sin(w.blowBrg*RAD);
  /* ถ้าอยู่ในพายุ ไม่ต้องวาด glyph เล็กซ้ำ — drawStorms วาดลูกใหญ่คลุมอยู่แล้ว */
  if(lp.z>=0 && k!==4){
    /* หมุน glyph ให้ฝนตกเข้าหาผิวโลก ไม่ใช่ล่างจอ (ข้อ 5) */
    const ux=(G.CX-lp.x), uy=(G.CY-lp.y), ul=Math.hypot(ux,uy)||1;
    const ang=Math.atan2(-ux/ul, uy/ul);
    sctx.save();
    sctx.translate(lp.x,lp.y); sctx.rotate(ang); sctx.translate(-lp.x,-lp.y);
    drawWx(sctx,lp.x,lp.y,T,k,clamp(w.spd/80,.15,1),clamp(align,-1,1),.62);
    sctx.restore();
  }
  /* คำบรรยายต้องอัปเดตเสมอ แม้จดหมายจะอยู่หลังโลก
     ตอนข้ามเส้นแบ่งให้แสงเป็นตัวเล่าแทนลมชั่วคราว */
  $('#saying').innerHTML =
    (beat>0.35 && !done)
      ? (beatKind==='dusk' ? 'แสงสุดท้ายของวันตกอยู่บนกระดาษ<br><b>จดหมายกำลังเข้าสู่กลางคืน</b>'
                           : 'ฟ้าสางแล้วตรงที่จดหมายบินอยู่<br><b>มันผ่านคืนนั้นมาได้</b>')
      : saying(k,w,align,done);
  const sv=sunVec(), lv=toXYZ(cur.p.lat,cur.p.lng);
  const dayDot=lv.x*sv.x+lv.y*sv.y+lv.z*sv.z;
  const phase=dayDot>.20?'กลางวัน':dayDot>.02?'ใกล้ค่ำ/ใกล้รุ่ง':dayDot>-.20?'สนธยา':'กลางคืน';
  $('#meta').textContent=
    'ชั่วโมงที่ '+Math.round(jt)+' จาก '+Math.round(run.hours)
    +' · ใต้จดหมาย '+localAt(cur.p.lng)+' น. ('+phase+')'
    +' · ลม '+Math.round(w.spd)+' กม./ชม.'
    +' · เบี่ยง '+Math.round(crossTrack(FROM,TO,cur.p)).toLocaleString()+' กม.';
  /* แสงสุดท้าย / แสงแรก — เรืองที่ตัวจดหมายตอนข้ามเส้นแบ่ง */
  if(beat>0.02 && lp.z>=0){
    const rad=G.R*Math.sin(CFGD.REVEAL_KM/6371)*(.55+beat*.35);
    const warm=beatKind==='dusk';
    const g=sctx.createRadialGradient(lp.x,lp.y,0,lp.x,lp.y,rad);
    g.addColorStop(0, warm?'rgba(214,164,88,'+(.30*beat).toFixed(3)+')'
                        :'rgba(196,214,240,'+(.32*beat).toFixed(3)+')');
    g.addColorStop(.55,warm?'rgba(214,164,88,'+(.10*beat).toFixed(3)+')'
                        :'rgba(196,214,240,'+(.11*beat).toFixed(3)+')');
    g.addColorStop(1, warm?'rgba(214,164,88,0)':'rgba(196,214,240,0)');
    sctx.fillStyle=g; sctx.beginPath(); sctx.arc(lp.x,lp.y,rad,0,6.2832); sctx.fill();
  }
  /* จดหมาย: จุดทองเมื่อมองไกล (ข้อ 24-25 ระบบซูมเต็มจะมาทีหลัง) */
  const pulse=k===4 ? .55+Math.sin(T*2.2)*.25 : 1;
  G.dot(sctx,lp,pulse,true);
}

/* ---------- ควบคุม ---------- */
$('#scrub').addEventListener('input',e=>{
  if(!data) return;
  jt=+e.target.value/1000*data.run.hours;
  playing=false; $('#play').textContent='เล่น'; $('#play').classList.remove('on');
  render();
});
$('#soft').addEventListener('input',e=>{
  SOFT=+e.target.value/100;
  $('#softVal').textContent = SOFT<.15?'คม':SOFT<.5?'กลาง':SOFT<.85?'นุ่ม':'นุ่มมาก';
  G._key='';                                    /* บังคับวาด layer โลกใหม่ */
  if(data) render();
});
$('#softVal').textContent='นุ่มมาก';
$('#play').onclick=function(){
  if(!data) return;
  if(jt>=data.run.hours-1e-6) jt=0;
  playing=!playing;
  this.textContent=playing?'หยุด':'เล่น';
  this.classList.toggle('on',playing);
};

sizeStage();
requestAnimationFrame(frame);
boot().catch(e=>{ $('#boot').innerHTML='ถามลมไม่สำเร็จ<br><span style="opacity:.6">'+e.message+'</span>'; });

</script>
