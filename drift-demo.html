<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4e3e0">
<title>drift — กรุงเทพ → แวนคูเวอร์</title>
<style>
:root{
  --gold:#c69a54;
  --line:rgba(84,90,104,.15);
  --txt:rgba(51,51,58,.92);
  --dim:rgba(84,90,104,.55);
  --faint:rgba(84,90,104,.36);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:linear-gradient(165deg,#dfe2e6,#eee9de);
  color:var(--txt);
  font-family:Georgia,"Times New Roman","Noto Serif Thai",serif;
  -webkit-user-select:none;user-select:none;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
.hud>*{pointer-events:auto}

header{padding:calc(env(safe-area-inset-top) + 22px) 20px 0;text-align:center;pointer-events:none}
.brand{font-size:13px;letter-spacing:.62em;color:var(--faint);text-indent:.62em}
.route{font-size:12px;letter-spacing:.16em;color:var(--dim);margin-top:9px}
.spacer{flex:1;pointer-events:none}

/* คำบรรยายลม */
.saying{
  padding:0 26px;text-align:center;pointer-events:none;
  font-size:15.5px;line-height:2;color:var(--txt);
  min-height:64px;transition:opacity .8s;
}
.saying b{font-weight:normal;color:#8b6a33}
.meta{
  text-align:center;font-size:11.5px;letter-spacing:.1em;color:var(--faint);
  margin-top:2px;font-family:ui-monospace,Menlo,monospace;pointer-events:none;
}

/* ไทม์ไลน์ */
.bar{padding:16px 22px calc(env(safe-area-inset-bottom) + 20px)}
.track{position:relative;height:46px;display:flex;align-items:center}
.track input{
  -webkit-appearance:none;appearance:none;width:100%;height:46px;background:none;outline:none;margin:0;
}
.track input::-webkit-slider-runnable-track{height:1px;background:var(--line)}
.track input::-moz-range-track{height:1px;background:var(--line)}
.track input::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#c69a54;border:0;margin-top:-5px;
}
.track input::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#c69a54;border:0}
.marks{position:absolute;inset:0;pointer-events:none}
.marks i{position:absolute;top:50%;width:1px;height:9px;margin-top:-4px;background:rgba(84,90,104,.3)}
.marks i.storm{height:15px;margin-top:-7px;background:rgba(84,90,104,.55)}
.marks i.dusk{height:11px;margin-top:-5px;background:rgba(198,154,84,.75)}
.marks i.dawn{height:11px;margin-top:-5px;background:rgba(150,170,205,.8)}

.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:4px}
.ends{font-size:11px;letter-spacing:.08em;color:var(--faint)}
button{font:inherit;color:var(--txt);background:none;border:0;cursor:pointer}
.btn{
  border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:12.5px;
  letter-spacing:.1em;background:rgba(255,255,255,.45);backdrop-filter:blur(7px);
}
.btn:active{background:rgba(255,255,255,.85)}
.btn.on{border-color:rgba(198,154,84,.55);color:#8b6a33}

#boot{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#dfe2e6,#eee9de);z-index:50;
  font-size:13px;letter-spacing:.14em;color:var(--dim);text-align:center;line-height:2.2;
  transition:opacity .9s;
}
#boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <header>
    <div class="brand">drift</div>
    <div class="route" id="route">กรุงเทพ → แวนคูเวอร์</div>
  </header>
  <div class="spacer"></div>
  <div class="saying" id="saying"></div>
  <div class="meta" id="meta"></div>
  <div class="bar">
    <div class="track">
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <div class="marks" id="marks"></div>
    </div>
    <div class="row">
      <span class="ends" id="t0">ออกเดินทาง</span>
      <button class="btn on" id="play">หยุด</button>
      <span class="ends" id="t1"></span>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="ends" style="flex:0 0 auto">ความนุ่มของแสง</span>
      <input type="range" id="soft" min="0" max="100" value="90" style="flex:1;accent-color:#c69a54;height:34px">
      <span class="ends" id="softVal" style="flex:0 0 58px;text-align:right"></span>
    </div>
  </div>
</div>

<div id="boot">กำลังถามลมจริงจากทั้งเส้นทาง…<br><span style="opacity:.55">กรุงเทพ → แวนคูเวอร์</span></div>
<script>
/* ============================================================
   จดหมายสายลม — เฟส 1 (no-backend)
   single-file HTML + localStorage + URL-encode
   ค่าคงที่ทั้งหมดรวมไว้ใน CFG เพื่อจูนได้จุดเดียว (ดู §11 ของ CONCEPT)
   ============================================================ */
'use strict';

const CFG = {
  SPEED:      20000/48,  // km/h — ระยะไกลสุดบนโลก ~20,000 กม. = ~2 วัน
  FLOOR_H:    6,         // เวลาฐานที่ระยะหมุด (ก่อนลมคูณ)
  ANCHOR_KM:  600,       // ระยะหมุด = โซนกลางของประเทศ (กรุงเทพ→เชียงใหม่ 584 กม.)
  FLOOR_MIN:  0.5,       // พื้นแข็ง — ต่อให้ลมส่งท้ายแรงแค่ไหนก็ต้องไม่เร็วกว่าครึ่งชั่วโมง
  WIND_CAP:   0.28,      // เพดานผลของลมส่งท้าย/ปะทะ ±28%
  WIND_REF:   150,       // ตัวหาร: ลม 42 กม./ชม. ตรงทิศ = เร็วขึ้นเต็มเพดาน
  HOLD_KMH:   50,        // พายุปานกลาง — จอดรอ
  LOST_KMH:   88,        // พายุรุนแรง — เสี่ยงหาย
  HOLD_MAX:   6,         // ชม. จอดสูงสุด (ปานกลาง)
  HOLD_MAX_S: 12,        // ชม. จอดสูงสุด (รุนแรง)
  DETOUR_FRAC:0.35,      // "อ้อม" = +เวลาตามสัดส่วน (ไม่คำนวณเส้นเลี่ยงจริง)
  DETOUR_MIN: 4,         // ชม. — อ้อมต้องช้าลงรู้สึกได้เสมอ
  DETOUR_MAX: 14,        // ชม. — แต่ต้องไม่นานจนไม่มีใครเลือก
  LOSS_CROSS: 0.14,      // โอกาสหายเมื่อเลือกข้ามพายุรุนแรง
  LOSS_DETOUR:0.02,      // โอกาสหายเมื่อเลือกอ้อม
  SEGS:       12,        // จำนวนช่วงที่สุ่มพยากรณ์บนเส้นทาง
  MAX_BODY:   1100,      // ตัวอักษรสูงสุด (คุมความยาว URL)
  URL_WARN:   2000,      // ความยาว URL ที่เริ่มเสี่ยงกับบางเบราว์เซอร์
  MAX_ANIM:   6,         // เพดานจดหมายที่ animate พร้อมกันบน globe
  /* ---------- หมอก (ข้อ 1-8, 31, 41) ---------- */
  FOG:        0.72,      // ความทึบที่ถูกลบออกนอกวงเปิด
  FOG_SOFT:   0.55,      // ขอบวงเปิดนุ่มแค่ไหน (0 = คม)
  REVEAL_FRAC:0.22,      // รัศมีวงเปิด = สัดส่วนของความยาวเส้นทาง (หลัก 46.2)
  REVEAL_MIN: 120,       // กม. — วงเล็กสุด
  REVEAL_MAX: 2400,      // กม. — วงใหญ่สุด
  /* ---------- กล้อง (ข้อ 27 · ส่วนหนึ่งของ 24-29) ---------- */
  ZOOM_MAX:   60,        // เพดานแข็ง — เพดานจริงคิดจากระยะพอดีของฉบับที่เลือก (G.zoomMax)
  ZOOM_PAST:  3,         // ซูมเข้าได้ลึกสุดกี่เท่าของระยะพอดี
  ZOOM_FIT:   0.39       // เส้นทางกินสัดส่วนเท่านี้ของ *กล่องที่ใช้ได้จริง* (G.fitBox)
                         // 0.50 ของเดิมคิดจากกล้องที่อยู่กลางเส้นทาง แต่โค้ดวางกล้องไว้ที่ตัวจดหมาย
                         // พอ prog=0 หรือ 1 ปลายอีกข้างจึงไปอยู่ที่ขอบพอดี ไม่เหลือระยะขอบเลย
                         // 0.39 = ปลายไกลอยู่ที่ 78% ของครึ่งกล่อง เหลือขอบ 22% ให้จุด ป้าย และลมที่พาเบนออกข้าง
};

const RAD = Math.PI/180, DEG = 180/Math.PI, ER = 6371;
const K = { LETTERS:'lw.v1.letters', ME:'lw.v1.me' };
const KIND = ['clear','wind','drizzle','rain','storm'];

/* ---------- คณิตศาสตร์ทรงกลม (ยกจาก globe-study) ---------- */
function toXYZ(latDeg,lngDeg){
  const lat=latDeg*RAD, lng=lngDeg*RAD;
  return {x:Math.cos(lat)*Math.sin(lng), y:Math.sin(lat), z:Math.cos(lat)*Math.cos(lng)};
}
function fromXYZ(v){
  return {lat:Math.asin(Math.max(-1,Math.min(1,v.y)))*DEG, lng:Math.atan2(v.x,v.z)*DEG};
}
function slerpV(a,b,t){
  const pa=toXYZ(a.lat,a.lng), pb=toXYZ(b.lat,b.lng);
  let dot=pa.x*pb.x+pa.y*pb.y+pa.z*pb.z;
  dot=Math.max(-1,Math.min(1,dot));
  const om=Math.acos(dot);
  if(om<1e-4) return pa;
  const s0=Math.sin((1-t)*om)/Math.sin(om), s1=Math.sin(t*om)/Math.sin(om);
  return {x:pa.x*s0+pb.x*s1, y:pa.y*s0+pb.y*s1, z:pa.z*s0+pb.z*s1};
}
function slerpLL(a,b,t){ return fromXYZ(slerpV(a,b,t)); }
function gcDist(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLng=(b.lng-a.lng)*RAD;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLng/2)**2;
  return 2*ER*Math.asin(Math.min(1,Math.sqrt(s)));
}
function bearing(a,b){
  const p1=a.lat*RAD,p2=b.lat*RAD,dl=(b.lng-a.lng)*RAD;
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*DEG+360)%360;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* seeded random — ผลการ roll ต้องคงที่ ฝังใน URL ได้ */
function seeded(seed){
  let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; };
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- storage ----------
   localStorage ใช้ไม่ได้ในบางบริบท (data: URL, private mode) → fallback ในหน่วยความจำ
   เพื่อไม่ให้แอปพังทั้งใบ แต่เตือนผู้ใช้ว่าประวัติจะไม่ถูกเก็บ */
const memo = {};
let LS_OK = true;
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ LS_OK=false; return memo[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ LS_OK=false; memo[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete memo[k]; } }
};
const store = {
  letters(){ try{ return JSON.parse(LS.get(K.LETTERS)||'[]'); }catch(e){ return []; } },
  saveAll(a){ LS.set(K.LETTERS, JSON.stringify(a)); _driftCache.clear(); _streamCache.clear(); _wfCache.clear(); },
  put(rec){
    const a=this.letters(); const i=a.findIndex(x=>x.id===rec.id);
    if(i>=0) a[i]=rec; else a.push(rec);
    this.saveAll(a); return rec;
  },
  me(){ try{ return JSON.parse(LS.get(K.ME)||'null'); }catch(e){ return null; } },
  setMe(m){ LS.set(K.ME, JSON.stringify(m)); }
};

/* ---------- URL codec (deflate + base64url ถ้าเบราว์เซอร์รองรับ) ---------- */
function b64u(bytes){
  let s=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  const s=str.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(s+'==='.slice((s.length+3)%4));
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function packPayload(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='function'){
    try{
      const cs=new CompressionStream('deflate-raw');
      const buf=await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer();
      return 'z'+b64u(new Uint8Array(buf));
    }catch(e){}
  }
  return 'r'+b64u(bytes);
}
/* ---------- ตรวจข้อมูลที่มาจากภายนอก (ข้อ 57.1) ----------
   จดหมายที่มาจากลิงก์หรือไฟล์คือข้อมูลของคนอื่น ไม่ใช่ของเรา
   ต้องตรวจ *ก่อนเก็บ* ไม่ใช่ตรวจตอนวาด เพราะจุดที่วาดมีหลายที่และลืมได้ทีละจุด
   ทุกช่องถูกบังคับชนิดและช่วงค่า — ค่าที่ผิดถูกแทนด้วยค่าตั้งต้น ไม่ใช่ปฏิเสธทั้งฉบับ
   ยกเว้น id กับ lg ที่ขาดไม่ได้ ถ้าไม่มีก็ไม่ใช่จดหมาย */
const _num=(v,lo,hi,d)=>{ const x=(typeof v==='number'&&isFinite(v))?v:NaN; return isNaN(x)?d:clamp(x,lo,hi); };
const _str=(v,max)=>String(v==null?'':v).slice(0,max);
function sanitizeRec(r){
  if(!r||typeof r!=='object'||Array.isArray(r)) return null;
  if(typeof r.id!=='string'||!r.id||r.id.length>40) return null;
  if(!Array.isArray(r.lg)||!r.lg.length||r.lg.length>64) return null;
  const pt=q=>({ n:_str(q&&q.n,60), p:_str(q&&q.p,80),
                 la:_num(q&&q.la,-90,90,0), lo:_num(q&&q.lo,-180,180,0) });
  const lg=r.lg.map(l=>{
    const a=Array.isArray(l)?l:[];
    return [ _num(a[0],0,240,0.1), _num(a[1],0,48,0), Math.round(_num(a[2],0,400,12)),
             Math.round(_num(a[3],0,360,180)), _num(a[4],0,500,0),
             Math.round(_num(a[5],0,KIND.length-1,0)), Math.round(_num(a[6],0,2,0)) ];
  });
  /* wf ต้องเป็นตัวอักษรในชุด base64 เท่านั้น — ตัวแปลกทำให้ถอดออกมาเป็น NaN แล้วลมหายทั้งสนาม */
  const wfOk = typeof r.wf==='string' && r.wf.length<=8000 && /^[A-Za-z0-9+/]*$/.test(r.wf);
  const out={ id:r.id, f:pt(r.f), t:pt(r.t),
    s:_num(r.s, 0, Date.now()+864e5, Date.now()),
    th:_num(r.th, 0, 24*60, 1), rt: r.rt==='d'?'d':'x', lg,
    lo:Math.round(_num(r.lo,-1,lg.length,-1)),
    bd:_str(r.bd, CFG.MAX_BODY) };
  if(wfOk) out.wf=r.wf;
  return out;
}
async function unpackPayload(str){
  const mode=str[0], data=unb64u(str.slice(1));
  let bytes=data;
  if(mode==='z'){
    const ds=new DecompressionStream('deflate-raw');
    const buf=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
    bytes=new Uint8Array(buf);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- Open-Meteo ---------- */
async function geocode(q){
  const u='https://geocoding-api.open-meteo.com/v1/search?count=6&language=th&format=json&name='+encodeURIComponent(q);
  const r=await fetch(u); if(!r.ok) throw new Error('geo');
  const j=await r.json();
  return (j.results||[]).map(x=>({
    name:x.name, lat:x.latitude, lng:x.longitude,
    place:[x.name,x.admin1,x.country].filter(Boolean).join(', ')
  }));
}
async function reverseName(lat,lng){
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=th&format=json&name=${lat.toFixed(2)},${lng.toFixed(2)}`);
    const j=await r.json();
    if(j.results&&j.results[0]) return j.results[0].name;
  }catch(e){}
  return lat.toFixed(2)+'°, '+lng.toFixed(2)+'°';
}
/* ---------- แคชลมของภูมิภาค (ข้อ 58) ----------
   เดิมทุกครั้งที่ส่งจดหมาย แอปยิง Open-Meteo 238 พิกัด → ส่ง 3 ฉบับในนาทีเดียวก็ชนเพดาน 600/นาที
   และมือถือไทยใช้ CGNAT คนจำนวนมากจึงแบ่งโควตาก้อนเดียวกันโดยไม่รู้ตัว
   ตอนนี้มีตัวดึงล่วงหน้า (tools/fetch_wind.py) เก็บลมทั้งภูมิภาคเป็นไฟล์เดียวทุก 6 ชม.
   แอปอ่านจากไฟล์นั้นแทน → ราคาคงที่ต่อวัน ไม่โตตามจำนวนผู้ใช้

   สิ่งที่ *ไม่* เปลี่ยน: ผู้ส่งยังเข้ารหัสสิ่งที่ตัวเองใช้ลง wf ในลิงก์เหมือนเดิม
   ผู้รับยังเล่นจากลิงก์และไม่เคยแตะ API — ความตรงกันสองฝั่งไม่ถูกแตะเลย

   แผ่นแคชเป็น "รายการ" ตั้งแต่วันแรก เผื่อวันหน้าเพิ่มแผ่นหยาบที่ครอบกว้างกว่า
   แอปเลือกแผ่นที่ละเอียดที่สุดที่ครอบจุดทั้งหมดได้ ไม่มีแผ่นไหนครอบก็ยิงตรงเหมือนเดิม */
const WCACHE={ DIR:'wind/', COVER_H:36 };   /* แคชต้องมีลมล่วงหน้าอย่างน้อยเท่านี้ ไม่งั้นยิงตรง */
let _wcMan=null;
function wcManifest(){
  if(!_wcMan) _wcMan=(async()=>{
    try{
      const r=await fetch(WCACHE.DIR+'index.json',{cache:'no-cache'});
      if(!r.ok) return null;
      const m=await r.json();
      return (m&&m.v===1&&Array.isArray(m.tiles)&&m.tiles.length)?m:null;
    }catch(e){ return null; }     /* ไม่มีแคชก็ไม่ใช่ความผิดพลาด แค่ถอยไปทางเดิม */
  })();
  return _wcMan;
}
/* แผ่นที่ละเอียดที่สุดที่ครอบทุกจุด และมีลมล่วงหน้าพอสำหรับการเดินทาง */
function wcPick(man,pts){
  let la0=90,la1=-90,lo0=180,lo1=-180;
  for(const p of pts){
    if(p.lat<la0)la0=p.lat; if(p.lat>la1)la1=p.lat;
    if(p.lng<lo0)lo0=p.lng; if(p.lng>lo1)lo1=p.lng;
  }
  const now=Date.now();
  let best=null;
  for(const t of man.tiles){
    if(la0<t.la0||la1>t.la1||lo0<t.lo0||lo1>t.lo1) continue;
    const t0=Date.parse(t.t0+':00Z'), end=t0+(t.slices-1)*t.stepH*3600000;
    if(!(t0<=now+3600000 && end>=now+WCACHE.COVER_H*3600000)) continue;
    if(!best||t.step<best.step) best=t;
  }
  return best;
}
async function wcLoad(man,t){
  if(t._d) return t._d;
  const r=await fetch(WCACHE.DIR+t.file+'?v='+encodeURIComponent(man.issued));
  if(!r.ok) throw new Error('tile '+r.status);
  const raw=new Uint8Array(await r.arrayBuffer());
  /* zlib.compress ของ python มีหัว zlib จึงเป็น 'deflate' ไม่ใช่ 'deflate-raw' */
  const ds=new DecompressionStream('deflate');
  const out=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
  if(out.length!==3*t.slices*t.nx*t.ny) throw new Error('tile size');
  t._d=out; return out;
}
/* อ่านลมของพิกัดหนึ่งออกมาในรูปเดียวกับที่ Open-Meteo คืนมา
   sampleWx() จึงใช้ต่อได้โดยไม่รู้ว่าข้อมูลมาจากไหน */
function wcSeries(t,d,lat,lng){
  const n=t.nx*t.ny;
  const gx=clamp((lng-t.lo0)/t.step,0,t.nx-1), gy=clamp((lat-t.la0)/t.step,0,t.ny-1);
  const x0=Math.floor(gx), x1=Math.min(t.nx-1,x0+1), fx=gx-x0;
  const y0=Math.floor(gy), y1=Math.min(t.ny-1,y0+1), fy=gy-y0;
  const w=[[x0,y0,(1-fx)*(1-fy)],[x1,y0,fx*(1-fy)],[x0,y1,(1-fx)*fy],[x1,y1,fx*fy]];
  const at=(v,sl,ix,iy)=>d[(v*t.slices+sl)*n + iy*t.nx + ix];
  const t0=Date.parse(t.t0+':00Z');
  const time=[],spd=[],dir=[],pre=[];
  for(let sl=0;sl<t.slices;sl++){
    time.push(new Date(t0+sl*t.stepH*3600000).toISOString().slice(0,16));
    let sp=0, pr=0, ex=0, nn=0;
    for(const [ix,iy,k] of w){
      sp += at(0,sl,ix,iy)*2*k;                    /* 1 หน่วย = 2 กม./ชม. */
      pr += at(2,sl,ix,iy)*0.1*k;                  /* 1 หน่วย = 0.1 มม. */
      /* ทิศเป็นมุม เฉลี่ยตรง ๆ ไม่ได้ — 350° กับ 10° จะได้ 180° ซึ่งตรงข้ามกับความจริง
         ต้องแตกเป็นเวกเตอร์ก่อนแล้วค่อยรวม */
      const a=at(1,sl,ix,iy)*5.625*RAD;
      ex+=Math.sin(a)*k; nn+=Math.cos(a)*k;
    }
    spd.push(sp); pre.push(pr);
    dir.push((Math.atan2(ex,nn)*DEG+360)%360);
  }
  return {hourly:{time, wind_speed_10m:spd, wind_direction_10m:dir, precipitation:pre}};
}
/* ดึงพยากรณ์ทุกจุดบนเส้นทางในคำขอเดียว (Open-Meteo รับหลายพิกัดได้)
   ลองแคชภูมิภาคก่อนเสมอ ไม่ได้ค่อยยิงตรง */
async function fetchWx(pts){
  try{
    const man=await wcManifest();
    if(man){
      const t=wcPick(man,pts);
      if(t){
        const d=await wcLoad(man,t);
        WX_SRC='cache:'+t.id;
        return pts.map(p=>wcSeries(t,d,p.lat,p.lng));
      }
    }
  }catch(e){ /* แคชมีปัญหาไม่ใช่เหตุให้ส่งจดหมายไม่ได้ — ถอยไปยิงตรง */ }
  WX_SRC='api';
  return fetchWxLive(pts);
}
let WX_SRC='';
async function fetchWxLive(pts){
  const la=pts.map(p=>p.lat.toFixed(3)).join(',');
  const lo=pts.map(p=>p.lng.toFixed(3)).join(',');
  const u='https://api.open-meteo.com/v1/forecast'
    +'?latitude='+la+'&longitude='+lo
    +'&hourly=wind_speed_10m,wind_direction_10m,precipitation'
    +'&wind_speed_unit=kmh&forecast_days=4&timezone=UTC';
  /* คำขอที่ค้างจะค้างตลอดไป ผู้ใช้เห็นแค่ปุ่มกดไม่ได้ — ต้องมีเพดานเวลาเสมอ */
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),15000);
  let r;
  try{ r=await fetch(u,{signal:ac.signal}); }
  catch(e){ throw new Error(ac.signal.aborted?'wx timeout':'wx offline'); }
  finally{ clearTimeout(timer); }
  if(!r.ok) throw new Error('wx '+r.status);
  const j=await r.json();
  return Array.isArray(j)?j:[j];
}
function sampleWx(loc,hoursFromNow){
  const h=loc&&loc.hourly;
  if(!h||!h.time) return {spd:12,dir:180,pre:0};
  /* หา offset ของ "ตอนนี้" จากเวลาแรกในชุด
     ชุดจาก API ห่างกัน 1 ชม. · ชุดจากแคชภูมิภาคห่างกัน 3 ชม. → ต้องอ่านระยะห่างจากข้อมูลเอง
     ไม่ใช่สมมติว่าเป็นราย 1 ชม. (ข้อ 58) */
  const t0=Date.parse(h.time[0]+':00Z');
  const stepH = h.time.length>1 ? Math.max(1,(Date.parse(h.time[1]+':00Z')-t0)/3600000) : 1;
  const idx=clamp(Math.round(((Date.now()-t0)/3600000 + hoursFromNow)/stepH), 0, h.time.length-1);
  return {
    spd: h.wind_speed_10m[idx] ?? 12,
    dir: h.wind_direction_10m[idx] ?? 180,
    pre: h.precipitation[idx] ?? 0
  };
}

/* เวลาจอดรอพายุ — แยกออกมาเพราะต้องใช้ตอนประเมินเวลาสุ่มลมด้วย */
function holdOf(spd,mode){
  const raw = spd>=CFG.LOST_KMH ? 2 : (spd>=CFG.HOLD_KMH ? 1 : 0);
  if(mode==='d' && raw===2) return clamp((spd-CFG.HOLD_KMH)/18, 0, 2);   /* อ้อม = เลียบขอบพายุ */
  if(raw===1) return clamp((spd-CFG.HOLD_KMH)/9+0.5, 0.5, CFG.HOLD_MAX);
  if(raw===2) return clamp((spd-CFG.LOST_KMH)/9+2,   2,   CFG.HOLD_MAX_S);
  return 0;
}
/* ---------- จำลองการเดินทาง ----------
   mode 'x' = ข้าม, 'd' = อ้อม
   legs[i] = [ชม.เดินทาง, ชม.จอด, ลม km/h, ทิศลม°, ฝน mm, kind, ระดับพายุ]

   เวลาเดินทางมาจาก "เส้นทางที่ลมพัดพาจริง" ไม่ใช่ระยะเส้นตรงหารความเร็วอีกต่อไป
   ลมพาอ้อมไกลขึ้น = ใช้เวลานานขึ้น (ตัดสินไว้ 23 ส.ค.) */
/* ดัชนีจุดแนวกลางในทางเดินลม — แนวกลางคือคอลัมน์ตรงกลางของแต่ละแถว */
const wfMid = i => WF.NG*WF.NG + i;   /* จุดแนวเส้นทางอยู่ต่อท้ายตารางสนาม */
/* cwx = พยากรณ์ของ "ทางเดินลมทั้งชุด" (13×5 = 65 จุด) ดึงมาในคำขอเดียว
   แนวกลาง 13 จุดคือชุดเดิมที่เคยดึงแยก จึงไม่มีคำขอเพิ่ม */
function simulate(cpts, cwx, dist, mode, seedId){
  const A=cpts[wfMid(0)], B=cpts[wfMid(CFG.SEGS)];
  /* ไก่กับไข่: เวลาที่ใช้สุ่มลมขึ้นกับเส้นทาง แต่เส้นทางขึ้นกับลม
     → วนสองรอบ รอบแรกเดาจากเส้นตรง รอบสองใช้เวลาจากเส้นทางจริง
     รอบสุดท้ายต้องสร้างเส้นทางจากลม "ชุดที่จะเก็บลง URL" เท่านั้น ไม่งั้นผู้รับได้คนละเส้น */
  let legT=null, W=null, run=null, wfRaw=null, field=null;
  for(let pass=0; pass<3; pass++){
    const at=[]; let acc=0;
    for(let i=0;i<CFG.SEGS;i++){
      at.push(acc);
      acc += legT ? legT[i] : (dist/CFG.SEGS)/CFG.SPEED;
      if(W) acc += holdOf(W[i].spd, mode);
    }
    W=[];
    for(let i=0;i<CFG.SEGS;i++){
      const w=sampleWx(cwx[wfMid(i)], at[i]);
      /* ปัดก่อนใช้ ไม่ใช่ปัดตอนเก็บ — ผู้รับมีแต่ค่าที่ปัดแล้ว ต้องคำนวณจากค่าเดียวกัน */
      W.push({spd:Math.round(w.spd), dir:Math.round(w.dir), pre:r2(w.pre)});
    }
    /* สนามลมเต็ม 4 ช่วงเวลา วางตามสัดส่วนของการเดินทาง (0, 1/3, 2/3, 1)
       ต้องเข้ารหัสแล้วถอดกลับก่อนใช้เสมอ ผู้ส่งจึงคำนวณจากค่าชุดเดียวกับผู้รับ */
    const total = at[CFG.SEGS-1] + (legT?legT[CFG.SEGS-1]:(dist/CFG.SEGS)/CFG.SPEED);
    const samples=[];
    for(let t=0;t<WF.NT;t++){
      const hh = total*(t/(WF.NT-1));
      for(let k=0;k<WF.NG*WF.NG;k++){
        const w=sampleWx(cwx[k], hh);
        samples.push({spd:w.spd, dir:w.dir});
      }
    }
    wfRaw = wfEncode(samples);
    field = { pts:wfPoints(A,B), slices:(()=>{
      const flat=wfDecode(wfRaw), per=WF.NG*WF.NG, out=[];
      for(let t=0;t<WF.NT;t++) out.push(flat.slice(t*per,(t+1)*per));
      return out;
    })() };
    run=driftRun(A,B,driftNodes(A,B,W),CFG.SEGS,field);
    legT=run.legT;
  }
  let t=0, legs=[], worstSeverity=0, rawWorst=0, boostSum=0;
  const severeIdx=[];
  for(let i=0;i<CFG.SEGS;i++){
    const w=W[i];
    const brg=bearing(cpts[wfMid(i)],cpts[wfMid(i+1)]);
    const blowTo=(w.dir+180)%360;                 // dir = ลมมาจากทิศไหน
    const align=Math.cos((blowTo-brg)*RAD);       // +1 ส่งท้าย, -1 ปะทะหน้า
    /* boost ไม่ได้คุมเวลาแล้ว เหลือไว้บอกว่า "ลมไปทางเดียวกับจดหมายไหม" ในคำบรรยาย */
    boostSum+=clamp(align*w.spd/CFG.WIND_REF, -CFG.WIND_CAP, CFG.WIND_CAP);

    const raw = w.spd>=CFG.LOST_KMH ? 2 : (w.spd>=CFG.HOLD_KMH ? 1 : 0);
    const dodged = (mode==='d' && raw===2);
    const sev = dodged ? 1 : raw;
    const hold = holdOf(w.spd, mode);
    if(sev>worstSeverity) worstSeverity=sev;
    if(raw>rawWorst) rawWorst=raw;
    if(raw===2) severeIdx.push(i);

    let kind;
    if(sev>0) kind=4;
    else if(w.pre>=2.5) kind=3;
    else if(w.pre>=0.15) kind=2;
    else if(w.spd>=22) kind=1;
    else kind=0;

    /* เก็บค่าเต็มไว้ก่อน ยังไม่ปัด — ต้องยืดด้วยตัวคูณเวลาฐานให้เสร็จก่อน
       ไม่งั้นเส้นทางสั้นมาก ๆ จะถูกปัดเป็น 0 ตั้งแต่ยังไม่ได้ยืด แล้วคูณเท่าไหร่ก็ยังเป็น 0
       (เจอจริงกับกรุงเทพ-นนทบุรี 12 กม. ได้เวลารวม 0 ชั่วโมง) */
    legs.push([legT[i], hold, w.spd, w.dir, w.pre, kind, sev]);
    t+=legT[i]+hold;
  }
  if(mode==='d') t+=clamp(t*CFG.DETOUR_FRAC, CFG.DETOUR_MIN, CFG.DETOUR_MAX);
  /* ---------- พื้นเวลา (ข้อ 45.1) ----------
     ของเดิม: ถ้ารวมแล้วไม่ถึง 6 ชม. ให้ตั้งเป็น 6 ตรง ๆ
     ปัญหา: การตั้งค่าตรง ๆ "ทับ" ผลของลมจนหายเกลี้ยง
     วัดแล้วว่าเส้นทางในประเทศไทย **ทุกเส้น** ได้ 6 ชม. เท่ากันหมด
     ทั้งที่ลมจริงทำให้ต่างกันตั้งแต่ −23% (กรุงเทพ→อุบล ลมส่งท้าย)
     ถึง +36% (กรุงเทพ→ภูเก็ต ลมมรสุมปะทะหน้า)
     → ที่สเกลประเทศ กฎนี้ลบพระเอกของแอปทิ้งทั้งหมด

     แก้เป็น: พื้นกำหนดแค่ "เวลาฐาน" แล้วให้อัตราส่วนที่ลมทำคูณลงไป
     ระยะไกลที่เกินพื้นอยู่แล้วไม่มีอะไรเปลี่ยน (k=1) */
  /* เวลาฐานยึด "โซนกลางของประเทศ" เป็นหมุด แล้วไล่ลงตามรากที่สองของระยะ
     (กอล์ฟ 23 ส.ค.: อ้างอิงโซนกลาง แล้วขยายขอบระยะเวลา)
     ของเดิมพื้นแบน 6 ชม. เท่ากันหมดตั้งแต่ 0 ถึง 2,500 กม.
     → กรุงเทพ-นนทบุรี 15 กม. ใช้เวลาเท่ากับกรุงเทพ-เชียงใหม่ ซึ่งไม่มีเหตุผลรองรับ
     ใช้รากที่สองเพราะเป็นเส้นเดียวที่ทำให้ระยะใกล้มากยังรู้สึกว่าเป็นการเดินทาง
     (15 กม. ได้ 1 ชม. ไม่ใช่ 2 นาที) โดยไม่ดันระยะกลางให้นานเกิน
     เพดานที่ FLOOR_H ทำให้ระยะไกลไม่ขยับเลย — เส้นตรงจะเข้ามาแทนเองที่ 2,500 กม. */
  const straightH = dist/CFG.SPEED;
  const anchored = CFG.FLOOR_H*Math.min(1, Math.sqrt(dist/CFG.ANCHOR_KM));
  const baseH = Math.max(anchored, straightH);
  /* ยืดแล้วบวกใหม่จากค่าที่ปัดแล้วเสมอ ไม่ใช่ปัด t แยกต่างหาก
     ปัดทีละช่วง 12 ช่วง คลาดได้ถึง 0.12 ชม. = 7 นาที ซึ่งเป็นบั๊กที่มีมาแต่เดิม
     แต่เพิ่งเห็นชัดตอนตัวคูณใหญ่ขึ้นที่ระยะใกล้ */
  /* คิดตัวคูณทั้งหมดด้วยค่าเต็มก่อน แล้วค่อยปัดครั้งเดียวตอนท้าย */
  let k = (straightH>0 && baseH>straightH) ? baseH/straightH : 1;
  /* พื้นแข็ง: ลมส่งท้ายแรงผิดปกติต้องไม่ทำให้จดหมายถึงเร็วจนไม่รู้สึกว่าเดินทาง */
  if(t*k>0 && t*k<CFG.FLOOR_MIN) k *= CFG.FLOOR_MIN/(t*k);
  legs.forEach(l=>{ l[0]=r2(l[0]*k); l[1]=r2(l[1]*k); });
  /* total ต้องเท่าผลรวมของ legs เป๊ะ — letterState() เดินตาม legs แต่ตัดสินว่าถึงจาก th */
  t = r2(legs.reduce((a,l)=>a+l[0]+l[1], 0));
  /* โอกาสหาย — roll ครั้งเดียวตอนส่ง (deterministic ฝังใน URL) */
  let lost=-1;
  const rng=seeded(seedId+mode);
  if(rawWorst===2){                               /* หายได้เฉพาะเส้นที่มีพายุรุนแรงจริง */
    const p = mode==='d' ? CFG.LOSS_DETOUR : CFG.LOSS_CROSS;
    if(p>0 && rng()<p && severeIdx.length){
      lost=severeIdx[Math.floor(rng()*severeIdx.length)];
    }
  }
  return { legs, total:r2(t), worst:worstSeverity, raw:rawWorst, boost:boostSum/CFG.SEGS, lost,
           travelled:run.travelled, direct:run.direct, ratio:run.ratio, wf:wfRaw };
}
const r2 = v => Math.round(v*100)/100;

function routePoints(from,to){
  const pts=[];
  for(let i=0;i<=CFG.SEGS;i++) pts.push(slerpLL(from,to,i/CFG.SEGS));
  return pts;
}

/* ---------- drift — ลมพัดพาจดหมายจริง (ข้อ 9-12, 30) ----------
   เฟส 1 ไม่มี backend ผู้รับเปิดลิงก์ทีหลังแล้วดึงพยากรณ์ซ้ำไม่ได้ (และพยากรณ์เก่าก็หมดอายุไปแล้ว)
   เส้นทางจึงต้อง "สร้างกลับมาได้" จากสิ่งที่อยู่ใน URL อยู่แล้ว คือลม 12 ค่าใน lg
   ไม่ต้องเพิ่มไบต์ใน URL ไม่ต้องดึงพยากรณ์เพิ่ม

   วัดแล้ว (กรุงเทพ→แวนคูเวอร์ ลมจริง): เส้นทางจากลม 12 ค่า ต่างจากเส้นทางที่ใช้
   ตารางลม 80 จุดเฉลี่ย 141 กม. สูงสุด 479 กม. — ราว 5-18px บนลูกโลก
   และไม่มีอันไหน "ถูกกว่า" เพราะเส้นทางจริงของจดหมายไม่มีอยู่จริง

   กติกาที่ห้ามพัง: ผู้ส่งกับผู้รับต้องได้เส้นทางเดียวกันเป๊ะ
   → ทุกอินพุตต้องเป็นค่าที่ปัดแล้วอย่างที่เก็บลง URL (ลมเป็นจำนวนเต็ม พิกัด 4 ตำแหน่ง) */
/* ---------- สนามลมเต็ม (ข้อ 53) ----------
   ลม 12 ค่าบนเส้นตรงพอสำหรับ "เส้นทางโค้งไปทางไหน" (ข้อ 43) แต่ไม่พอให้ลมเป็นพระเอก
   สนามจากจุดที่เรียงเป็นเส้นตรงไม่มีความหมุนวน ริ้วลมจึงเกือบขนานกันหมด
   และไม่เปลี่ยนตามเวลาเลย ทั้งที่ลมจริงเปลี่ยนทุกชั่วโมง

   เก็บทางเดินลม 13 ตามยาว × 5 ตามขวาง × 4 ช่วงเวลา = 260 ค่า
   จุดละ 2 ตัวอักษร (ความเร็ว 1 · ทิศ 1) = 520 ตัวอักษรใน URL
   กอล์ฟตัดสิน 23 ส.ค.: ความยาวลิงก์ไม่ใช่ข้อจำกัดจริง เพราะเฟส 2 จะใช้ล็อกอินแทนลิงก์อยู่แล้ว

   พิกัดของทางเดินคำนวณกลับได้จากต้นทาง-ปลายทาง จึงไม่ต้องเก็บ */
/* ---------- จาก "ทางเดินลม" เป็น "สนามลมที่มีอิทธิพลต่อการเดินทาง" ----------
   กอล์ฟ: ลมไม่ใช่รายละเอียดของแผนที่ ข้อ 31 บอกเองว่าหมอกปิดแผ่นดินแต่ไม่ปิดลม
   แสดงลมกว้างแค่ไหนจึงไม่ผิดเจตนาของหมอก

   ตารางเดิม 13 ตามยาว × 5 ตามขวาง ใช้งบผิดที่: ถี่ตามยาว 51 กม. แต่ห่างตามขวาง 130 กม.
   ทั้งที่กระแสลมไม่ได้ไหลตามเส้นทางของเรา
   ของใหม่กระจายจุดให้ทั่วบริเวณแทน — กว้างขึ้นและถี่ขึ้นพร้อมกันด้วยจำนวนจุดใกล้เคียงเดิม

   พิกัดวัดในระบบของเส้นทาง: ตามยาว 0 = ต้นทาง 1 = ปลายทาง · ตามขวางเป็นสัดส่วนของระยะ */
const WF={ VER:'4', NG:15, NT:3,
  /* ---- กฎข้อ 56: กระแสลมต้องมีที่มา ----
     สนามต้องกว้างพอจะครอบ *ต้นกำเนิดของกระแสที่มีอิทธิพลต่อการเดินทางนี้*
     ห้ามใช้กรอบที่คำนวณจากต้นทาง-ปลายทางเพียงอย่างเดียวเป็นขอบเขตของลม

     พื้นล่าง 750 กม. ไม่ใช่เลขสวย — มรสุมตะวันตกเฉียงใต้เดินทางจากอันดามัน
     เข้าฝั่งไทยราว 600-800 กม. พื้นที่เล็กกว่าสเกลของปรากฏการณ์เอง
     = ตัดสาเหตุออกจากภาพ ริ้วลมจะ "เริ่มจากกลางอากาศ" ผิดทั้งภาพและฟิสิกส์
     ในประเทศพื้นเป็นตัวคุม (609 กม. → สนาม 1,500 กม.)
     ระดับทวีปสัดส่วนคุม · ข้ามมหาสมุทรเพดานคุม (แลกกับจุดห่าง 857 กม.)

     ถ้าจะแก้ตัวเลขพวกนี้ ตัวชี้วัดรับงานคือจุดของริ้วอยู่ในจอราว 70-85%
     ที่ซูมตั้งต้น — 100% ในจอ แปลว่ากลับไปเป็น "ทางเดิน" ไม่ใช่สนามแล้ว */
  HALF_FRAC:1.10, HALF_MIN:750, HALF_MAX:6000 };
function wfHalfKm(dist){ return clamp(dist*WF.HALF_FRAC, WF.HALF_MIN, WF.HALF_MAX); }
/* ตารางจัตุรัสรอบจุดกึ่งกลางเส้นทาง วางแกนตามทิศของเส้นทาง เรียงตามยาวก่อนแล้วตามขวาง
   ต่อท้ายด้วยจุดบนเส้นทาง 13 จุด สำหรับสุ่มลมของแต่ละช่วง (lg) — ดึงในคำขอเดียวกัน
   เพราะสนามครอบกว้างกว่าเส้นทางมาก จุดของเส้นทางจึงไม่ตรงกับช่องตารางอีกต่อไป */
function wfPoints(A,B){
  const a={lat:r4(A.lat),lng:r4(A.lng)}, b={lat:r4(B.lat),lng:r4(B.lng)};
  const D=gcDist(a,b), half=wfHalfKm(D), out=[];
  const mid=slerpLL(a,b,0.5), brg=bearing(a,b);
  out.A=a; out.B=b; out.half=half; out.dAB=D; out.mid=mid; out.brg=brg;
  for(let i=0;i<WF.NG;i++){
    const al=(i/(WF.NG-1)-0.5)*2*half;
    const c = al===0 ? mid : destPoint(mid.lat,mid.lng, al>0?brg:(brg+180)%360, Math.abs(al));
    for(let j=0;j<WF.NG;j++){
      const cr=(j/(WF.NG-1)-0.5)*2*half;
      out.push(cr===0?{lat:c.lat,lng:c.lng}:destPoint(c.lat,c.lng,(brg+90)%360,cr));
    }
  }
  for(let i=0;i<=CFG.SEGS;i++) out.push(slerpLL(a,b,i/CFG.SEGS));
  return out;
}
/* เข้ารหัส: ความเร็ว 1 ตัวอักษร (ก้าวละ 2 กม./ชม.) · ทิศ 1 ตัวอักษร (ก้าวละ 5.625°)
   ต้องปัดก่อนใช้เสมอ ผู้รับจึงคำนวณได้ผลเดียวกันเป๊ะ (กติกาเดียวกับข้อ 43) */
function wfEncode(samples){
  let out=WF.VER;
  for(const w of samples){
    out += B64[clamp(Math.round(w.spd/2),0,63)] + B64[clamp(Math.round(((w.dir%360)+360)%360/5.625),0,63)%64];
  }
  return out;
}
function wfDecode(raw){
  /* รุ่นไม่ตรง = เรขาคณิตคนละแบบ ถอดออกมาก็ผิดที่ ปล่อยให้ถอยไปใช้สนาม 12 ค่าแทน */
  if(!raw || raw[0]!==WF.VER) return null;
  const M={}; for(let i=0;i<64;i++) M[B64[i]]=i;
  const out=[];
  for(let i=1;i+1<raw.length;i+=2){
    const spd=M[raw[i]]*2, dir=(M[raw[i+1]]*5.625)%360;
    const blow=(dir+180)*RAD;
    out.push({spd, e:Math.sin(blow)*spd, n:Math.cos(blow)*spd});
  }
  return out;
}
/* สนามลมของจดหมายหนึ่งฉบับ — คำนวณครั้งเดียวแล้วเก็บ */
const _wfCache=new Map();
function wfOf(L){
  if(_wfCache.has(L.id)) return _wfCache.get(L.id);
  let out=null;
  if(L.wf){
    const flat=wfDecode(L.wf);
    const per=WF.NG*WF.NG;
    if(flat && flat.length>=per){
      const slices=[];
      for(let t=0;t<WF.NT;t++){
        const off=t*per;
        slices.push(flat.slice(off,off+per).length===per?flat.slice(off,off+per):slices[slices.length-1]);
      }
      out={pts:wfPoints({lat:L.f.la,lng:L.f.lo},{lat:L.t.la,lng:L.t.lo}), slices};
    }
  }
  _wfCache.set(L.id,out);
  return out;
}
/* ลม ณ พิกัดใด ๆ เวลาใดก็ได้ — ถ่วงน้ำหนักผกผันระยะ 4 จุดใกล้สุด แล้วไล่ระดับตามเวลา */
/* ลม ณ พิกัดใด ๆ เวลาใดก็ได้
   ทางเดินลมเป็นตาราง 13×5 อยู่แล้ว จึงหาช่องตรง ๆ จากพิกัดได้ ไม่ต้องไล่ทั้ง 65 จุด
   (ของเดิมไล่ทุกจุดทุกครั้ง = 69,000 ครั้งต่อการสร้างริ้วหนึ่งรอบ ทำให้เฟรมกระตุก 30ms)
   แล้วผสมสี่มุมแบบ bilinear ซึ่งเรียบกว่าการถ่วงน้ำหนักผกผันระยะด้วย */
function wfAt(field, lat, lng, tf){
  const pts=field.pts, P={lat,lng};
  /* วัดระยะตามแกนเส้นทางจากจุดกึ่งกลาง — ใช้มุมกับระยะตรง ๆ ไม่ต้องไล่ดูทุกจุด */
  const d=gcDist(pts.mid,P);
  const th=(bearing(pts.mid,P)-pts.brg)*RAD;
  const al=d*Math.cos(th), cr=d*Math.sin(th);
  const gi=clamp((al/pts.half+1)/2*(WF.NG-1),0,WF.NG-1);
  const gj=clamp((cr/pts.half+1)/2*(WF.NG-1),0,WF.NG-1);
  const i0=Math.floor(gi), i1=Math.min(WF.NG-1,i0+1), fi=gi-i0;
  const j0=Math.floor(gj), j1=Math.min(WF.NG-1,j0+1), fj=gj-j0;
  const u=clamp(tf,0,1)*(WF.NT-1);
  const t0=Math.floor(u), t1=Math.min(WF.NT-1,t0+1), m=u-t0;
  const S0=field.slices[t0], S1=field.slices[t1];
  const at=(i,j,k)=>{ const x=S0[i*WF.NG+j], y=S1[i*WF.NG+j];
    return k===0 ? x.e+(y.e-x.e)*m : k===1 ? x.n+(y.n-x.n)*m : x.spd+(y.spd-x.spd)*m; };
  const bl=(k)=>{
    const q00=at(i0,j0,k), q10=at(i1,j0,k), q01=at(i0,j1,k), q11=at(i1,j1,k);
    return (q00*(1-fi)+q10*fi)*(1-fj) + (q01*(1-fi)+q11*fi)*fj;
  };
  return {e:bl(0), n:bl(1), spd:bl(2)};
}
const DRIFT={
  GAIN:  10,     /* ข้อ 30 — คูณแรงลม ให้เส้นโค้งพอจะเห็นด้วยตา */
  STEPS: 1600,   /* เพดานก้าว กันวนไม่จบเมื่อลมแรงจนเข้าไม่ถึงปลายทาง */
  AIM:   100     /* จำนวนก้าวที่อยากได้ต่อเส้นทางหนึ่งเส้น */
};
/* ก้าวเดินกับระยะ "ถือว่าถึง" เคยเป็นค่าคงที่ 0.25 ชม. กับ 60 กม.
   ซึ่งถูกเฉพาะเส้นข้ามทวีป — ที่ 584 กม. ได้แค่ 6 ก้าว เส้นทางจึงหักเป็นเหลี่ยม
   และที่ 12 กม. ระยะ 60 กม. แปลว่า "ถึงตั้งแต่ยังไม่ออกเดินทาง" (หลัก 46.2) */
function driftStep(dist){
  const h=dist/CFG.SPEED;
  return { dt: clamp(h/DRIFT.AIM, 0.0005, 0.3), near: clamp(dist*0.04, 0.5, 60) };
}
const r4 = v => Math.round(v*1e4)/1e4;

/* เดินจากจุดหนึ่งไปตามทิศ+ระยะ บนทรงกลม */
function destPoint(lat,lng,brgDeg,distKm){
  const d=distKm/ER, b=brgDeg*RAD, p1=lat*RAD, l1=lng*RAD;
  const sp=Math.sin(p1), cp=Math.cos(p1), sd=Math.sin(d), cd=Math.cos(d);
  const p2=Math.asin(sp*cd + cp*sd*Math.cos(b));
  const l2=l1+Math.atan2(Math.sin(b)*sd*cp, cd - sp*Math.sin(p2));
  return {lat:p2*DEG, lng:((l2*DEG+540)%360)-180};
}
/* สนามลม = โหนดบนเส้นตรง โหนดละหนึ่งช่วง — ปัดพิกัดให้ตรงกับที่เก็บใน URL
   w[i] ต้องเป็น {spd,dir} ที่ปัดเป็นจำนวนเต็มแล้ว */
function driftNodes(A,B,w){
  const a={lat:r4(A.lat),lng:r4(A.lng)}, b={lat:r4(B.lat),lng:r4(B.lng)};
  const n=w.length, out=[];
  for(let i=0;i<=n;i++){
    const p=slerpLL(a,b,i/n), s=w[Math.min(i,n-1)];
    const blow=(s.dir+180)*RAD;                 /* dir = ลมมาจากทิศไหน */
    out.push({lat:p.lat, lng:p.lng, e:Math.sin(blow)*s.spd, n:Math.cos(blow)*s.spd, spd:s.spd});
  }
  return out;
}
/* ลม ณ พิกัดใด ๆ — ถ่วงน้ำหนักผกผันระยะจาก 4 โหนดใกล้สุด (วิธีเดียวกับหน้าโชว์) */
function windAtNodes(nodes,lat,lng){
  const P={lat,lng};
  const bd=[Infinity,Infinity,Infinity,Infinity], bi=[-1,-1,-1,-1];
  for(let i=0;i<nodes.length;i++){
    const d=gcDist(P,nodes[i]);
    if(d>=bd[3]) continue;
    let s=3;
    while(s>0 && d<bd[s-1]){ bd[s]=bd[s-1]; bi[s]=bi[s-1]; s--; }
    bd[s]=d; bi[s]=i;
  }
  let e=0,n=0,sp=0,sum=0;
  for(let k=0;k<4;k++){
    if(bi[k]<0) continue;
    const nd=nodes[bi[k]], wt=1/Math.max(1,bd[k]*bd[k]);
    e+=nd.e*wt; n+=nd.n*wt; sp+=nd.spd*wt; sum+=wt;
  }
  return sum ? {e:e/sum, n:n/sum, spd:sp/sum} : {e:0,n:0,spd:0};
}
/* เดินจดหมายจาก A ไป B: ตั้งใจมุ่งหน้าปลายทางเสมอ + ลมผลัก
   คืนเส้นทางจริง กับเวลาที่ใช้ในแต่ละช่วง (ไม่รวมเวลาจอดรอพายุ ซึ่งคิดแยก) */
function driftRun(A,B,nodes,segs,field){
  const a={lat:r4(A.lat),lng:r4(A.lng)}, b={lat:r4(B.lat),lng:r4(B.lng)};
  const direct=gcDist(a,b);
  const {dt:DT, near:NEAR}=driftStep(direct);
  const pts=[{lat:a.lat,lng:a.lng}], legT=new Array(segs).fill(0);
  let p={lat:a.lat,lng:a.lng}, t=0, run=0, far=0, capped=false;
  for(let s=0;s<DRIFT.STEPS;s++){
    const left=gcDist(p,b);
    if(left<NEAR) break;
    /* เวลาที่ใช้อ่านสนามลมวัดเป็น "คืบไปแล้วกี่ส่วน" ไม่ใช่ชั่วโมง
       เพราะผู้รับยังไม่รู้เวลารวมตอนกำลังสร้างเส้นทาง ต้องใช้ค่าที่ทั้งสองฝั่งรู้เท่ากัน */
    const far0=Math.max(far,(direct-left)/direct);
    const w=field ? wfAt(field,p.lat,p.lng,far0) : windAtNodes(nodes,p.lat,p.lng);
    const hb=bearing(p,b)*RAD;
    const E=Math.sin(hb)*CFG.SPEED + w.e*DRIFT.GAIN;
    const N=Math.cos(hb)*CFG.SPEED + w.n*DRIFT.GAIN;
    const spd=Math.hypot(E,N), brg=(Math.atan2(E,N)*DEG+360)%360;
    const step=Math.min(spd*DT, left);
    const dt=step/Math.max(1,spd);
    /* ช่วงที่ i วัดจากระยะที่คืบไปตามเส้นตรง — ใช้ค่าสูงสุดที่เคยไปถึง
       ไม่งั้นตอนลมผลักถอยหลัง ช่วงจะเดินย้อน */
    far=Math.max(far,(direct-left)/direct);
    legT[clamp(Math.floor(far*segs),0,segs-1)] += dt;
    p=destPoint(p.lat,p.lng,brg,step);
    t+=dt; run+=step;
    pts.push({lat:p.lat,lng:p.lng});
    if(s===DRIFT.STEPS-1) capped=true;
  }
  /* ตาข่ายกันวนไม่จบ ไม่ใช่เพดานเชิงออกแบบ — ลมแรงจนเข้าปลายทางไม่ได้จริง ๆ
     ให้เดินเส้นตรงที่เหลือด้วยความเร็วปกติ จะได้มีเวลาถึงเสมอ */
  if(capped){
    const left=gcDist(p,b);
    pts.push({lat:b.lat,lng:b.lng});
    const dt=left/CFG.SPEED; legT[segs-1]+=dt; t+=dt; run+=left;
  }else{
    /* ก้าวสุดท้ายหยุดห่างปลายทางได้ถึง NEAR กม. — ต้องนับระยะช่วงนี้ด้วย
       ไม่งั้นระยะที่รายงานกับความยาวเส้นทางที่วาดจริงไม่ตรงกัน */
    const gap=gcDist(p,b);
    pts.push({lat:b.lat,lng:b.lng});
    const dt=gap/CFG.SPEED; legT[segs-1]+=dt; t+=dt; run+=gap;
  }
  /* ระยะสั้นมากจนได้ก้าวไม่ถึงจำนวนช่วง — แบ่งเวลาเท่ากันแทน ไม่งั้นบางช่วงเป็นศูนย์ */
  if(legT.some(v=>v<=0)) legT.fill(t/segs);
  return {pts, legT, hours:t, travelled:run, direct, ratio:run/Math.max(1,direct), capped};
}
/* เส้นทางของจดหมายหนึ่งฉบับ — คำนวณครั้งเดียวแล้วเก็บไว้
   store.letters() แกะ JSON ใหม่ทุกครั้ง จึง cache ที่ id ไม่ใช่ที่ตัว object */
const _driftCache=new Map();
function driftPath(L){
  if(_driftCache.has(L.id)) return _driftCache.get(L.id);
  let out=null;
  if(L.lg && L.lg.length){
    const nodes=driftNodes({lat:L.f.la,lng:L.f.lo},{lat:L.t.la,lng:L.t.lo},L.lg.map(l=>({spd:l[2],dir:l[3]})));
    /* มีสนามลมเต็มก็ใช้สนามนั้น — ริ้วลมที่เห็นกับเส้นทางที่จดหมายเดินต้องมาจากสนามเดียวกัน
       ไม่งั้นจดหมายจะลอยสวนกระแสที่ตาเห็น */
    const r=driftRun({lat:L.f.la,lng:L.f.lo},{lat:L.t.la,lng:L.t.lo},nodes,L.lg.length,wfOf(L));
    /* ระยะสะสมไว้หาตำแหน่งตามสัดส่วน — prog มาจาก letterState() ซึ่งใช้เวลาใน lg
       ตำแหน่งจึงผูกกับเวลาที่เก็บไว้ ไม่ใช่กับผลการคำนวณซ้ำ */
    const cum=[0];
    for(let i=1;i<r.pts.length;i++) cum.push(cum[i-1]+gcDist(r.pts[i-1],r.pts[i]));
    out={pts:r.pts, cum, len:cum[cum.length-1], ratio:r.ratio};
  }
  _driftCache.set(L.id,out);
  return out;
}
/* ตำแหน่งบนเส้นทาง ณ สัดส่วน 0-1 — ถอยไปเส้นตรงถ้าจดหมายเก่าไม่มีข้อมูลลม */
function posAt(L,prog){
  const D=driftPath(L);
  if(!D||!D.len) return slerpLL({lat:L.f.la,lng:L.f.lo},{lat:L.t.la,lng:L.t.lo},prog);
  const want=clamp(prog,0,1)*D.len;
  let lo=0, hi=D.cum.length-1;
  while(lo<hi-1){ const m=(lo+hi)>>1; if(D.cum[m]<=want) lo=m; else hi=m; }
  const seg=D.cum[hi]-D.cum[lo];
  const f=seg>0?(want-D.cum[lo])/seg:0;
  return slerpLL(D.pts[lo],D.pts[hi],f);
}
function posVAt(L,prog){ const p=posAt(L,prog); return toXYZ(p.lat,p.lng); }
/* ระยะที่ต้องใช้จัดกรอบภาพ (ข้อ 57.4)
   กล้องไปเกาะที่ *ตัวจดหมาย* ไม่ใช่กลางเส้นทาง กรณีแย่สุดคือตอนอยู่ที่ปลายทั้งสอง
   จึงต้องครอบจุดที่ไกลจากปลายที่สุด ไม่ใช่แค่ระยะเส้นตรง — กันกรณีลมพาเลยปลายทางแล้ววกกลับ

   หมายเหตุที่วัดแล้ว: ลมพาเบนออก*ข้าง*ได้ถึง 25% ของระยะตรง แต่การเบนข้างไม่ทำให้ค่านี้โต
   (จุดที่เบนออกข้างยังใกล้ปลายทั้งสองกว่าที่ปลายสองข้างห่างกันเอง)
   ตัวที่ทำให้ภาพเสียจริงคือกล่องที่เล็กกว่าที่คิด กับกล้องที่อยู่ปลายเส้น ไม่ใช่การเบน */
function fitKm(L){
  const A={lat:L.f.la,lng:L.f.lo}, B={lat:L.t.la,lng:L.t.lo};
  const straight=gcDist(A,B);
  const D=driftPath(L);
  if(!D||!D.pts||D.pts.length<2) return straight;
  if(D.span==null){
    let m=straight;
    for(const q of D.pts){ const a=gcDist(A,q), b=gcDist(B,q); if(a>m)m=a; if(b>m)m=b; }
    D.span=m;
  }
  return D.span;
}
/* รัศมีวงเปิด วัดเป็นระยะจริงบนผิวโลก (ข้อ 28) และแปรตามความยาวเส้นทาง (หลัก 46.2)
   ค่าคงที่ 2,400 กม. ใหญ่กว่าเส้นกรุงเทพ-เชียงใหม่ทั้งเส้น 4 เท่า — เปิดหมดจนหมอกไม่เหลือความหมาย */
function revealKm(L){
  const d=gcDist({lat:L.f.la,lng:L.f.lo},{lat:L.t.la,lng:L.t.lo});
  return clamp(d*CFG.REVEAL_FRAC, CFG.REVEAL_MIN, CFG.REVEAL_MAX);
}
/* ---------- ริ้วลม (ข้อ 31) ----------
   หมอกปิดแผ่นดิน แต่ห้ามปิดลม — ถ้าหมอกกลบลมด้วย พระเอกของเรื่องจะเห็นได้แค่ในรูส่องรูเดียว
   สนามลมคือชุดเดียวกับที่ใช้คำนวณเส้นทาง (13 โหนดจาก lg) ตอนนี้ใช้แล้วทิ้ง ทั้งที่วาดได้เลย
   ผลคือเห็นสายลมที่จดหมายกำลังขี่อยู่ และเห็นว่า *ทำไม* มันถึงโค้งไปทางนั้น
   ต้องวาด *หลัง* ขั้นตอนลบความทึบ ไม่ใช่ก่อน

   ทุกค่าที่เป็นระยะแปรตามความยาวเส้นทาง (หลัก 46.2) — ริ้วลมของจดหมายในจังหวัด
   กับของจดหมายข้ามทวีป ต้องกินพื้นที่บนจอพอ ๆ กัน */
/* สัดส่วนอ้างอิงจากหน้าโชว์แวนคูเวอร์ที่ตาผ่านแล้ว:
   ริ้วยาวราว 17% ของเส้นทาง แผ่ออกข้างละ ~15% — ไม่ใช่ 46% และ 55% แบบรอบแรก
   ซึ่งทำให้ริ้วยาวจนพันกันเป็นเส้นขยุกขยิกเต็มฟ้า */
/* ริ้วยาว 11 ก้าว = 16% ของเส้นทาง สั้นเกินกว่าจะเห็นว่ากระแสมาจากไหน
   วัดแล้วว่าความยาวคือตัวแปรหลักของความโค้ง: 11 ก้าว → โค้ง 32° · 22 ก้าว → 53°
   ลดจำนวนแนวขวางลงเพื่อไม่ให้ริ้วที่ยาวขึ้นทับกันเป็นแผ่น */
/* เมล็ดริ้วกระจายทั่วสนามลม ไม่ใช่เกาะเส้นทาง — กระแสไม่ได้ไหลตามเส้นทางของเรา
   ความหนาแน่นเป็นเรื่องของการวาด ไม่ใช่เรื่องของข้อมูล — สนามลมมีข้อมูลจริงครอบทั้งบริเวณอยู่แล้ว
   ลากเส้นกระแสเพิ่มในสนามเดิมก็เหมือนโรยผงเหล็กเพิ่มบนสนามแม่เหล็ก ไม่ได้สร้างข้อมูลใหม่
   ที่ 13×9 = 117 ริ้ว พอซูมออกมาแล้วเห็นเป็นหย่อมเส้นเล็ก ๆ ไม่อ่านเป็นสนาม */
/* ริ้วต้องยาวพอจะเห็นว่าลมมาจากไหน — 0.31 ของระยะทางสั้นเกินกว่าจะเล่าเรื่องมรสุม
   ผูกความยาวกับ *ขนาดสนาม* ไม่ใช่ระยะทาง เพราะสนามคือขอบเขตที่เรารู้ลมจริง
   ห้ามลากริ้วยาวเกินสนาม นั่นคือการเดา ไม่ใช่ข้อมูล (กฎข้อ 56.2)
   ลดจำนวนลงแลกกับความยาว ตามที่กอล์ฟบอกว่ารายละเอียดไม่ต้องซ้ำเยอะ */
const STREAM={ ROWS:13, COLS:11, STEPS:45, SPREAD:0.16, STEP_FRAC:1/70 };
const _streamCache=new Map();
/* ริ้วลมสร้างใหม่เมื่อ "ช่วงเวลา" เปลี่ยน — สนามลมเต็มมี 4 ช่วง ลมจึงเปลี่ยนหน้าตาระหว่างการเดินทาง
   นี่คือสิ่งที่ทำให้ลมเป็นกระแสที่มีชีวิต ไม่ใช่ภาพนิ่งที่มีคลื่นวิ่งผ่าน */
function driftStreams(L,tf){
  const field=wfOf(L);
  /* 12 ช่วงหมายถึงสร้างริ้วใหม่ 12 ครั้งต่อการเดินทาง ซึ่งกระตุกทุกครั้งที่ 244 ริ้ว
     6 ช่วงยังเห็นสนามเปลี่ยนชัด แต่สะดุดครึ่งเดียว */
  const bucket=field?Math.round(clamp(tf||0,0,1)*6):0;
  const key=L.id+':'+bucket;
  if(_streamCache.has(key)) return _streamCache.get(key);
  let out=null;
  if(L.lg && L.lg.length){
    const A={lat:L.f.la,lng:L.f.lo}, B={lat:L.t.la,lng:L.t.lo};
    const dist=gcDist(A,B);
    /* ต้องหารด้วยจำนวน bucket จริง (6) ไม่ใช่ 12 ที่ค้างจากรุ่นเก่า
       ถ้าหาร 12 tf จะไปได้แค่ 0.5 → ช่วงเวลาสุดท้ายของสนามไม่เคยถูกวาด
       ขณะที่เส้นทางของจดหมายใช้ครบ 0..1 → ครึ่งหลังของทุกเที่ยวจะเห็นลมค้างที่กลางทาง
       ซึ่งขัดกับกฎที่ driftPath เขียนไว้เองว่าริ้วกับเส้นทางต้องมาจากสนามเดียวกัน */
    const tfb=bucket/6;
    const nodes=driftNodes(A,B,L.lg.map(l=>({spd:l[2],dir:l[3]})));
    /* กฎข้อ 56.2: ความยาวริ้ว = สัดส่วนของ *ความกว้างบริเวณที่รู้ลมจริง*
       สนามเต็มรู้ทั้งจัตุรัส · สนาม 12 ค่ารู้แค่แถบแคบรอบแนวกลาง
       ของเดิมใช้ dist กับเส้นทางสำรอง → ริ้วยาวเป็น 2 เท่าของแถบที่มันเกิด แล้วทับกันเป็นรอยเปื้อน
       สองทางนี้จึงต้องได้อัตราส่วน ยาว/กว้าง เท่ากันที่ 0.64 */
    const knownKm = field ? wfHalfKm(dist)*2 : dist*STREAM.SPREAD*2;
    const stepKm=Math.max(2, knownKm*STREAM.STEP_FRAC);
    /* สนามเต็มรู้ลมทั้งทางเดินกว้าง ริ้วจึงกระจายได้เท่าทางเดินจริง
       สนาม 12 ค่ารู้แค่แนวกลาง กระจายกว้างก็ได้แต่ค่าที่เดาเอา */
    const lines=[];
    const brg0=bearing(A,B);
    const mid0=slerpLL(A,B,0.5), halfF=field?wfHalfKm(dist):dist*STREAM.SPREAD;
    for(let i=0;i<STREAM.ROWS;i++){
      /* เมล็ดกระจายทั่วสนามจัตุรัส ไม่เกาะเส้นทาง — ลมพัดผ่านทั้งบริเวณ ไม่ได้ไหลตามเส้นทางเรา */
      const al=(i/(STREAM.ROWS-1)-0.5)*2*halfF*0.96;
      const c = field ? (al===0?mid0:destPoint(mid0.lat,mid0.lng, al>0?brg0:(brg0+180)%360, Math.abs(al)))
                      : slerpLL(A,B,i/(STREAM.ROWS-1));
      for(let j=0;j<STREAM.COLS;j++){
        const h=i*31+j*7;
        const jitA=(Math.sin(h*12.9898)*.5+.5)*360;
        const jitR=(Math.sin(h*78.233)*.5+.5)*(halfF*2/(STREAM.COLS-1))*0.7;
        const off=(j/(STREAM.COLS-1)-0.5)*2*halfF*0.96;
        let p = off===0 ? {lat:c.lat,lng:c.lng} : destPoint(c.lat,c.lng,(brg0+90)%360,off);
        if(jitR>0.5) p=destPoint(p.lat,p.lng,jitA,jitR);
        const pts=[toXYZ(p.lat,p.lng)];
        let ok=true, spd=0, turn=0, prevBrg=null;
        for(let k=0;k<STREAM.STEPS;k++){
          const w=field ? wfAt(field,p.lat,p.lng,tfb) : windAtNodes(nodes,p.lat,p.lng);
          const sp=Math.hypot(w.e,w.n);
          if(sp<0.5){ ok=false; break; }          /* ลมนิ่งจริง ๆ ก็ไม่ต้องมีริ้ว */
          if(sp>spd) spd=sp;                      /* ความแรงจริงของริ้วเส้นนี้ — คุมความเข้ม ความหนา และจังหวะ */
          const br=(Math.atan2(w.e,w.n)*DEG+360)%360;
          /* กระแสที่วนเป็นวงจริง ๆ มีอยู่ (ในหย่อมความกดอากาศต่ำ) แต่ถ้าวาดจนครบหลายรอบ
             ริ้วจะกลายเป็นก้อนขยุกขยิก — หยุดวาดที่ 1.25 รอบ ไม่ใช่แก้ข้อมูล แค่หยุดก่อนกลายเป็นเสียงรบกวน */
          if(prevBrg!==null){ turn+=Math.abs(((br-prevBrg+540)%360)-180); if(turn>450) break; }
          prevBrg=br;
          p=destPoint(p.lat,p.lng,br, stepKm);
          pts.push(toXYZ(p.lat,p.lng));
        }
        /* จางลงเมื่อห่างจากเส้นทาง — เรารู้ลมจริงแค่บนแนวเส้นทาง (13 จุด)
           ยิ่งออกข้างยิ่งเป็นการเดาจากการถ่วงน้ำหนัก จึงไม่ควรวาดเข้มเท่ากัน
           และช่วยไม่ให้ริ้วรอบนอกกลายเป็นเส้นตรงขนานกันเป็นพืด */
        if(ok&&pts.length>2){
          const q=Math.abs(j/(STREAM.COLS-1)-0.5)*2;
          pts.w=Math.pow(1-q*q,0.9);
          pts.spd=spd;
          lines.push(pts);
        }
      }
    }
    out=lines;
  }
  _streamCache.set(key,out);
  if(_streamCache.size>60) _streamCache.clear();
  return out;
}
/* รอยข้างหลัง (ข้อ 2) — วาดเฉพาะทางที่เดินมาแล้ว ไม่ใช่ทั้งเส้น
   เส้นเต็มบอกอนาคต ทำให้หมอกไม่ได้ปิดอะไรที่มีความหมาย
   และรอยที่ยาวขึ้นเรื่อย ๆ = อ่าน progress ได้โดยไม่ต้องมีตัวเลข */
function trailUpto(L,prog){
  const D=driftPath(L);
  if(!D||!D.len) return null;
  const want=clamp(prog,0,1)*D.len;
  const out=[];
  for(let i=0;i<D.pts.length;i++){
    if(D.cum[i]<=want) out.push(D.pts[i]); else break;
  }
  const tip=posAt(L,prog);
  if(!out.length || gcDist(out[out.length-1],tip)>1) out.push(tip);
  return out.length>1 ? out : null;
}


/* ---------- สถานะจดหมาย ณ เวลาหนึ่ง ---------- */
function letterState(L, now){
  const legs=L.lg, elapsed=(now-L.s)/3600000;   // ชม.
  let acc=0, prog=0, parked=false, legIdx=0, kind=0, sev=0;
  const perLeg=1/legs.length;
  for(let i=0;i<legs.length;i++){
    const [dur,hold,,,,kd,sv]=legs[i];
    legIdx=i; kind=kd; sev=sv;
    if(elapsed < acc+dur){ prog=(i+(elapsed-acc)/dur)*perLeg; break; }
    acc+=dur;
    if(elapsed < acc+hold){ prog=(i+1)*perLeg; parked=true; break; }
    acc+=hold;
    prog=(i+1)*perLeg;
  }
  const gone    = L.lo>=0 && legIdx>=L.lo;
  const arrived = elapsed>=L.th && L.lo<0;
  if(gone) prog=Math.min(prog,(L.lo+0.5)/legs.length);   /* หายแล้ว = ค้างอยู่ตรงนั้น */
  return {
    prog: clamp(prog,0,1), parked, legIdx, kind, sev, arrived, gone,
    remain: Math.max(0, L.th-elapsed), elapsed
  };
}

/* ---------- ภาษามนุษย์ ---------- */
function fmtDur(h){
  if(h<1) return Math.max(1,Math.round(h*60))+' นาที';
  if(h<24) return Math.round(h)+' ชั่วโมง';
  const d=Math.floor(h/24), r=Math.round(h%24);
  return d+' วัน'+(r?' '+r+' ชม.':'');
}
function windWord(boost){
  if(boost>0.12) return 'ลมวันนี้ไปทางเดียวกับจดหมาย';
  if(boost>0.03) return 'ลมช่วยอยู่บ้าง';
  if(boost>-0.03) return 'ลมเรื่อย ๆ ไม่ช่วยไม่ขวาง';
  if(boost>-0.12) return 'ลมพัดสวนมาเป็นช่วง ๆ';
  return 'ลมย้อนกลับมาเกือบทั้งทาง';
}
function poemFor(sim){
  const s=sim.legs.filter(l=>l[6]>0).length;
  const rain=sim.legs.filter(l=>l[5]===2||l[5]===3).length;
  let p=windWord(sim.boost);
  if(sim.worst===2) p+=' แต่กลางทางมีพายุใหญ่รออยู่';
  else if(s>0) p+=' มีพายุขวางทาง '+s+' ช่วง จดหมายจะจอดรอจนลมสงบ';
  else if(rain>2) p+=' ระหว่างทางฝนตกเป็นระยะ';
  else p+=' ฟ้าเปิดตลอดทาง';
  return p+'.';
}
function kindWord(k){ return ['ฟ้าเปิด','ลมพัด','ฝนปรอย','ฝนหนัก','พายุ'][k]; }

/* ============================================================
   งานวาด — Canvas 2D, procedural line-art
   ยกฟังก์ชันจาก prototype: globe-study / weather-set / ribbon-wind / letter-flutter
   ============================================================ */
const col = a => 'rgba(84,90,104,'+a+')';
const frac = v => v-Math.floor(v);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ชุดสภาพอากาศ 5 ระดับ ---------- */
function wxClear(ctx,cx,cy,t,scale){
  const s=scale||1;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const g=ctx.createRadialGradient(0,-4,0,0,-4,40);
  g.addColorStop(0,'rgba(198,154,84,0.14)');
  g.addColorStop(.5,'rgba(198,154,84,0.05)');
  g.addColorStop(1,'rgba(198,154,84,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-4,40,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=col(.10);ctx.lineWidth=1;ctx.lineCap='round';
  for(let i=0;i<2;i++){
    const yy=-6+i*12+Math.sin(t*.6+i)*1.5;
    ctx.beginPath();ctx.moveTo(-16,yy);ctx.quadraticCurveTo(0,yy-2,16,yy);ctx.stroke();
  }
  ctx.restore();
}
/* ลม = ริ้วไล่จาง (wind6) — เข้มด้านต้นลม จางด้านปลายลม บอกทิศในตัว */
function wxWind(ctx,cx,cy,t,intensity,dir,scale){
  const s=scale||1;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.lineCap='round';
  const flowDir=dir>=0?1:-1, zoneW=130, lines=4;
  const drift=t*(.4+intensity*.5)*flowDir;
  for(let l=0;l<lines;l++){
    const baseY=-30+(l/(lines-1))*60, amp=4+intensity*7, steps=48;
    for(let i=0;i<steps;i++){
      const f0=i/steps,f1=(i+1)/steps;
      const x0=-zoneW/2+f0*zoneW, x1=-zoneW/2+f1*zoneW;
      const y0=baseY+Math.sin(f0*Math.PI*1.2+drift+l*.6)*amp;
      const y1=baseY+Math.sin(f1*Math.PI*1.2+drift+l*.6)*amp;
      const along=flowDir>0?f0:(1-f0);
      ctx.strokeStyle=col((.06+intensity*.28)*Math.pow(along,.7));
      ctx.lineWidth=1+intensity*.9;
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
    }
  }
  ctx.restore();
}
function wxDrizzle(ctx,cx,cy,t,intensity,lean,scale){
  const s=scale||1, zoneW=48, zoneH=48;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.lineCap='round';
  const g=ctx.createRadialGradient(0,0,0,0,0,zoneW);
  g.addColorStop(0,col(.05));g.addColorStop(1,col(0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,zoneW,0,Math.PI*2);ctx.fill();
  const n=Math.round(30+intensity*26);
  for(let i=0;i<n;i++){
    const bx=(frac(Math.sin(i*12.9)*.5+.5)-.5)*zoneW*2;
    const sp=.5+frac(Math.sin(i*5.1)*.5+.5)*.4;
    let by=(frac(Math.sin(i*7.7)*.5+.5)+t*sp); by=(by%1)*zoneH*2-zoneH;
    const depth=frac(Math.sin(i*9.3)*.5+.5), len=2+depth*4;
    ctx.strokeStyle=col((.12+intensity*.28)*(.4+depth*.6));
    ctx.lineWidth=.6+depth*.7;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+lean*len,by+len);ctx.stroke();
  }
  ctx.restore();
}
function wxRain(ctx,cx,cy,t,intensity,lean,scale){
  const s=scale||1, zoneW=52, zoneH=52;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.lineCap='round';
  const n=Math.round(13+intensity*15);
  for(let i=0;i<n;i++){
    const bx=(frac(Math.sin(i*12.9)*.5+.5)-.5)*zoneW*2;
    const sp=.8+frac(Math.sin(i*5.1)*.5+.5)*.5;
    let by=(frac(Math.sin(i*7.7)*.5+.5)+t*sp); by=(by%1)*zoneH*2-zoneH;
    const len=7+frac(Math.sin(i*3.1)*.5+.5)*5, depth=frac(Math.sin(i*9.3)*.5+.5);
    ctx.strokeStyle=col((.22+intensity*.35)*(.5+depth*.5));
    ctx.lineWidth=.8+depth*.8;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+lean*len,by+len);ctx.stroke();
  }
  ctx.restore();
}
/* พายุ = ริ้วม้วนสองชั้น (ข้อ 36)
   แบบเดิมเป็น log-spiral 3 แขน x 2 ชั้น + ghost band หนา 5px = ก้อนทึบชิ้นเดียว
   ในแอปที่เหลือเป็นเส้นโปร่งทั้งหมด จึงหลุดธีม
   แบบนี้พูดภาษาเดียวกับริ้วลม: ชั้นในสั้น แน่น เข้ม (กำแพงตา) · ชั้นนอกยาว กว้าง จาง
   อิมแพคมาจากลมรอบตัวที่วนเข้าหาตาพายุ ไม่ใช่จากความทึบของตัวพายุ */
function wxStorm(ctx,x,y,t,intensity,rich,scale){
  const s=scale||1;
  const size=(9+intensity*15)*s;
  const steps=rich?26:18;          /* LOD: บน globe หยาบได้ · บนการ์ดวาดใหญ่จึงต้องละเอียด */
  ctx.lineCap='round';
  const bands=[
    {arms:7, r0:.46, len:.66, sweep:.95, spin:.34, a:1.00, w:1.00},
    {arms:3, r0:.26, len:.26, sweep:.70, spin:.62, a:1.35, w:1.15}
  ];
  for(const b of bands){
    for(let a=0;a<b.arms;a++){
      const off=a*Math.PI*2/b.arms + t*(b.spin+intensity*.5);
      const r0=size*(b.r0 + (a%2)*.10);
      const sweep=Math.PI*(b.sweep+intensity*.5);
      const head=((t*(.5+intensity*.7))+a*0.21)%1.3;   /* คลื่นสว่างวิ่งไล่ไปตามแขน */
      for(let i=0;i<steps;i++){
        const f0=i/steps, f1=(i+1)/steps;
        const th0=off+f0*sweep, th1=off+f1*sweep;
        const rr0=r0+size*b.len*Math.pow(f0,.85), rr1=r0+size*b.len*Math.pow(f1,.85);
        const along=Math.pow(1-f0,.85);
        const near=Math.max(0,1-Math.abs(f0-head)*4.2);
        const a1=((.12+intensity*.34)*along + near*(.15+intensity*.28)*along)*b.a;
        if(a1<.01) continue;
        ctx.strokeStyle=col(Math.min(.55,a1).toFixed(3));
        /* ความหนาไม่คูณ s: พายุลูกใหญ่ต้องเป็นริ้วบางที่กว้างขึ้น ไม่ใช่ริ้วหนาขึ้น
           ทำให้ scale ใช้คุมขนาดได้อย่างเดียว หน้าโชว์จึงส่งขนาดตามภูมิศาสตร์เข้ามาได้ */
        ctx.lineWidth=((.85+intensity*.95)*(1-f0*.5))*(1+near*.7)*b.w;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(th0)*rr0, y+Math.sin(th0)*rr0);
        ctx.lineTo(x+Math.cos(th1)*rr1, y+Math.sin(th1)*rr1);
        ctx.stroke();
      }
    }
  }
  ctx.lineWidth=.9; ctx.strokeStyle=col((.26+intensity*.22).toFixed(3));
  ctx.beginPath(); ctx.arc(x,y,size*.20,0,Math.PI*2); ctx.stroke();
}
/* ลมจริง (กม./ชม.) → ความเข้มของภาพพายุ */
function stormIntensity(spd){ return clamp((spd-40)/70,.25,1); }
function drawWx(ctx,cx,cy,t,kind,intensity,dir,scale){
  const lean=dir*.55;
  if(kind===0) wxClear(ctx,cx,cy,t,scale);
  else if(kind===1) wxWind(ctx,cx,cy,t,intensity,dir,scale);
  else if(kind===2) wxDrizzle(ctx,cx,cy,t,intensity,lean,scale);
  else if(kind===3) wxRain(ctx,cx,cy,t,intensity,lean,scale);
  else wxStorm(ctx,cx,cy,t,intensity,true,scale);
}

    const out=[];

    }
    return out;
  });
})();
